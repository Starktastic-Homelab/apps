controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 12.4ubu2604-ls60@sha256:b10044530553b2506f06279bf0b5223f9534f434f87a277da4b8fa8ac386cb58
        env:
          JELLYFIN_PublishedServerUrl: "https://benplus.app" # source: globals.yaml → global.domains.media
          # The image ships no Intel OpenCL ICD; without it HDR tone mapping falls back to VPP only.
          # shortcut: floating mod tag installed at every start, pin a digest if Renovate learns DOCKER_MODS.
          DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
          # Intel OpenCL opens /dev/dri/by-path/*-render, which the GPU plugin bind-mounts with the host's
          # render gid. The image default (`/dev/dri ... -type c`) skips those mounts, so abc never joins that
          # group and OpenCL finds no platform. `! -type d` lets init-device-perms add abc to it.
          ATTACHED_DEVICES_PERMS: "/dev/dri ! -type d"
        resources:
          limits:
            gpu.intel.com/i915: "1"
            ephemeral-storage: 12Gi
          requests:
            ephemeral-storage: 12Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
          readiness:
            enabled: true
            # Jellyfin 12 returns HTTP 200 with "Degraded" during migrations.
            # Gate traffic on the body, without turning migration into a liveness failure.
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test "$(curl -fsS --max-time 4 http://127.0.0.1:8096/health)" = Healthy
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
            spec:
              initialDelaySeconds: 30
              failureThreshold: 60
              periodSeconds: 10
    strategy: Recreate
    pod:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
    initContainers:
      disposable-dirs:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 12.4ubu2604-ls60@sha256:b10044530553b2506f06279bf0b5223f9534f434f87a277da4b8fa8ac386cb58
        command:
          - /bin/sh
          - -ec
          - mkdir -p /disposable/cache; chown 1000:1000 /disposable/cache
        securityContext:
          runAsUser: 0
        dependsOn: retained-state
      retained-state:
        image:
          repository: python
          digest: sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - jellyfin
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 8096
  discovery:
    controller: main
    type: ClusterIP
    ports:
      discovery:
        port: 7359
        protocol: UDP
persistence:
  config:
    enabled: false
  jellyfin-config:
    existingClaim: jellyfin-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        disposable-dirs:
          - path: /config
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
  media:
    enabled: true
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /data
        disposable-dirs:
          - path: /data
  disposable:
    enabled: true
    type: emptyDir
    sizeLimit: 10Gi
    advancedMounts:
      main:
        main:
          # Jellyfin 12 transcodes into <CachePath>/transcodes, so this also holds them.
          - path: /config/cache
            subPath: cache
        disposable-dirs:
          - path: /disposable
