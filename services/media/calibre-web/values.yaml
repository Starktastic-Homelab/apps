controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/crocodilestick/calibre-web-automated
          tag: v4.0.8@sha256:1297be5207318acea7030884a2d283ef3e805c745eaeaa4c5602bc3dc9b7f47a
        env:
          NETWORK_SHARE_MODE: "true"
          TRUSTED_PROXY_COUNT: "1"
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /login
            port: 8083
          readiness:
            enabled: true
            type: HTTP
            path: /login
            port: 8083
          startup:
            enabled: true
            type: HTTP
            path: /login
            port: 8083
    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
      securityContext: {}
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - /retained
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
service:
  main:
    controller: main
    ports:
      http:
        port: 8083
persistence:
  config:
    size: 2Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    enabled: false
  calibre-library:
    existingClaim: media-library-pvc
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /calibre-books
            subPath: library/books
  ingest:
    existingClaim: cwa-book-ingest
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /cwa-book-ingest
  retained-data:
    existingClaim: calibre-web-block
    advancedMounts:
      main:
        main:
          - path: /config
            subPath: config
          - path: /calibre-library
            subPath: library
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: calibre-retained-startup-guard
    defaultMode: 292
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
