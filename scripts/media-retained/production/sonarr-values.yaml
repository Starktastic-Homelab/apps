controllers:
  main:
    replicas: 1
    strategy: Recreate
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - sonarr
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
persistence:
  config:
    enabled: false
  retained-config:
    existingClaim: sonarr-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: media-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
  media:
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /data
