apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: config-apps
  namespace: argocd
  annotations:
    # argocd-diff-preview filters ApplicationSets by their OWN metadata.annotations
    # *before* expanding them into Applications, so this coarse gate is required in
    # addition to the per-Application pattern in spec.template below. Without it the
    # appset is skipped and every PR reports an empty diff.
    # Keep it as the union of the patterns spec.template can render.
    argocd-diff-preview/watch-pattern: '^infrastructure/base-configs/.*, ^infrastructure/configs/.*, ^templates/globals\.yaml'
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: base-configs
            path: infrastructure/base-configs
            deployPhase: foundation
          - name: infra-configs
            path: infrastructure/configs
            deployPhase: services
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: deploy-phase
              operator: In
              values:
                - foundation
        - matchExpressions:
            - key: deploy-phase
              operator: In
              values:
                - services
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      finalizers: ["resources-finalizer.argocd.argoproj.io"]
      labels:
        deploy-phase: "{{.deployPhase}}"
      annotations:
        notifications.argoproj.io/subscribe.on-sync-failed.ntfy: ""
        notifications.argoproj.io/subscribe.on-health-degraded.ntfy: ""
        argocd-diff-preview/watch-pattern: '^{{.path}}/.*, ^templates/globals\.yaml'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/Starktastic-Homelab/apps.git
          targetRevision: HEAD
          path: "{{.path}}"
          helm:
            valueFiles:
              - $values/templates/globals.yaml
        - repoURL: https://github.com/Starktastic-Homelab/apps.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 30
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
      ignoreDifferences:
        - group: ""
          kind: PersistentVolumeClaim
          jsonPointers:
            # See cluster-apps.yaml for the rationale (PVC spec.storageClassName
            # is immutable post-bind, but dropped from desired manifests now
            # that nfs-pv is the sole cluster default).
            - /spec/storageClassName
