controllers:
  main:
    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      securityContext:
        supplementalGroups:
          - 1000
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - karakeep
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      retained-meilisearch:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - karakeep-meilisearch
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
    containers:
      meilisearch:
        command:
          - sh
          - -ec
        args:
          - |
            # The index is rebuildable (ADR 0010): an engine change discards it instead of migrating it.
            # Refuse unless /meili_data is the identity-marked volume and the version marker is absent or a readable file.
            test -f /meili_data/.homelab-karakeep-meilisearch-data
            test ! -L /meili_data/.homelab-karakeep-meilisearch-data
            test ! -L /meili_data/.version_marker
            current="$(meilisearch --version | head -1)"
            test -n "$current"
            if [ -e /meili_data/.version_marker ]; then
              stored="$(cat /meili_data/.version_marker)"
            else
              stored=
            fi
            if [ "$current" != "$stored" ]; then
              echo "Meilisearch engine changed (${stored:-no marker} -> $current): discarding /meili_data/data.ms; run Reindex All Bookmarks in Karakeep" >&2
              rm -rf /meili_data/data.ms /meili_data/.version_marker
              echo "$current" >/meili_data/.version_marker
            fi
            exec meilisearch
persistence:
  config:
    enabled: false
  data:
    existingClaim: karakeep-data-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /data
        retained-data:
          - path: /retained
            readOnly: true
  meilisearch:
    existingClaim: karakeep-meilisearch-block
    globalMounts: []
    advancedMounts:
      main:
        meilisearch:
          - path: /meili_data
        retained-meilisearch:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: operations-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
        retained-meilisearch:
          - path: /retained-startup
            readOnly: true
