  <text class="acc" x="40" y="52" font-size="14" font-weight="700" letter-spacing="3">VALUE CASCADE</text>
  <text class="t1" x="40" y="86" font-size="26" font-weight="800">Five value layers, the later file wins</text>
  <g class="t2" font-size="13.5">
    <path class="side" d="M760 48H804"/>
    <text x="814" y="52.5">comes from the base app</text>
    <path class="wire" d="M760 76H794"/><path class="wirehead" d="M804 76l-8 -4.5v9.0z"/>
    <text x="814" y="80.5">loaded next</text>
  </g>

  <!-- the layers -->
  <rect class="card" x="30" y="112" width="300" height="460" rx="20"/><rect class="rim" x="30.5" y="112.5" width="299" height="459" rx="19.5"/>
  <text class="t1" x="46" y="140" font-size="16" font-weight="800">Value files, in load order</text>
  <text class="t2" x="46" y="160" font-size="12.5">the valueFiles list of the chart source</text>
  <path class="rule" d="M46 178H314"/>
  <circle class="badge" cx="60" cy="208" r="12"/><text class="badget" x="60" y="212.5" font-size="13" font-weight="800" text-anchor="middle">1</text>
  <circle class="badge" cx="60" cy="282" r="12"/><text class="badget" x="60" y="286.5" font-size="13" font-weight="800" text-anchor="middle">2</text>
