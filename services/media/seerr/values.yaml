controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
        env:
          LOG_LEVEL: info
          NODE_ENV: production
          DB_TYPE: postgres
          DB_HOST: postgres-postgresql.databases
          DB_PORT: "5432"
          DB_USER: seerr
          DB_NAME: seerr
          DB_POOL_SIZE: "3"
          DB_PASS:
            valueFrom:
              secretKeyRef:
                name: seerr-postgres-secret
                key: password
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/v1/status/appdata
            port: 5055
          readiness:
            enabled: true
            type: HTTP
            path: /api/v1/status/appdata
            port: 5055
          startup:
            enabled: true
            type: HTTP
            path: /api/v1/status/appdata
            port: 5055
    replicas: 1
    strategy: Recreate
    serviceAccount:
      name: seerr-postgres-completion
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - seerr
          - /app/config
          - config
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      enrollment:
        args:
          - --id
          - seerr
          - --database
          - seerr
          - --role
          - seerr
        dependsOn: retained-state
service:
  main:
    controller: main
    ports:
      http:
        port: 5055
persistence:
  config:
    size: 1Gi
    globalMounts:
      - path: /app/config
    enabled: false
  media:
    enabled: false
  seerr-config:
    existingClaim: seerr-files
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /app/config
        retained-state:
          - path: /app/config
            readOnly: true
  retained-startup:
    type: configMap
    name: retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
