title: Starktastic Admin
description: Pulse, media, pipeline, apps, platform and iron
language: en
theme: dark
# The admin accent is violet. Red is kept for alarms (ADR 0020).
color: violet
hideVersion: true
disableIndexing: true
favicon: /icons/favicon.svg
# custom.css swaps in the animated aurora only on wide screens that welcome motion.
background: /images/aurora-still.svg
cardBlur: xl
headerStyle: boxedWidgets
cardStyle: hairline
blockStyle: refined
font: plexData
statusStyle: dot
# Group headers are labels; open panels also never clip a card's glow.
disableCollapse: true
fullWidth: true
target: _blank
providers:
  finnhub: "{{HOMEPAGE_VAR_FINNHUB_KEY}}"
quicklaunch:
  searchDescriptions: true
  showSearchSuggestions: false
  provider: custom
  url: https://search.starktastic.net/search?q=
  mobileButtonPosition: bottom-right
