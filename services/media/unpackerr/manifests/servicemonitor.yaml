apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpackerr
  namespace: media
  labels:
    app.kubernetes.io/name: unpackerr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unpackerr
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
      authorization:
        type: Bearer
        credentials:
          name: unpackerr-webserver
          key: UN_WEBSERVER_API_KEYS_0_KEY
