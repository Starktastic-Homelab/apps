apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-retained-startup-guard
  namespace: media
data:
  guard.py: |
    #!/usr/bin/env python3
    """Read retained CWA identities and native headers before stock initialization."""
    import base64
    import binascii
    import os
    from pathlib import Path
    import stat
    import sys

    DATABASES = ('config/app.db', 'config/gdrive.db', 'config/cwa.db',
                 'library/metadata.db', 'library/.calnotes/notes.db')


    def read_native(root, name, maximum, minimum=1):
        path = root
        for component in Path(name).parts[:-1]:
            path /= component
            if not stat.S_ISDIR(path.lstat().st_mode):
                raise ValueError('Redirected native parent')
        path /= Path(name).name
        with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), 'rb') as source:
            info = os.fstat(source.fileno())
            if not stat.S_ISREG(info.st_mode) or info.st_size < minimum:
                raise ValueError('Missing native file')
            return source.read(maximum)


    def validate(root):
        root = Path(root)
        if root.absolute() != root.resolve(strict=True) or not stat.S_ISDIR(root.lstat().st_mode):
            raise ValueError('Redirected retained root')
        if read_native(root, '.homelab-calibre-web-data', 129) != b'homelab/calibre-web/data/v1\n':
            raise ValueError('Wrong retained CWA identity')
        for name in DATABASES:
            if read_native(root, name, 16, minimum=100) != b'SQLite format 3\0':
                raise ValueError('Wrong native SQLite header')
        raw = read_native(root, 'config/.key', 129)
        if len(raw) != 44 or len(base64.b64decode(raw, altchars=b'-_', validate=True)) != 32:
            raise ValueError('Wrong preserved native encryption key')


    if __name__ == '__main__':
        try:
            if len(sys.argv) != 2:
                raise ValueError('Expected retained root')
            validate(Path(sys.argv[1]))
        except (OSError, ValueError, binascii.Error):
            print('Retained CWA identity/native state refused; recovery acceptance is required.', file=sys.stderr)
            raise SystemExit(1) from None
        print('Retained CWA identity and native state headers accepted.')
