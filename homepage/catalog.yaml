tiles:
  # ---- Pulse: Needs Attention -------------------------------------------------------------------------------
  # Highlights on this page mirror the alert rules in Git (ADR 0020): red where a critical rule would fire,
  # amber where a warning rule would. Every query added with the Pulse board names what proves its metric.
  #
  # The list and the Critical count are what Alertmanager is notifying about now: receiver=ntfy leaves out
  # Watchdog and the alerts routed to "null", and silenced or inhibited alerts are left out, so a silence ends
  # alarm mode. Keyless, in-cluster, as Falco already calls it.
  # Firing reads Prometheus' ALERTS series (as the old Firing Alerts metric did) minus the alert names that
  # kube-prometheus-stack/values.yaml routes away from ntfy: keep the two lists in step. It still counts a
  # silenced alert, which is why Silences sits beside it. alertmanager_* are Alertmanager's own metrics;
  # the failure count covers both webhook receivers, ntfy and the Watchdog heartbeat.
  alerts:
    name: Alerts
    source: services/operations/kube-prometheus-stack
    icon: mdi-bell-alert
    href: https://grafana.internal.starktastic.net/alerting/list
    description: Firing and unsilenced, routed to ntfy
    siteMonitor: null
    app: prometheus
    widgets:
      - type: customapi
        url: http://kube-prometheus-stack-alertmanager.monitoring:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&receiver=ntfy
        refreshInterval: 30000
        display: dynamic-list
        mappings:
          name: labels.alertname
          label: startsAt
          format: relativeDate
          limit: 6
          target: https://grafana.internal.starktastic.net/alerting/groups?alertmanager=alertmanager
      - type: customapi
        url: http://kube-prometheus-stack-alertmanager.monitoring:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&receiver=ntfy&filter=severity%3D%22critical%22
        refreshInterval: 30000
        mappings:
          - label: Critical
            format: size
        highlight:
          Critical:
            numeric:
              - level: danger
                when: gt
                value: 0
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          - label: Firing
            query:
              count(ALERTS{alertstate="firing",alertname!~"Watchdog|InfoInhibitor|KubePodNotReady|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeContainerWaiting|CPUThrottlingHigh|KubeHpaReplicasMismatch"})
              or vector(0)
          - label: Rules Alive
            query: count(ALERTS{alertname="Watchdog",alertstate="firing"}) or vector(0)
          - label: Notify Fails 24h
            query: sum(increase(alertmanager_notifications_failed_total{integration="webhook"}[24h])) or vector(0)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          - label: Silences
            query: sum(alertmanager_silences{state="active"}) or vector(0)
        highlight:
          Firing:
            numeric:
              - level: warn
                when: gt
                value: 0
          Rules Alive:
            numeric:
              - level: danger
                when: eq
                value: 0
          Notify Fails 24h:
            numeric:
              - level: warn
                when: gt
                value: 0
  notifications:
    name: Notifications
    source: services/operations/ntfy
    icon: ntfy.png
    description: Latest push on the alerts topic
    widgets:
      - type: ntfy
        url: http://ntfy.operations:80
        topic: alerts
        key: "{{HOMEPAGE_VAR_NTFY_TOKEN}}"
  # ---- Pulse: Health ----------------------------------------------------------------------------------------
  # kps tiles: source derives href and namespace; app is the pod label (prometheus), not the app.yaml
  # name. They carry no siteMonitor, so null drops the derived one.
  # Restarts: kube_pod_container_status_restarts_total is what ContainerOOMKilled (custom-rules.yaml) reads.
  cluster:
    name: Cluster
    source: services/operations/kube-prometheus-stack
    icon: kubernetes.png
    description: Nodes, pods and restarts
    siteMonitor: null
    app: prometheus
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 30000
        metrics:
          - label: Nodes Ready
            query: sum(kube_node_status_condition{condition="Ready",status="true"})
          - label: Unhealthy Pods
            query:
              sum(max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} or
              {__name__=~"kube_pod_(init_)?container_status_waiting_reason",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}))
          - label: Restarts 1h
            query: floor(sum(increase(kube_pod_container_status_restarts_total[1h])))
            format:
              type: number
              options:
                maximumFractionDigits: 0
        highlight:
          Nodes Ready:
            numeric:
              - level: danger
                when: lt
                value: 3
          Unhealthy Pods:
            numeric:
              - level: warn
                when: gt
                value: 0
          Restarts 1h:
            numeric:
              - level: warn
                when: gte
                value: 3
  # Blackbox probes by tier (prometheus-blackbox-exporter/manifests/probe-external.yaml). Red mirrors the critical
  # rules, BlackboxExternalDepDown and the AdminGate* set; everything else is BlackboxProbeFailed, a warning.
  # Traefik's host comes from infrastructure/configs, not a services app.yaml: nothing derives.
  edge-wan:
    name: Edge & WAN
    icon: mdi-earth
    href: https://traefik.internal.starktastic.net
    description: Internet, the admin gate and probes
    namespace: monitoring
    app: prometheus
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 30000
        metrics:
          - label: Internet
            query: min(probe_success{tier="external"})
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
          - label: Admin Gate
            query: min(probe_success{tier=~"gate|gate-negative"})
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
          - label: Alert Path
            query: min(probe_success{tier="alert-pipeline"})
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
          - label: Failed Probes
            query: (count(probe_success == 0) or vector(0)) and count(probe_success)
        highlight:
          Internet:
            numeric:
              - level: danger
                when: lt
                value: 100
          Admin Gate:
            numeric:
              - level: danger
                when: lt
                value: 100
          Alert Path:
            numeric:
              - level: warn
                when: lt
                value: 100
          Failed Probes:
            numeric:
              - level: warn
                when: gt
                value: 0
  security:
    name: Security
    source: services/operations/kube-prometheus-stack
    icon: crowdsec.png
    description: Bans, detections, bad requests
    siteMonitor: null
    app: prometheus
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          - label: Active Bans
            query: (sum(cs_active_decisions) or vector(0)) and count(up{job="crowdsec-service"} == 1)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          - label: Falco 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total) or 0 * sum by (pod)
              (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          - label: 4xx/5xx 1h
            query:
              (sum(increase(traefik_entrypoint_requests_total{code=~"4..|5.."}[1h])) or vector(0)) and
              count(traefik_entrypoint_requests_total)
            format:
              type: number
              options:
                maximumFractionDigits: 0
  # The two memory rules in custom-rules.yaml, and the ratio ContainerMemoryNearLimit itself computes.
  # node_memory_MemAvailable_bytes is node-exporter, which kube-prometheus-stack scrapes.
  memory:
    name: Memory
    source: services/operations/kube-prometheus-stack
    icon: mdi-memory
    description: Limits, OOM kills, node headroom
    siteMonitor: null
    app: prometheus
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          - label: Near Limit
            query: count(ALERTS{alertname="ContainerMemoryNearLimit",alertstate="firing"}) or vector(0)
          - label: OOM Killed
            query: count(ALERTS{alertname="ContainerOOMKilled",alertstate="firing"}) or vector(0)
          - label: Top Container
            query:
              max(max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on
              (namespace, pod, container) max by (namespace, pod, container)
              (kube_pod_container_resource_limits{resource="memory"}))
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
          - label: Node Free
            query: min(node_memory_MemAvailable_bytes)
            format:
              type: bytes
        highlight:
          Near Limit:
            numeric:
              - level: warn
                when: gt
                value: 0
          OOM Killed:
            numeric:
              - level: danger
                when: gt
                value: 0
          Top Container:
            numeric:
              - level: warn
                when: gte
                value: 90
  # Slots: the recording rule and thresholds of proxmox-csi-capacity.yaml. Volume: PVCSpaceLow and
  # PVCSpaceCritical (10% and 5% free). TSDB: Prometheus' own metrics against its 8GB retentionSize.
  capacity:
    name: Capacity
    source: services/operations/kube-prometheus-stack
    icon: mdi-harddisk
    description: CSI slots, fullest volume, TSDB
    siteMonitor: null
    app: prometheus
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          - label: CSI Slots Free
            query: sum(clamp_min(homelab:proxmox_csi_slots_free:count, 0)) or vector(0)
          - label: Tightest Worker
            query: min(homelab:proxmox_csi_slots_free:count)
          - label: Fullest Volume
            query: max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
          - label: TSDB Use
            query:
              (sum(prometheus_tsdb_storage_blocks_bytes) + sum(prometheus_tsdb_wal_storage_size_bytes) +
              sum(prometheus_tsdb_head_chunks_storage_size_bytes)) / sum(prometheus_tsdb_retention_limit_bytes)
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
        highlight:
          CSI Slots Free:
            numeric:
              - level: danger
                when: eq
                value: 0
              - level: warn
                when: lt
                value: 10
          Tightest Worker:
            numeric:
              - level: warn
                when: lte
                value: 3
          Fullest Volume:
            numeric:
              - level: danger
                when: gte
                value: 95
              - level: warn
                when: gte
                value: 90
  # The two backup CronJobs in infrastructure/base-configs (pg-backup in databases, cert-backup in cert-backup),
  # on the metric and the 26 h threshold of CronJobNotSucceededRecently (custom-rules.yaml).
  backups:
    name: Backups
    source: services/operations/kube-prometheus-stack
    icon: mdi-backup-restore
    description: Database and certificate dumps
    siteMonitor: null
    app: prometheus
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          - label: Postgres Dump
            query:
              (time() - max(kube_cronjob_status_last_successful_time{namespace="databases",cronjob="pg-backup"})) / 3600
            format:
              type: number
              suffix: " h"
              options:
                maximumFractionDigits: 1
          - label: Cert Backup
            query:
              (time() - max(kube_cronjob_status_last_successful_time{namespace="cert-backup",cronjob="cert-backup"})) /
              3600
            format:
              type: number
              suffix: " h"
              options:
                maximumFractionDigits: 1
          - label: Stale Jobs
            query: count(ALERTS{alertname="CronJobNotSucceededRecently",alertstate="firing"}) or vector(0)
        highlight:
          Postgres Dump:
            numeric:
              - level: warn
                when: gt
                value: 26
          Cert Backup:
            numeric:
              - level: warn
                when: gt
                value: 26
          Stale Jobs:
            numeric:
              - level: warn
                when: gt
                value: 0
  streaming-now:
    name: Streaming Now
    source: services/media/jellyfin
    icon: jellyfin.png
    description: Who is watching what
    widgets:
      - type: jellyfin
        version: 2
        url: http://jellyfin-main.media:8096
        key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        enableBlocks: false
        enableNowPlaying: true
        enableUser: true
        showEpisodeNumber: true
  # Navidrome's now-playing readout, apart from its launcher. Admin only: it shows who is listening (ADR 0018).
  listening-now:
    name: Listening Now
    icon: navidrome.png
    href: https://music.benplus.app
    description: Who is listening to what
    widgets:
      - type: navidrome
        url: http://navidrome.media:4533
        user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
        token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
        salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
  # No href. Household reads the iCal feeds (no *arr widgets there); admin uses the *arr tiles by ref.
  calendar:
    name: Calendar
    audience: household
    icon: mdi-calendar-star
    description: TV blue and cyan · Movies fuchsia and purple · Music teal
    override:
      household:
        description: New episodes and movie releases
    widgets:
      # Household: iCal only, so the browser gets ICS text and never *arr JSON (ADR 0018). The padded windows
      # keep a feed from ever going empty, which Homepage shows as an error. No red: it means an alarm (ADR 0020).
      - audience: household-only
        type: calendar
        view: agenda
        maxEvents: 12
        previousDays: 0
        showTime: true
        integrations:
          - type: ical
            url: "http://sonarr.media:8989/feed/v3/calendar/Sonarr.ics?apikey={{HOMEPAGE_VAR_SONARR_KEY}}&pastDays=30&futureDays=14"
            name: TV
            color: blue
            params:
              showName: true
          - type: ical
            url: "http://radarr.media:7878/feed/v3/calendar/Radarr.ics?apikey={{HOMEPAGE_VAR_RADARR_KEY}}&releaseTypes=digitalRelease&pastDays=60&futureDays=90"
            name: Movies
            color: fuchsia
            params:
              showName: true
      - type: calendar
        view: agenda
        maxEvents: 14
        previousDays: 0
        showTime: true
        integrations:
          - ref: sonarr
            color: blue
          - ref: sonarr-ru
            color: cyan
          - ref: radarr
            color: fuchsia
          - ref: radarr-ru
            color: purple
          - ref: lidarr
            color: teal
  # Stocks left the header for a tile. The provider key stays in admin's settings.yaml.
  markets:
    name: Markets
    icon: mdi-chart-line
    description: Watchlist and US market status
    widgets:
      - type: stocks
        provider: finnhub
        showUSMarketStatus: true
        watchlist:
          - NVDA
          - AMD
          - INTC
          - MSFT
          - GOOGL
          - AAPL
          - TSM
  # Off-cluster: explicit.
  hacker-news:
    name: Hacker News
    icon: mdi-newspaper-variant
    href: https://news.ycombinator.com
    description: Hacker News front page
    widgets:
      - type: customapi
        url: https://hn.algolia.com/api/v1/search?tags=front_page
        refreshInterval: 600000
        display: dynamic-list
        mappings:
          items: hits
          name: title
          label: points
          limit: 6
          format: number
          target: https://news.ycombinator.com/item?id={objectID}
  # ---- Media and Pipeline extras (spec §8 step 1) -------------------------------------------------------------
  # Widgets on keys admin already holds. None is proven by Git or the mock: each is checked on the live page
  # after merge and fixed or removed there. No alert rule covers these apps, so nothing here turns red.
  # An empty dynamic-list reads "No items found", so a list that is often empty gets a tile whose name says
  # what is missing.
  #
  # Admin only (widgets default to admin): the API key is always Administrator and the log names who watched
  # what. Household gets its own counts on the household token (ADR 0018).
  jellyfin:
    name: Jellyfin
    audience: household
    source: services/media/jellyfin
    icon: jellyfin.png
    description: Movies, TV & anime
    override:
      admin:
        description: Movies, TV & anime · recent playback
    widgets:
      # Household's library totals, on the token of the non-admin user `homepage-household` (ADR 0018). Jellyfin
      # answers for the token's own user, so the totals cover only the libraries that user was given.
      - audience: household-only
        type: customapi
        url: http://jellyfin-main.media:8096/Items/Counts
        headers: &jellyfin_household_auth
          Authorization: MediaBrowser Token="{{HOMEPAGE_VAR_JELLYFIN_HOUSEHOLD_TOKEN}}"
        refreshInterval: 3600000
        mappings:
          - field: MovieCount
            label: Movies
            format: number
          - field: SeriesCount
            label: Series
            format: number
          - field: EpisodeCount
            label: Episodes
            format: number
      - type: customapi
        url: http://jellyfin-main.media:8096/System/Info
        headers: &jellyfin_auth
          Authorization: MediaBrowser Token="{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        refreshInterval: 300000
        mappings:
          - field: Version
            label: Version
          - field: HasPendingRestart
            label: Restart
            remap:
              - value: true
                to: Pending
              - value: false
                to: Not needed
        highlight:
          Restart:
            string:
              - level: warn
                when: equals
                value: Pending
      - type: customapi
        url: http://jellyfin-main.media:8096/System/ActivityLog/Entries?limit=6&type=VideoPlayback
        headers: *jellyfin_auth
        refreshInterval: 60000
        display: dynamic-list
        mappings:
          items: Items
          name: Name
          label: Date
          format: relativeDate
          limit: 6
  # Jellyfin's newest arrivals. Tiles of their own, so no label hangs on a widget's position (ADR 0020). Both
  # pages run them on the household token: Items/Latest answers for the token's own user, and admin's API key
  # has no user. No link on the tile; each row opens its item.
  new-movies:
    name: New movies
    audience: household
    icon: mdi-movie-open
    description: Latest additions
    widgets:
      - audience: household
        type: customapi
        url: http://jellyfin-main.media:8096/Items/Latest?IncludeItemTypes=Movie&Limit=6&Fields=DateCreated
        headers: *jellyfin_household_auth
        refreshInterval: 900000
        display: dynamic-list
        mappings:
          name: Name
          label: DateCreated
          format: relativeDate
          limit: 6
          target: https://benplus.app/web/#/details?id={Id}&serverId={ServerId}
  # One row per series, newest episode first: the series sorted by when content was last added to them. (One row
  # per episode showed a series six times when a season landed at once.) A row opens the series.
  new-episodes:
    name: New episodes
    audience: household
    icon: mdi-television-play
    description: Latest additions
    widgets:
      - audience: household
        type: customapi
        url: http://jellyfin-main.media:8096/Items?IncludeItemTypes=Series&Recursive=true&SortBy=DateLastContentAdded&SortOrder=Descending&Limit=6&Fields=DateLastMediaAdded
        headers: *jellyfin_household_auth
        refreshInterval: 900000
        display: dynamic-list
        mappings:
          items: Items
          name: Name
          label: DateLastMediaAdded
          format: relativeDate
          limit: 6
          target: https://benplus.app/web/#/details?id={Id}&serverId={ServerId}
  dispatcharr:
    name: Dispatcharr
    source: services/media/dispatcharr
    icon: dispatcharr.png
    description: Live TV & IPTV proxy
    widgets:
      - type: dispatcharr
        url: http://dispatcharr.media:9191
        username: "{{HOMEPAGE_VAR_DISPATCHARR_USER}}"
        password: "{{HOMEPAGE_VAR_DISPATCHARR_PASS}}"
        enableActiveStreams: true
  cineplete:
    name: Cineplete
    source: services/media/cineplete
    icon: mdi-movie-open-check
    description: What is left to watch
  # ingress.enabled is false in its app.yaml, so nothing derives.
  navidrome:
    name: Navidrome
    audience: household
    icon: navidrome.png
    href: https://music.benplus.app
    description: Music streaming
    siteMonitor: http://navidrome.media:4533
    namespace: media
    app: navidrome
  audiobookshelf:
    name: Audiobookshelf
    audience: household
    source: services/media/audiobookshelf
    icon: audiobookshelf.png
    description: Audiobooks & podcasts
    widgets:
      - type: audiobookshelf
        url: http://audiobookshelf.media:80
        key: "{{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}"
  # Who is listening now. /api/sessions/open answers only an admin-type user's key, and carries client IPs.
  audiobookshelf-sessions:
    name: Audiobook Sessions
    icon: audiobookshelf.png
    href: https://audiobooks.benplus.app/config/sessions
    description: Open listening sessions
    widgets:
      - type: customapi
        url: http://audiobookshelf.media:80/api/sessions/open
        headers:
          Authorization: Bearer {{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}
        refreshInterval: 30000
        display: dynamic-list
        mappings:
          items: sessions
          name: displayTitle
          label: user.username
          limit: 5
          target: https://audiobooks.benplus.app/item/{libraryItemId}
  calibre-web:
    name: Calibre-Web
    audience: household
    source: services/media/calibre-web
    monitorPath: /opds
    icon: calibre-web.png
    description: E-book library
    widgets:
      # One login for both pages: the Calibre-Web user `homepage-household`, which has no roles (ADR 0018).
      - audience: household
        type: calibreweb
        url: http://calibre-web.media:8083
        username: "{{HOMEPAGE_VAR_CALIBRE_HOUSEHOLD_USER}}"
        password: "{{HOMEPAGE_VAR_CALIBRE_HOUSEHOLD_PASS}}"
  immich:
    name: Immich
    audience: household
    source: services/media/immich
    icon: immich.png
    description: Photos & videos
    override:
      admin:
        description: Photos & videos · jobs waiting
    widgets:
      - type: immich
        url: http://immich-main.media:2283
        key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
        version: 2
      # The first six job queues in Immich's own order (a list cannot sort or filter). Needs queue.read on the key.
      - type: customapi
        url: http://immich-main.media:2283/api/queues
        headers:
          x-api-key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
        refreshInterval: 60000
        display: dynamic-list
        mappings:
          name: name
          label: statistics.waiting
          format: number
          limit: 6
  seerr:
    name: Seerr
    audience: household
    source: services/media/seerr
    icon: overseerr.png
    description: Request movies & TV
    # Request counts cover every account's requests, so only admin shows them (ADR 0018, amended 2026-11-14).
    widgets:
      - type: seerr
        url: http://seerr.media:5055
        key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
  seerr-ru:
    name: Seerr RU
    audience: household
    source: services/media/seerr-ru
    icon: overseerr.png
    description: Requests — Russian trackers
    override:
      household:
        description: Request movies & TV (RU)
    widgets:
      - type: seerr
        url: http://seerr-ru.media:5055
        key: "{{HOMEPAGE_VAR_SEERR_RU_KEY}}"
  shelfmark:
    name: Shelfmark
    audience: household
    source: services/media/shelfmark
    icon: mdi-bookshelf
    description: Request books
  excalidash:
    name: Excalidash
    audience: household
    source: services/operations/excalidash
    icon: excalidraw.png
    description: Whiteboard & diagrams
  bytestash:
    name: ByteStash
    source: services/operations/bytestash
    icon: bytestash.png
    description: Code snippets
  # ingress.enabled is false in its app.yaml, so nothing derives.
  microbin:
    name: MicroBin
    audience: household
    icon: microbin.png
    href: https://microbin.starktastic.net
