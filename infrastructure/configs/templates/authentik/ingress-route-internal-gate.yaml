apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-internal-gate-route
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Internal entrypoint only: the gate's login callback never reaches the public LB (ADR 0014).
  entryPoints:
    - websec-int
  routes:
    - match: Host(`auth.{{ .Values.global.domains.internal }}`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      services:
        - name: ak-outpost-internal-gate
          port: 9000
  tls: {}
