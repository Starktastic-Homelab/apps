  <circle class="badge" cx="60" cy="504" r="12"/><text class="badget" x="60" y="508.5" font-size="13" font-weight="800" text-anchor="middle">5</text>
  <path class="wire" d="M60 222V260"/><path class="wirehead" d="M60 269l-4.5 -8h9.0z"/>
  <path class="wire" d="M60 296V334"/><path class="wirehead" d="M60 343l-4.5 -8h9.0z"/>
  <path class="wire" d="M60 370V408"/><path class="wirehead" d="M60 417l-4.5 -8h9.0z"/>
  <path class="wire" d="M60 444V482"/><path class="wirehead" d="M60 491l-4.5 -8h9.0z"/>
  <g class="t1" font-size="13.5" font-weight="700">
    <text class="mono" x="82" y="213">templates/globals.yaml</text>
    <text class="mono" x="82" y="287">templates/common.yaml</text>
    <text class="mono" x="82" y="361">commonValuesExtras</text>
    <text x="82" y="435">base or own <tspan class="mono">values.yaml</tspan></text>
    <text x="82" y="509">variant <tspan class="mono">values.yaml</tspan></text>
  </g>
  <g class="t2" font-size="12.5">
    <text x="82" y="234">every app: domains, load balancer</text>
    <text x="82" y="251">addresses, NFS server, VLANs</text>
    <text x="82" y="308">services only: time zone, user IDs,</text>
    <text x="82" y="325">probe limits, the /config volume</text>
    <text x="82" y="382">extra files an app.yaml lists (*arr</text>
    <text x="82" y="399">probes), then the retained guard</text>
    <text x="82" y="456">the app's own file, or the base</text>
    <text x="82" y="473">app's when baseApp is set</text>
    <text x="82" y="530">the variant's own file, only with</text>
    <text x="82" y="547">valuesOverride: true</text>
  </g>

  <!-- base app -->
