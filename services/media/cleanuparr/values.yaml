# Cleanuparr sweeps *arr queue items that can never import. Sonarr keeps
# completed-but-rejected downloads in the queue forever (removeCompletedDownloads
# only fires after a successful import), and autobrr's push grabs regularly
# produce them: the release *title* is scored at grab time, the *filenames*
# inside the torrent are scored at import time, and the two disagree.
#
# Config lives in PostgreSQL; retained /config preserves keys and settings, so
# there is no ConfigMap here. Only the Queue Cleaner is intended to be enabled —
# qbit-manage already owns share limits and orphan/noHL removal, so Cleanuparr's
# Download Cleaner is deliberately left off and /data is not mounted.
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/cleanuparr/cleanuparr
          tag: 2.11.1@sha256:923c2fe435e22fc58d261bacd2d6bbd8eb1ba3f95358803a8e4d3287ffd919d3
        env:
          PORT: "11011"
          DATABASE_PROVIDER: postgres
          POSTGRES_HOST: postgres-postgresql.databases
          POSTGRES_PORT: "5432"
          POSTGRES_USER: cleanuparr
          POSTGRES_DB: cleanuparr
          POSTGRES_PASS:
            valueFrom:
              secretKeyRef:
                name: cleanuparr-postgres-secret
                key: password
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 11011
          readiness:
            enabled: true
            type: HTTP
            path: /health
            port: 11011
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 11011
    replicas: 1
    strategy: Recreate
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - cleanuparr
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      enrollment:
        command:
          - python3
          - -B
          - /gate/completion_gate.py
        args:
          - --id
          - cleanuparr
          - --database
          - cleanuparr
          - --role
          - cleanuparr
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        dependsOn: retained-state
    serviceAccount:
      name: cleanuparr-postgres-completion
service:
  main:
    controller: main
    ports:
      http:
        port: 11011
persistence:
  config:
    enabled: false
  retained-config:
    existingClaim: cleanuparr-files
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
  pg-completion-script:
    type: configMap
    name: cleanuparr-postgres-completion
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate
            readOnly: true
  pg-completion-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate-api
            readOnly: true
