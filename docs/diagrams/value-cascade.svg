  <rect class="wf" x="744" y="194" width="312" height="28" rx="8"/><text class="wft mono" x="754" y="212.375" font-size="12.5">templates/globals.yaml</text>
  <rect class="wf" x="744" y="268" width="312" height="28" rx="8"/><text class="wft mono" x="754" y="286.375" font-size="12.5">templates/common.yaml</text>
  <rect class="wf" x="744" y="342" width="312" height="28" rx="8"/><text class="wft mono" x="754" y="360.375" font-size="12.5">templates/media-arr-common.yaml</text>
  <rect class="wf" x="744" y="416" width="312" height="28" rx="8"/><text class="wft mono" x="754" y="434.375" font-size="12.5">services/media/radarr/values.yaml</text>
  <rect class="wf" x="744" y="490" width="312" height="28" rx="8"/><text class="wft mono" x="754" y="508.375" font-size="12.5">services/media/radarr-ru/values.yaml</text>
  <g class="t2" font-size="12.5">
    <text x="744" y="388">named again in its own app.yaml</text>
    <text x="744" y="462">radarr's file, because baseApp points there</text>
    <text x="744" y="536">only what differs: hosts, its own volume claim</text>
  </g>
  <path class="side" d="M678 430H734"/><path class="sidehead" d="M743 430l-9 -5v10z"/>

  <!-- the ingress chart -->
  <rect class="lane" x="30" y="596" width="1040" height="116" rx="22"/><rect class="rim" x="30.5" y="596.5" width="1039" height="115" rx="21.5"/>
  <text class="acc" x="48" y="621" font-size="11.5" font-weight="700" letter-spacing="1.5">INGRESS CHART · A VARIANT'S ROUTE IS LAYERED THE SAME WAY</text>
  <rect class="wf" x="46" y="636" width="196" height="28" rx="8"/><text class="wft mono" x="56" y="654.375" font-size="12.5">templates/globals.yaml</text>
  <rect class="wf" x="282" y="636" width="260" height="28" rx="8"/><text class="wft mono" x="292" y="654.375" font-size="12.5">services/media/radarr/app.yaml</text>
  <rect class="wf" x="582" y="636" width="282" height="28" rx="8"/><text class="wft mono" x="592" y="654.375" font-size="12.5">services/media/radarr-ru/app.yaml</text>
  <path class="wire" d="M244 650H272"/><path class="wirehead" d="M281 650l-8 -4.5v9.0z"/>
  <path class="wire" d="M544 650H572"/><path class="wirehead" d="M581 650l-8 -4.5v9.0z"/>
  <path class="edge" d="M866 650H895"/><path class="flow" d="M866 650H895"/><path class="head" d="M905 650l-10 -5.5v11.0z"/>
  <rect class="chip" x="906" y="633" width="148" height="34" rx="10"/><text class="chipt" x="980" y="654.68" font-size="13" font-weight="700" text-anchor="middle">host radarr-ru</text>
  <text class="t2" x="46" y="692" font-size="12.5">radarr-ru's app.yaml names its own host; domainType, port, auth and rateLimit come from radarr's.</text>

  <text class="t3" x="40" y="744" font-size="12.5">Infrastructure apps load globals.yaml, then their own values.yaml. Six apps are variants: five -ru apps, and homepage on homepage-admin.</text>
</svg>
