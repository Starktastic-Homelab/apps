# Cleanuparr sweeps *arr queue items that can never import. Sonarr keeps
# completed-but-rejected downloads in the queue forever (removeCompletedDownloads
# only fires after a successful import), and autobrr's push grabs regularly
# produce them: the release *title* is scored at grab time, the *filenames*
# inside the torrent are scored at import time, and the two disagree.
#
# Config lives in PostgreSQL; retained /config preserves keys and settings, so
# there is no ConfigMap here. Only the Queue Cleaner is intended to be enabled —
# qbit-manage already owns share limits and orphan/noHL removal, so Cleanuparr's
# Download Cleaner is deliberately left off and /data is not mounted.
controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/cleanuparr/cleanuparr
          tag: 2.10.6@sha256:8136c3beda7aa217012657e0ee31f0473ff4ae7e54a156730ff04523987fa815
        env:
          PORT: "11011"
          DATABASE_PROVIDER: postgres
          POSTGRES_HOST: postgres-postgresql.databases
          POSTGRES_PORT: "5432"
          POSTGRES_USER: cleanuparr
          POSTGRES_DB: cleanuparr
          POSTGRES_PASS:
            valueFrom:
              secretKeyRef:
                name: cleanuparr-postgres-secret
                key: password
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 11011
          readiness:
            enabled: true
            type: HTTP
            path: /health
            port: 11011
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 11011
    replicas: 1
    strategy: Recreate
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - cleanuparr
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
          DATABASE_PROVIDER: postgres
          POSTGRES_HOST: postgres-postgresql.databases
          POSTGRES_PORT: "5432"
          POSTGRES_USER: cleanuparr
          POSTGRES_DB: cleanuparr
          POSTGRES_PASS:
            valueFrom:
              secretKeyRef:
                name: cleanuparr-postgres-secret
                key: password
      enrollment:
        command:
          - python3
          - -B
          - /gate/completion_gate.py
        args:
          - --id
          - cleanuparr
          - --database
          - cleanuparr
          - --role
          - cleanuparr
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        dependsOn: retained-state
      database:
        command:
          - /bin/sh
          - -ec
          - export PGPASSWORD="$(cat /credentials/password)"; exec psql -XqAt -v ON_ERROR_STOP=1 -f
            /retained-database/main.sql >/dev/null 2>&1
        env:
          - name: PGHOST
            value: postgres-postgresql.databases
          - name: PGPORT
            value: "5432"
          - name: PGUSER
            value: cleanuparr
          - name: PGDATABASE
            value: cleanuparr
          - name: PGCONNECT_TIMEOUT
            value: "10"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        image:
          repository: postgres:18.6-alpine
          digest: sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        dependsOn: enrollment
    serviceAccount:
      name: cleanuparr-postgres-completion
service:
  main:
    controller: main
    ports:
      http:
        port: 11011
persistence:
  config:
    enabled: false
  retained-config:
    existingClaim: cleanuparr-files
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: media-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
  pg-completion-script:
    type: configMap
    name: cleanuparr-postgres-completion
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate
            readOnly: true
  pg-completion-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate-api
            readOnly: true
  pg-completion-password:
    type: secret
    name: cleanuparr-postgres-secret
    defaultMode: 292
    items:
      - key: password
        path: password
    globalMounts: []
    advancedMounts:
      main:
        database:
          - path: /credentials
            readOnly: true
  retained-database:
    type: configMap
    name: cleanuparr-retained-database-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        database:
          - path: /retained-database
            readOnly: true
