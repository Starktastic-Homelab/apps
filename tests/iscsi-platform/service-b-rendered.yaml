---
# Source: app-template/templates/common.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: service-b
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: service-b
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: service-b
    helm.sh/chart: app-template-5.2.1
  namespace: iscsi-fixture
spec:
  revisionHistoryLimit: 3
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: service-b
      app.kubernetes.io/instance: service-b
  serviceName: service-b
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: service-b
        app.kubernetes.io/name: service-b
    spec:
      enableServiceLinks: false
      serviceAccountName: service-b
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - command:
            - python
            - /fixture/fixture.py
            - serve
          env:
            - name: SERVICE_MARKER
              value: acf2d3d9-d886-4e8e-8a29-c2e2d13ae61a
          image: docker.io/library/python:3.13-alpine@sha256:f3ebba2ace255c93267a0278da88c7f1044432991abc4e6ad20d22e34dd0f8ee
          imagePullPolicy: IfNotPresent
          name: main
          readinessProbe:
            exec:
              command:
                - python
                - /fixture/fixture.py
                - verify
            periodSeconds: 10
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 24Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /fixture
              name: fixture
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: service-b
        - configMap:
            name: sqlite-fixture
          name: fixture
