apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - seerr-telegram-bot-secret.yaml

# The Deployment comes from app-template in another Argo source, so the name must
# stay fixed; Reloader restarts the pod when bot.py changes.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: seerr-telegram-bot
    namespace: media
    files:
      - bot.py
