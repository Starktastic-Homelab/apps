controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/karakeep-app/karakeep
          tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
        resources:
          requests:
            memory: 512Mi
        env:
          DATA_DIR: "/data"
          NEXTAUTH_URL: "https://karakeep.starktastic.net"
          MEILI_ADDR: "http://localhost:7700"
          BROWSER_WEB_URL: "http://localhost:9222"
          DISABLE_PASSWORD_AUTH: "true"
          LOG_LEVEL: "notice"
          # Authentik OIDC
          OAUTH_WELLKNOWN_URL: "https://auth.starktastic.net/application/o/karakeep/.well-known/openid-configuration"
          OAUTH_PROVIDER_NAME: "authentik"
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
        envFrom:
          - secretRef:
              name: karakeep-secret
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 3000
            path: /
          readiness:
            enabled: true
            type: HTTP
            port: 3000
            path: /
          startup:
            enabled: true
            type: TCP
            port: 3000
            spec:
              failureThreshold: 30
              periodSeconds: 5
      chrome:
        image:
          # ponytail: gcr.io/zenika-hub mirror returns 403 (GCR retired); Docker Hub has the same digest
          repository: zenika/alpine-chrome
          tag: "124@sha256:eb3378c1ed0079f94db054a5fe1aaa790a254ec0d6bbc67eda052420d86a179d"
        args:
          - --no-sandbox
          - --disable-gpu
          - --disable-dev-shm-usage
          - --remote-debugging-address=0.0.0.0
          - --remote-debugging-port=9222
          - --hide-scrollbars
        securityContext:
          capabilities:
            add:
              - SYS_ADMIN
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
      meilisearch:
        image:
          repository: getmeili/meilisearch
          tag: v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
        command:
          - sh
          - -ec
        args:
          - |
            # The index is rebuildable (ADR 0010): an engine change discards it instead of migrating it.
            # Refuse unless /meili_data is the identity-marked volume and the version marker is absent or a readable file.
            test -f /meili_data/.homelab-karakeep-meilisearch-data
            test ! -L /meili_data/.homelab-karakeep-meilisearch-data
            test ! -L /meili_data/.version_marker
            current="$(meilisearch --version | head -1)"
            test -n "$current"
            if [ -e /meili_data/.version_marker ]; then
              stored="$(cat /meili_data/.version_marker)"
            else
              stored=
            fi
            if [ "$current" != "$stored" ]; then
              echo "Meilisearch engine changed (${stored:-no marker} -> $current): discarding /meili_data/data.ms; run Reindex All Bookmarks in Karakeep" >&2
              rm -rf /meili_data/data.ms /meili_data/.version_marker
              echo "$current" >/meili_data/.version_marker
            fi
            exec meilisearch
        env:
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: "production"
        envFrom:
          - secretRef:
              name: karakeep-secret
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      securityContext:
        supplementalGroups:
          - 1000
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - karakeep
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      retained-meilisearch:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - karakeep-meilisearch
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  config:
    enabled: false
  data:
    existingClaim: karakeep-data-block
    advancedMounts:
      main:
        main:
          - path: /data
        retained-data:
          - path: /retained
            readOnly: true
    globalMounts: []
  meilisearch:
    existingClaim: karakeep-meilisearch-block
    advancedMounts:
      main:
        meilisearch:
          - path: /meili_data
        retained-meilisearch:
          - path: /retained
            readOnly: true
    globalMounts: []
  retained-startup:
    type: configMap
    name: operations-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
        retained-meilisearch:
          - path: /retained-startup
            readOnly: true
