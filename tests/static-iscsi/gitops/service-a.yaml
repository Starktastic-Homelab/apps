apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
  labels:
    app.kubernetes.io/instance: service-a
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: service-a
    helm.sh/chart: app-template-5.2.1
  namespace: iscsi-fixture
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: service-a
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: service-a
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: service-a
    helm.sh/chart: app-template-5.2.1
  namespace: iscsi-fixture
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: service-a
      app.kubernetes.io/instance: service-a
  serviceName: service-a
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: service-a
        app.kubernetes.io/name: service-a
        storage-lab/writer: "true"
    spec:
      enableServiceLinks: false
      serviceAccountName: service-a
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
        - command:
            - python
            - /fixture/fixture.py
            - serve
          env:
            - name: SERVICE_MARKER
              value: 7108c096-03c4-4026-8fb9-ee51bffcf562
          image: docker.io/library/python:3.13-alpine@sha256:f3ebba2ace255c93267a0278da88c7f1044432991abc4e6ad20d22e34dd0f8ee
          imagePullPolicy: IfNotPresent
          name: main
          readinessProbe:
            exec:
              command:
                - python
                - /fixture/fixture.py
                - verify
            periodSeconds: 10
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 24Mi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /fixture
              name: fixture
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: service-a
        - configMap:
            name: sqlite-fixture
          name: fixture
