apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-block
  namespace: operations
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: proxmox-retained
  volumeName: paperless-data-block
  resources:
    requests:
      storage: 1Gi
