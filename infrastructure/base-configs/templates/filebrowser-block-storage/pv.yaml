apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-data-block
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: proxmox-retained
  claimRef:
    name: filebrowser-data-block
    namespace: operations
  csi:
    driver: csi.proxmox.sinextra.dev
    fsType: ext4
    volumeHandle: homelab//k3s-block/9999/vm-9999-filebrowser.raw
    volumeAttributes:
      storage: k3s-block
      cache: none
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/region
              operator: In
              values: [homelab]
            - key: topology.kubernetes.io/zone
              operator: In
              values: [pve]
