apiVersion: v1
kind: Service
metadata:
  name: argocd-controller-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: argocd-application-controller
  ports:
    - name: metrics
      protocol: TCP
      port: 8082
      targetPort: 8082
