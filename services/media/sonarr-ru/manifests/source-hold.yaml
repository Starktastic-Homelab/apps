apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sonarr-ru-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: held-data-claim
      expression:
        has(object.spec.volumes) && object.spec.volumes.exists(v, (object.metadata.namespace == 'media' &&
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'sonarr-ru') || (has(v.nfs) && (v.nfs.path
        == '/mnt/apps/pv/media/sonarr-ru' || v.nfs.path.startsWith('/mnt/apps/pv/media/sonarr-ru/'))))
  validations:
    - expression: "false"
      message: The preserved sonarr-ru NFS source is held; recovery acceptance is required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sonarr-ru-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: sonarr-ru-source-hold
  validationActions:
    - Deny
