apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: metrics
spec:
  jobLabel: traefik
  endpoints:
    - targetPort: metrics
      path: /metrics
      # traefik_service_* metrics name the Traefik service in their own `service` label.
      # Without this it is renamed exported_service and `service` is the Kubernetes
      # Service (traefik-metrics), which empties the official Traefik dashboards.
      honorLabels: true
  namespaceSelector:
    matchNames:
      - traefik-system
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: metrics
