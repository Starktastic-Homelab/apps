{{- range $v := (.Files.Get "files/retained-volumes.json" | fromJsonArray) }}
{{- if eq $v.origin "new" }}
---
# Marker-only guard: a new volume has no native files, so only the identity marker the reconciler wrote is checked.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-retained-guard" $v.id | quote }}
  namespace: {{ $v.namespace | quote }}
data:
  guard.py: |
    #!/usr/bin/env python3
    """Refuse a retained volume whose identity marker is missing or wrong; changes nothing."""
    import os
    import stat
    import sys

    ID = {{ $v.id | quote }}


    def main(root):
        marker = os.path.join(root, '.homelab-' + ID + '-data')
        try:
            fd = os.open(marker, os.O_RDONLY | os.O_NOFOLLOW)
            with os.fdopen(fd, 'rb') as f:
                info = os.fstat(f.fileno())
                ok = stat.S_ISREG(info.st_mode) and 0 < info.st_size <= 128 and f.read(129) == ('homelab/' + ID + '/data/v1\n').encode()
        except OSError:
            ok = False
        if not ok:
            print('Retained volume refused: identity marker missing or wrong.', file=sys.stderr)
            raise SystemExit(1)
        print('Retained volume identity accepted.')


    if len(sys.argv) != 2:
        raise SystemExit('Expected the volume root')
    main(sys.argv[1])
{{- end }}
{{- end }}
