apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: home-assistant-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: held-source
      expression:
        has(object.spec.volumes) && object.spec.volumes.exists(v, (object.metadata.namespace == "home-automation" &&
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ["home-assistant-config",
        "matter-server-data"]) || (has(v.nfs) && (v.nfs.path == "/mnt/apps/pv/home-automation/home-assistant-config" ||
        v.nfs.path.startsWith("/mnt/apps/pv/home-automation/home-assistant-config/") || v.nfs.path ==
        "/mnt/apps/pv/home-automation/matter-server-data" ||
        v.nfs.path.startsWith("/mnt/apps/pv/home-automation/matter-server-data/"))))
  validations:
    - expression: "false"
      message: Preserved home-assistant NFS state is retired; recovery acceptance is required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: home-assistant-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: home-assistant-source-hold
  validationActions:
    - Deny
