apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-block
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: proxmox-retained
  volumeName: grafana-data-block
  resources:
    requests:
      storage: 2Gi
