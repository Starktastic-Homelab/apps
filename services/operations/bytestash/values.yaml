controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/jordan-dalby/bytestash
          tag: 1.5.12@sha256:eb4f736b8cd45443be0ed6d8da3ee49b76dbf27f4d3925b81b3c407207e62531
        env:
          # Auth
          ALLOW_NEW_ACCOUNTS: "false"
          DISABLE_INTERNAL_ACCOUNTS: "true"
          # OIDC
          OIDC_ENABLED: "true"
          OIDC_DISPLAY_NAME: "Authentik"
          OIDC_ISSUER_URL: "https://auth.starktastic.net/application/o/bytestash/"
          # Session
          TOKEN_EXPIRY: "24h"
        envFrom:
          - secretRef:
              name: bytestash-secret
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 5000
          readiness:
            enabled: true
            type: TCP
            port: 5000
          startup:
            enabled: true
            type: TCP
            port: 5000
            spec:
              failureThreshold: 30
              periodSeconds: 5

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      securityContext:
        supplementalGroups:
          - 1000
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - bytestash
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 5000

persistence:
  data:
    existingClaim: bytestash-data-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /data/snippets
        retained-data:
          - path: /retained
            readOnly: true
  config:
    enabled: false
  retained-startup:
    type: configMap
    name: operations-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
