controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/dgtlmoon/changedetection.io
          tag: 0.55.7@sha256:736331d2787f94d3201b64aa641e090f67e28577ba505bd7ba5d7c1841e1e0ca
        env:
          PLAYWRIGHT_DRIVER_URL: "ws://localhost:3000"
          BASE_URL: "https://changedetection.internal.starktastic.net"
          USE_X_SETTINGS: "1"
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 5000
            path: /
          readiness:
            enabled: true
            type: HTTP
            port: 5000
            path: /
          startup:
            enabled: true
            type: TCP
            port: 5000
            spec:
              failureThreshold: 30
              periodSeconds: 5
      sockpuppetbrowser:
        image:
          repository: dgtlmoon/sockpuppetbrowser
          tag: latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
        env:
          SCREEN_WIDTH: "1920"
          SCREEN_HEIGHT: "1024"
          SCREEN_DEPTH: "16"
          MAX_CONCURRENT_CHROME_PROCESSES: "5"
        securityContext:
          capabilities:
            add:
              - SYS_ADMIN
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

service:
  main:
    controller: main
    ports:
      http:
        port: 5000

persistence:
  config:
    enabled: false
  data:
    existingClaim: changedetection-data
    advancedMounts:
      main:
        main:
          - path: /datastore
