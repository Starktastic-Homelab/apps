apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec-alerts
  namespace: crowdsec
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: crowdsec
      rules:
        # ── LAPI health ─────────────────────────────────────────────
        - alert: CrowdSecLAPIDown
          # job is the Service name (the chart's ServiceMonitor sets no jobLabel); absent() catches a vanished target.
          expr: |
            up{job="crowdsec-service", namespace="crowdsec"} == 0
            or absent(up{job="crowdsec-service", namespace="crowdsec"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec LAPI is down"
            description: "The CrowdSec Local API has been unreachable for 5 minutes."

        # ── No active decisions (the bouncer blocks nothing) ────────
        - alert: CrowdSecNoActiveDecisions
          # LAPI drops the gauge instead of exporting 0. It counts CAPI decisions, so empty means no blocklist.
          expr: |
            (up{job="crowdsec-service", namespace="crowdsec"} == 1)
            unless on (job, instance) cs_active_decisions
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec has no active decisions"
            description:
              "The LAPI has been up for 30 minutes with no active decisions, not even the CAPI community blocklist, so
              the Traefik bouncer blocks nothing. Check the LAPI log for CAPI pull errors."

        # ── Alert spike ─────────────────────────────────────────────
        - alert: CrowdSecHighAlertRate
          expr: rate(cs_alerts_total[5m]) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec alert rate is high"
            description: "More than 1 alert/s sustained over 10 minutes - possible attack."

        # ── Agent not shipping logs ─────────────────────────────────
        - alert: CrowdSecAgentNoLogs
          expr: rate(cs_parsed_total[15m]) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec agent is not parsing logs"
            description: "The CrowdSec agent has parsed zero log lines for 15 minutes."
