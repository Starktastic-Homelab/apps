controllers:
  main:
    containers:
      main:
        image:
          repository: sdblepas/cineplete
          tag: v4.7.18@sha256:4cc40b02285eb0e5bfd6ad51d3de2b6a0f06a509f3bc644d18324dfe8fe3fe0f
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8787
          readiness:
            enabled: true
            type: TCP
            port: 8787
          startup:
            enabled: true
            type: TCP
            port: 8787
            spec:
              failureThreshold: 30
              periodSeconds: 5

service:
  main:
    controller: main
    ports:
      http:
        port: 8787

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: nfs-pv
    size: 1Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /data
