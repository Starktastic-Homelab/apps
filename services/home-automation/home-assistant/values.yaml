controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: 2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
        resources:
          requests:
            memory: 512Mi
        env:
          PUID:
          PGID:
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8123
          readiness:
            enabled: true
            type: TCP
            port: 8123
          startup:
            enabled: true
            type: TCP
            port: 8123
            spec:
              initialDelaySeconds: 10
              failureThreshold: 60
              periodSeconds: 10
      matter-server:
        image:
          repository: ghcr.io/matter-js/matterjs-server
          tag: 1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
        env:
          PRIMARY_INTERFACE: eth1
          LISTEN_ADDRESS: "127.0.0.1"
          STORAGE_PATH: /data
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                host: 127.0.0.1
                port: 5580
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 2
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                host: 127.0.0.1
                port: 5580
              failureThreshold: 180
              periodSeconds: 5
              timeoutSeconds: 2

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      securityContext:
        supplementalGroups:
          - 0
    initContainers:
      retained-home-assistant-config:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - home-assistant
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      retained-matter-server-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - home-assistant-matter
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
defaultPodOptions:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    fsGroup: 0

service:
  main:
    controller: main
    ports:
      http:
        port: 8123
  lan:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: "{{ .Values.global.network.loadBalancers.homeAssistant }}"
    ports:
      http:
        port: 8123
      mdns:
        port: 5353
        protocol: UDP

persistence:
  config:
    enabled: false
  home-assistant-config:
    existingClaim: home-assistant-config-block
    advancedMounts:
      main:
        main:
          - path: /config
        retained-home-assistant-config:
          - path: /retained
            readOnly: true
    globalMounts: []
  matter-server-data:
    existingClaim: home-assistant-matter-block
    advancedMounts:
      main:
        matter-server:
          - path: /data
        retained-matter-server-data:
          - path: /retained
            readOnly: true
    globalMounts: []
  media:
    enabled: false
  retained-startup:
    type: configMap
    name: operations-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-home-assistant-config:
          - path: /retained-startup
            readOnly: true
        retained-matter-server-data:
          - path: /retained-startup
            readOnly: true
