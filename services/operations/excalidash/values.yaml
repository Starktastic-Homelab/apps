controllers:
  main:
    containers:
      main:
        image:
          repository: zimengxiong/excalidash-frontend
          tag: 0.6.3@sha256:d39c62bb98a1da9e3261667bfbc1792de907323502b2107ec7d6e9b6d1837b02
        env:
          BACKEND_URL: "localhost:8000"
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 80
            path: /
          readiness:
            enabled: true
            type: HTTP
            port: 80
            path: /
          startup:
            enabled: true
            type: TCP
            port: 80
            spec:
              failureThreshold: 30
              periodSeconds: 5
      backend:
        image:
          repository: zimengxiong/excalidash-backend
          tag: 0.6.5@sha256:29937c62fbed5f4d417398c21c7ab261965231427bd5ae3c64f8d365fe2c02a3
        env:
          DATABASE_URL: "file:/app/prisma/dev.db"
          PORT: "8000"
          NODE_ENV: "production"
          AUTH_MODE: "oidc_enforced"
          TRUST_PROXY: "1"
          FRONTEND_URL: "https://excalidash.starktastic.net"
          UPDATE_CHECK_OUTBOUND: "false"
          # Authentik OIDC
          OIDC_PROVIDER_NAME: "authentik"
          OIDC_ISSUER_URL: "https://auth.starktastic.net/application/o/excalidash/"
          OIDC_REDIRECT_URI: "https://excalidash.starktastic.net/api/auth/oidc/callback"
          OIDC_SCOPES: "openid profile email"
          OIDC_REQUIRE_EMAIL_VERIFIED: "false"
        envFrom:
          - secretRef:
              name: excalidash-secret
        probes:
          # Match the HTTPS context normally supplied by the trusted ingress.
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8000
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8000
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
          startup:
            enabled: true
            type: TCP
            port: 8000
            spec:
              failureThreshold: 30
              periodSeconds: 5

service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  config:
    enabled: false
  data:
    existingClaim: excalidash-data
    advancedMounts:
      main:
        backend:
          - path: /app/prisma
