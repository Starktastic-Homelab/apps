    - Edge:
      - Traefik:
          id: traefik
          icon: traefik.png
          href: https://traefik.internal.starktastic.net
          description: Ingress & reverse proxy
          siteMonitor: http://traefik-api.traefik-system:8080/ping
          namespace: traefik-system
          app: traefik
          widgets:
          - type: traefik
            url: http://traefik-api.traefik-system:8080
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Cert Expiry
              query: min(certmanager_certificate_expiration_timestamp_seconds{issuer_name="letsencrypt-prod"} > 0) - time()
              format:
                type: number
                scale: 1/86400
                suffix: ' days'
                options:
                  maximumFractionDigits: 0
            - label: Requests
              query: sum(rate(traefik_entrypoint_requests_total[5m]))
              format:
                type: number
                suffix: ' req/s'
                options:
                  maximumFractionDigits: 1
            - label: p95 Latency
              query: histogram_quantile(0.95, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))
              format:
                type: number
                scale: 1000
                suffix: ' ms'
                options:
                  maximumFractionDigits: 0
            highlight:
              Cert Expiry:
                numeric:
                - level: danger
                  when: lt
                  value: 3
                - level: warn
                  when: lt
                  value: 10
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: 5xx Rate
              query: (sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) or vector(0)) and count(up{job="traefik-metrics"} == 1)
              format:
                type: number
                suffix: ' req/s'
                options:
                  maximumFractionDigits: 2
            - label: Open Conns
              query: sum(traefik_open_connections{entrypoint!="metrics"})
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Last Reload
              query: time() - max(traefik_config_last_reload_success)
              format:
                type: number
                scale: 1/60
                suffix: ' min'
                options:
                  maximumFractionDigits: 0
