apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - autobrr-postgres-secret.yaml
  - autobrr-secret.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: autobrr-retained-startup-guard
    namespace: media
    files:
      - guard.py=retained-startup/guard.py
