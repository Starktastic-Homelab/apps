apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-enrollment-config
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.json: "{\n  \"version\": 1,\n  \"expectedSystemIdentifier\": \"7584099661242523698\"\
    ,\n  \"entries\": [\n    {\n      \"id\": \"pg-enrollment-pilot\",\n      \"database\"\
    : \"homelab_enrollment_pilot\",\n      \"role\": \"homelab_enrollment_pilot\"\
    ,\n      \"mode\": \"new\",\n      \"passwordKey\": \"pilot-password\"\n    },\n\
    \    {\n      \"id\": \"autobrr\",\n      \"database\": \"autobrr\",\n      \"\
    role\": \"autobrr\",\n      \"mode\": \"new\",\n      \"passwordKey\": \"autobrr-password\"\
    \n    },\n    {\n      \"id\": \"prowlarr-main\",\n      \"database\": \"prowlarr_main\"\
    ,\n      \"role\": \"prowlarr_main\",\n      \"mode\": \"new\",\n      \"passwordKey\"\
    : \"prowlarr-main-password\"\n    },\n    {\n      \"id\": \"prowlarr-log\",\n\
    \      \"database\": \"prowlarr_log\",\n      \"role\": \"prowlarr_log\",\n  \
    \    \"mode\": \"new\",\n      \"passwordKey\": \"prowlarr-log-password\"\n  \
    \  },\n    {\n      \"id\": \"seerr\",\n      \"database\": \"seerr\",\n     \
    \ \"role\": \"seerr\",\n      \"mode\": \"new\",\n      \"passwordKey\": \"seerr-password\"\
    \n    },\n    {\n      \"id\": \"seerr-ru\",\n      \"database\": \"seerr_ru\"\
    ,\n      \"role\": \"seerr_ru\",\n      \"mode\": \"new\",\n      \"passwordKey\"\
    : \"seerr-ru-password\"\n    },\n    {\n      \"id\": \"bazarr\",\n      \"database\"\
    : \"bazarr\",\n      \"role\": \"bazarr\",\n      \"mode\": \"new\",\n      \"\
    passwordKey\": \"bazarr-password\"\n    },\n    {\n      \"id\": \"ntfy\",\n \
    \     \"database\": \"ntfy\",\n      \"role\": \"ntfy\",\n      \"mode\": \"new\"\
    ,\n      \"passwordKey\": \"ntfy-password\"\n    },\n    {\n      \"id\": \"grafana\"\
    ,\n      \"database\": \"grafana\",\n      \"role\": \"grafana\",\n      \"mode\"\
    : \"new\",\n      \"passwordKey\": \"grafana-password\"\n    },\n    {\n     \
    \ \"id\": \"pgadmin\",\n      \"database\": \"pgadmin\",\n      \"role\": \"pgadmin\"\
    ,\n      \"mode\": \"new\",\n      \"passwordKey\": \"pgadmin-password\"\n   \
    \ },\n    {\n      \"id\": \"cleanuparr\",\n      \"database\": \"cleanuparr\"\
    ,\n      \"role\": \"cleanuparr\",\n      \"mode\": \"new\",\n      \"passwordKey\"\
    : \"cleanuparr-password\"\n    }\n  ]\n}\n"
  enroll.sh: "#!/bin/sh\n# Secret values never enter arguments, tracing or diagnostic\
    \ output.\nset +x\nset -eu\numask 077\nexport PGCONNECT_TIMEOUT=5\nexport PGOPTIONS='-c\
    \ statement_timeout=60000'\nfail() {\n  echo 'PostgreSQL enrollment failed; inspect\
    \ declared identity, registry and credentials.' >&2\n  exit 1\n}\npassword_file()\
    \ {\n  [ -f \"$1\" ] && [ -s \"$1\" ] && [ \"$(wc -c <\"$1\")\" -le 4096 ] ||\
    \ fail\n  if ! od -An -tu1 \"$1\" | awk '{for(i=1;i<=NF;i++) if($i==0 || $i==10\
    \ || $i==13) exit 1}'; then\n    echo 'Password contains unsupported NUL/CR/LF\
    \ bytes.' >&2\n    exit 1\n  fi\n}\nadmin() {\n  password_file /credentials/admin/postgres-password\n\
    \  PGPASSWORD=$(cat /credentials/admin/postgres-password)\n  export PGPASSWORD\n\
    }\ncase \"${1:-}\" in\n  run)\n    [ \"${PGDATABASE:-}\" = postgres ] && [ \"\
    ${PGUSER:-}\" = postgres ] || fail\n    admin\n    scratch=$(mktemp -d)\n    trap\
    \ 'rm -rf \"$scratch\"' EXIT HUP INT TERM\n    tab=$(printf '\\t')\n    psql -XqAt\
    \ -F \"$tab\" -v ON_ERROR_STOP=1 -v preflight=true -v rows=\"$scratch/entries\"\
    \ -f /scripts/enroll.sql >/dev/null 2>&1 || fail\n    # Validate ALL credential\
    \ projections before creating anything.\n    while IFS=\"$tab\" read -r id db\
    \ role _mode key verify; do\n      password_file \"/credentials/apps/$key\"\n\
    \    done <\"$scratch/entries\"\n    # Existing credentials are acceptance checks,\
    \ never password reset permission.\n    while IFS=\"$tab\" read -r id db role\
    \ _mode key verify; do\n      if [ \"$verify\" = t ]; then\n        ENROLL_DATABASE=$db\
    \ ENROLL_ROLE=$role ENROLL_KEY=$key /bin/sh /scripts/enroll.sh verify-login ||\
    \ fail\n      fi\n    done <\"$scratch/entries\"\n    while IFS=\"$tab\" read\
    \ -r id db role _mode key verify; do\n      password=$(cat \"/credentials/apps/$key\"\
    )\n      if ! printf '%s\\n%s\\n' \"$password\" \"$password\" |\n        psql\
    \ -XqAt -v ON_ERROR_STOP=1 -v preflight=false -v entry=\"$id\" -f /scripts/enroll.sql\
    \ >/dev/null 2>&1; then\n        echo \"Enrollment $id failed.\" >&2\n       \
    \ fail\n      fi\n      echo \"Enrollment $id verified.\"\n    done <\"$scratch/entries\"\
    \n    ;;\n  schema)\n    admin\n    PGDATABASE=$ENROLL_DATABASE\n    export PGDATABASE\n\
    \    psql -Xq -v ON_ERROR_STOP=1 -v role=\"$ENROLL_ROLE\" -f /scripts/schema.sql\
    \ >/dev/null 2>&1 || fail\n    ;;\n  verify-login)\n    password_file \"/credentials/apps/$ENROLL_KEY\"\
    \n    PGPASSWORD=$(cat \"/credentials/apps/$ENROLL_KEY\")\n    PGUSER=$ENROLL_ROLE\n\
    \    PGDATABASE=$ENROLL_DATABASE\n    export PGPASSWORD PGUSER PGDATABASE\n  \
    \  psql -XqAt -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1 || fail\n    ;;\n\
    \  *) fail ;;\nesac\n"
  enroll.sql: "\\set ON_ERROR_STOP on\nSET statement_timeout = '60s';\n\\set config\
    \ `cat /config/config.json`\nCREATE TEMP TABLE config AS SELECT :'config'::jsonb\
    \ AS value;\nDO $$\nDECLARE c jsonb := (SELECT value FROM config);\n        deadline\
    \ timestamptz := clock_timestamp() + interval '30 seconds';\nBEGIN\n  IF current_database()\
    \ <> 'postgres' OR current_user <> 'postgres'\n     OR c->>'expectedSystemIdentifier'\
    \ IS NULL\n     OR c->>'expectedSystemIdentifier' !~ '^[0-9]+$'\n     OR c->>'expectedSystemIdentifier'\
    \ <> (SELECT system_identifier::text FROM pg_control_system())\n     OR pg_is_in_recovery()\
    \ THEN RAISE EXCEPTION 'Server identity rejected'; END IF;\n  WHILE NOT pg_try_advisory_lock(1346848082,\
    \ 1) LOOP\n    IF clock_timestamp() >= deadline THEN RAISE EXCEPTION 'Enrollment\
    \ lock timeout'; END IF;\n    PERFORM pg_sleep(0.1);\n  END LOOP;\n  IF (SELECT\
    \ array_agg(k ORDER BY k) FROM jsonb_object_keys(c) k)\n       <>
    ARRAY['entries','expectedSystemIdentifier','version']\n\
    \     OR c->'version' <> '1'::jsonb OR jsonb_typeof(c->'entries') <> 'array'\n\
    \     OR jsonb_typeof(c->'expectedSystemIdentifier') <> 'string' THEN\n    RAISE\
    \ EXCEPTION 'Invalid enrollment config';\n  END IF;\n  IF NOT EXISTS (SELECT FROM\
    \ pg_namespace WHERE nspname='homelab_enrollment'\n      AND nspowner='postgres'::regrole\
    \ AND NOT EXISTS\n        (SELECT FROM aclexplode(nspacl) a WHERE a.grantee <>\
    \ 'postgres'::regrole))\n     OR NOT EXISTS (SELECT FROM pg_class WHERE
    oid=to_regclass('homelab_enrollment.enrollments')\n\
    \        AND relkind='r' AND relowner='postgres'::regrole AND NOT relrowsecurity\
    \ AND NOT relforcerowsecurity\n        AND NOT EXISTS (SELECT FROM aclexplode(relacl)\
    \ a WHERE a.grantee <> 'postgres'::regrole)) THEN\n    RAISE EXCEPTION 'Registry\
    \ missing or unsafe';\n  END IF;\n  IF (SELECT array_agg(attname::text ORDER BY\
    \ attnum) FROM pg_attribute\n       WHERE attrelid='homelab_enrollment.enrollments'::regclass\
    \ AND attnum>0 AND NOT attisdropped)\n       <> ARRAY['id','database_name','role_name','mode','phase']\n\
    \     OR EXISTS (SELECT FROM pg_attribute WHERE attrelid='homelab_enrollment.enrollments'::regclass\n\
    \       AND attnum>0 AND (attisdropped OR atttypid<>'text'::regtype OR NOT attnotnull\
    \ OR atthasdef OR attgenerated<>'' OR attidentity<>''))\n     OR (SELECT count(*)\
    \ FROM pg_constraint WHERE conrelid='homelab_enrollment.enrollments'::regclass\
    \ AND contype<>'n') <> 5\n     OR (SELECT array_agg(pg_get_constraintdef(oid)\
    \ ORDER BY pg_get_constraintdef(oid)) FROM pg_constraint\n         WHERE
    conrelid='homelab_enrollment.enrollments'::regclass\
    \ AND convalidated AND contype<>'n')\n       <> ARRAY['CHECK ((mode = ANY (ARRAY[''new''::text,\
    \ ''adopt''::text])))',\n                'CHECK ((phase = ANY (ARRAY[''provisioning''::text,\
    \ ''ready''::text])))',\n                'PRIMARY KEY (id)', 'UNIQUE (database_name)',\
    \ 'UNIQUE (role_name)']\n     OR EXISTS (SELECT FROM pg_trigger WHERE
    tgrelid='homelab_enrollment.enrollments'::regclass\
    \ AND NOT tgisinternal)\n     OR EXISTS (SELECT FROM pg_rewrite WHERE
    ev_class='homelab_enrollment.enrollments'::regclass)\n\
    \     OR EXISTS (SELECT FROM pg_index WHERE indrelid='homelab_enrollment.enrollments'::regclass\
    \ AND NOT indisvalid) THEN\n    RAISE EXCEPTION 'Registry structure changed';\n\
    \  END IF;\nEND $$;\nCREATE TEMP TABLE entries AS\nSELECT e->>'id' AS id,e->>'database'\
    \ AS database_name,e->>'role' AS role_name,\n       e->>'mode' AS mode,e->>'passwordKey'\
    \ AS password_key,e AS raw\nFROM config, jsonb_array_elements(value->'entries')\
    \ e;\nDO $$\nDECLARE e record; r record; d record; l record;\nBEGIN\n  IF EXISTS\
    \ (SELECT FROM entries WHERE\n      (SELECT array_agg(k ORDER BY k) FROM jsonb_object_keys(raw)\
    \ k)\n        <> ARRAY['database','id','mode','passwordKey','role']\n      OR\
    \ EXISTS (SELECT FROM jsonb_each(raw) WHERE jsonb_typeof(value)<>'string')\n \
    \     OR id IS NULL OR database_name IS NULL OR role_name IS NULL OR mode IS NULL\
    \ OR password_key IS NULL\n      OR id !~ '^[a-z][a-z0-9_-]{0,62}$' OR database_name\
    \ !~ '^[a-z][a-z0-9_]{0,62}$'\n      OR role_name !~ '^[a-z][a-z0-9_]{0,62}$'\
    \ OR password_key !~ '^[a-z][a-z0-9_-]{0,62}$'\n      OR mode NOT IN ('new','adopt')\
    \ OR role_name='postgres' OR role_name LIKE 'pg\\_%'\n      OR database_name IN\
    \ ('postgres','template0','template1'))\n    OR EXISTS (SELECT FROM entries GROUP\
    \ BY id HAVING count(*)>1)\n    OR EXISTS (SELECT FROM entries GROUP BY database_name\
    \ HAVING count(*)>1)\n    OR EXISTS (SELECT FROM entries GROUP BY role_name HAVING\
    \ count(*)>1)\n    OR EXISTS (SELECT FROM entries GROUP BY password_key HAVING\
    \ count(*)>1) THEN\n    RAISE EXCEPTION 'Invalid enrollment entries';\n  END IF;\n\
    \  FOR e IN SELECT * FROM entries LOOP\n    SELECT * INTO l FROM homelab_enrollment.enrollments\
    \ WHERE id=e.id;\n    IF l.id IS NOT NULL AND (l.database_name<>e.database_name\
    \ OR l.role_name<>e.role_name OR l.mode<>e.mode) THEN\n      RAISE EXCEPTION 'Recorded\
    \ binding changed';\n    END IF;\n    IF EXISTS (SELECT FROM homelab_enrollment.enrollments\
    \ WHERE id<>e.id\n        AND (database_name=e.database_name OR role_name=e.role_name))\
    \ THEN\n      RAISE EXCEPTION 'Identity already recorded';\n    END IF;\n    SELECT\
    \ * INTO r FROM pg_roles WHERE rolname=e.role_name;\n    SELECT * INTO d FROM\
    \ pg_database WHERE datname=e.database_name;\n    IF l.id IS NULL AND e.mode='new'\
    \ THEN\n      IF r.oid IS NOT NULL OR d.oid IS NOT NULL THEN RAISE EXCEPTION 'New\
    \ identity already exists'; END IF;\n    ELSE\n      IF r.oid IS NULL OR r.rolsuper\
    \ OR r.rolcreatedb OR r.rolcreaterole OR r.rolreplication\n        OR r.rolbypassrls\
    \ OR NOT r.rolinherit OR r.rolvaliduntil IS NOT NULL\n        OR (e.mode='new'\
    \ AND EXISTS (SELECT FROM pg_auth_members WHERE member=r.oid)) THEN\n        RAISE\
    \ EXCEPTION 'Role missing or incompatible';\n      END IF;\n      IF e.mode='adopt'\
    \ AND EXISTS (\n        WITH RECURSIVE parents(oid) AS (\n          SELECT roleid\
    \ FROM pg_auth_members WHERE member=r.oid\n          UNION SELECT m.roleid FROM\
    \ pg_auth_members m JOIN parents p ON m.member=p.oid)\n        SELECT FROM parents\
    \ JOIN pg_roles p USING(oid)\n        WHERE p.rolsuper OR p.rolcreatedb OR p.rolcreaterole\
    \ OR p.rolreplication OR p.rolbypassrls OR p.rolname LIKE 'pg\\_%') THEN\n   \
    \     RAISE EXCEPTION 'Elevated membership';\n      END IF;\n      IF l.phase='provisioning'\
    \ THEN\n        IF e.mode<>'new' OR r.rolcanlogin THEN RAISE EXCEPTION 'Invalid\
    \ pending role'; END IF;\n      ELSIF NOT r.rolcanlogin OR d.oid IS NULL THEN\
    \ RAISE EXCEPTION 'Established identity missing'; END IF;\n      IF d.oid IS NOT\
    \ NULL AND (d.datdba<>r.oid OR NOT d.datallowconn OR d.datistemplate) THEN\n \
    \       RAISE EXCEPTION 'Database incompatible';\n      END IF;\n    END IF;\n\
    \  END LOOP;\nEND $$;\n\\if :preflight\n\\o :rows\nSELECT e.id,e.database_name,e.role_name,e.mode,e.password_key,\n\
    \       (e.mode='adopt' OR l.phase='ready') IS TRUE AS verify\nFROM entries e\
    \ LEFT JOIN homelab_enrollment.enrollments l USING(id) ORDER BY e.id;\n\\o\n\\\
    else\nSELECT id,database_name AS database,role_name AS role,mode,password_key\
    \ AS key FROM entries WHERE id=:'entry' \\gset\nSELECT NOT EXISTS (SELECT FROM\
    \ homelab_enrollment.enrollments WHERE id=:'id') AS unknown \\gset\n-- boundary:\
    \ before-role\n\\if :unknown\nSELECT :'mode'='new' AS create_new \\gset\n\\if\
    \ :create_new\nBEGIN;\nSELECT format('CREATE ROLE %I NOLOGIN NOSUPERUSER NOCREATEDB\
    \ NOCREATEROLE NOREPLICATION NOBYPASSRLS INHERIT', :'role') \\gexec\nINSERT INTO\
    \ homelab_enrollment.enrollments VALUES (:'id',:'database',:'role','new','provisioning');\n\
    COMMIT;\n\\endif\n\\endif\n-- boundary: after-role\nSELECT EXISTS (SELECT FROM\
    \ homelab_enrollment.enrollments WHERE id=:'id' AND phase='provisioning') AS provisioning\
    \ \\gset\n\\setenv ENROLL_DATABASE :database\n\\setenv ENROLL_ROLE :role\n\\setenv\
    \ ENROLL_KEY :key\n\\if :provisioning\nSET password_encryption='scram-sha-256';\n\
    \\password :\"role\"\n-- boundary: after-password\nSELECT format('CREATE DATABASE\
    \ %I OWNER %I', :'database', :'role') WHERE NOT EXISTS (SELECT FROM pg_database\
    \ WHERE datname=:'database') \\gexec\n-- boundary: after-database\nSELECT format('REVOKE\
    \ ALL ON DATABASE %I FROM PUBLIC', :'database') \\gexec\n\\! /bin/sh /scripts/enroll.sh\
    \ schema\n\\if :SHELL_ERROR\nDO $$ BEGIN RAISE EXCEPTION 'Enrollment child failed';\
    \ END $$;\n\\endif\n-- boundary: after-schema\nBEGIN;\nUPDATE homelab_enrollment.enrollments\
    \ SET phase='ready' WHERE id=:'id';\nSELECT format('ALTER ROLE %I LOGIN', :'role')\
    \ \\gexec\nCOMMIT;\n\\endif\n-- boundary: after-ready\n\\! /bin/sh /scripts/enroll.sh\
    \ verify-login\n\\if :SHELL_ERROR\nDO $$ BEGIN RAISE EXCEPTION 'Enrollment child\
    \ failed'; END $$;\n\\endif\n\\if :unknown\n\\if :create_new\n\\else\nINSERT INTO\
    \ homelab_enrollment.enrollments VALUES (:'id',:'database',:'role','adopt','ready');\n\
    \\endif\n\\endif\n\\endif\n"
  schema.sql: '\set ON_ERROR_STOP on

    BEGIN;

    REVOKE ALL ON SCHEMA public FROM PUBLIC;

    GRANT ALL ON SCHEMA public TO :"role";

    COMMIT;

    '
  completion-protocol-version: "1"
  completion_gate.py: "#!/usr/bin/env python3\n\"\"\"Read-only, fail-closed native\
    \ Argo enrollment acceptance for consumer init.\"\"\"\nimport argparse\nimport\
    \ hashlib\nfrom http.client import HTTPException\nimport json\nfrom pathlib import\
    \ Path\nimport ssl\nimport time\nfrom urllib.request import HTTPSHandler, HTTPRedirectHandler,\
    \ ProxyHandler, Request, build_opener\n\nCONFIG_PATH =
    '/api/v1/namespaces/databases/configmaps/postgres-enrollment-config'\n\
    APPLICATION_PATH = '/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/postgres'\n\
    MAX_RESPONSE = 1024 * 1024\nREQUIRED_DATA = {'config.json', 'enroll.sh', 'enroll.sql',\
    \ 'schema.sql', 'completion_gate.py',\n                 'completion-protocol-version',\
    \ 'encrypted-inputs-sha256', 'job-template.json'}\n\n\ndef generation(data: dict)\
    \ -> str:\n    inputs = {key: value for key, value in data.items() if key != 'acceptance-generation'}\n\
    \    return hashlib.sha256(json.dumps(inputs, sort_keys=True, separators=(',',\
    \ ':')).encode()).hexdigest()\n\n\ndef hook_name(value: str) -> str:\n    return\
    \ 'postgres-enrollment-' + value[:32]\n\n\ndef accepted(configmap: dict, application:\
    \ dict, identity: dict) -> bool:\n    try:\n        if (configmap['metadata']['name']\
    \ != 'postgres-enrollment-config'\n                or configmap['metadata']['namespace']\
    \ != 'databases'\n                or application['metadata']['name'] != 'postgres'\n\
    \                or application['metadata']['namespace'] != 'argocd'\n       \
    \         or application.get('operation') is not None):\n            return False\n\
    \        data = configmap['data']\n        if (not REQUIRED_DATA <= set(data)\
    \ or not all(isinstance(v, str) for v in data.values())\n                or data['completion-protocol-version']\
    \ != '1'\n                or data['acceptance-generation'] != generation(data)):\n\
    \            return False\n        config = json.loads(data['config.json'])\n\
    \        if type(config['version']) is not int or config['version'] != 1:\n  \
    \          return False\n        entries = [entry for entry in config['entries']\
    \ if entry['id'] == identity['id']]\n        if len(entries) != 1 or any(entries[0][key]\
    \ != identity[key] for key in ('database', 'role')):\n            return False\n\
    \        status = application['status']\n        state = status['operationState']\n\
    \        sync = state['operation']['sync']\n        revisions = (status['sync']['revisions'],\
    \ state['syncResult']['revisions'])\n        if (state['phase'] != 'Succeeded'\
    \ or status['sync']['status'] != 'Synced'\n                or status['health']['status']\
    \ != 'Healthy'\n                or sync.get('resources') is not None or sync.get('dryRun')\
    \ is True\n                or 'apply' in sync.get('syncStrategy', {})\n      \
    \          or any(not isinstance(values, list) or not values\n               \
    \        or not all(isinstance(v, str) and v for v in values) for values in revisions)):\n\
    \            return False\n        # A newer unrelated Git commit can be Synced\
    \ without a new operation.\n        # The current input fingerprint, rather than\
    \ repository SHA, binds acceptance.\n        hooks = [resource for resource in\
    \ state['syncResult']['resources']\n                 if resource.get('group')\
    \ == 'batch' and resource.get('kind') == 'Job'\n                 and resource.get('namespace')\
    \ == 'databases'\n                 and resource.get('name') == hook_name(data['acceptance-generation'])]\n\
    \        return (len(hooks) == 1 and hooks[0].get('hookType') == 'Sync'\n    \
    \            and hooks[0].get('hookPhase') == 'Succeeded')\n    except (KeyError,\
    \ TypeError, ValueError, AttributeError):\n        return False\n\n\ndef check_once(get,\
    \ identity: dict) -> bool:\n    try:\n        before = get(CONFIG_PATH)\n    \
    \    application = get(APPLICATION_PATH)\n        after = get(CONFIG_PATH)\n \
    \       # ResourceVersion catches updates even if the configuration changes back.\n\
    \        for key in ('uid', 'resourceVersion'):\n            if not before['metadata'][key]\
    \ or before['metadata'][key] != after['metadata'][key]:\n                return\
    \ False\n        return before['data'] == after['data'] and accepted(after, application,\
    \ identity)\n    except (OSError, HTTPException, KeyError, TypeError, ValueError,\
    \ AttributeError):\n        return False\n\n\nclass NoRedirect(HTTPRedirectHandler):\n\
    \    def redirect_request(self, req, fp, code, msg, headers, newurl):\n      \
    \  raise OSError('Kubernetes API redirect refused')\n\n\nclass APIReader:\n  \
    \  def __init__(self):\n        directory = Path('/gate-api')\n        self.token\
    \ = lambda: (directory / 'token').read_text().strip()\n        self.opener = build_opener(ProxyHandler({}),\
    \
    NoRedirect(),\n                                   HTTPSHandler(context=ssl.create_default_context(cafile=str(directory\
    \ / 'ca.crt'))))\n\n    def get(self, path: str) -> dict:\n        if path not\
    \ in (CONFIG_PATH, APPLICATION_PATH):\n            raise ValueError('Unexpected\
    \ Kubernetes resource')\n        request = Request('https://kubernetes.default.svc'\
    \ + path,\n                          headers={'Authorization': 'Bearer ' + self.token(),\
    \ 'Accept': 'application/json'})\n        with self.opener.open(request, timeout=10)\
    \ as response:\n            payload = response.read(MAX_RESPONSE + 1)\n      \
    \  if len(payload) > MAX_RESPONSE:\n            raise ValueError('Kubernetes response\
    \ exceeds limit')\n        result = json.loads(payload)\n        if not isinstance(result,\
    \ dict):\n            raise ValueError('Expected Kubernetes object')\n       \
    \ return result\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    for key in ('id', 'database', 'role'):\n        parser.add_argument('--'\
    \ + key, required=True)\n    args = parser.parse_args()\n    deadline = time.monotonic()\
    \ + 600\n    print('Waiting for current PostgreSQL enrollment acceptance', flush=True)\n\
    \    while time.monotonic() < deadline:\n        try:\n            if check_once(APIReader().get,\
    \ vars(args)):\n                print('Current PostgreSQL enrollment accepted',\
    \ flush=True)\n                return 0\n        except (OSError, HTTPException,\
    \ ValueError):\n            pass\n        time.sleep(5)\n    print('PostgreSQL\
    \ enrollment acceptance unavailable; startup remains blocked', flush=True)\n \
