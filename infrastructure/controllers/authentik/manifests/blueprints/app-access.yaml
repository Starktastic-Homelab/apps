version: 1
metadata:
  labels:
    blueprints.goauthentik.io/instantiate: "true"
  name: Application Access

# Who may sign in to each application. Every application needs at least one binding: the tenant flag
# "core_default_app_access" is switched off once these apply, so an unbound application denies everyone
# (ADR 0016).
# Open on purpose, bound to the "Any account" policy: jellyfin (LDAP, so ldapservice's lookups too),
# navidrome, calibre-web-automated, shelfmark, karakeep, excalidash, metube. Apps bound in the UI
# (argo-cd, audiobookshelf, immich, mealie) are not managed here.
# home-assistant admits authentik Admins and home-assistant-users. The blueprint only creates that group;
# membership is managed in the UI. Household members who use Home Assistant's own login are unaffected.
# internal-gate (the *.internal admin gate, ADR 0014) has exactly one binding, the entry below; never add another.
#
# The import is atomic: one unknown slug fails the whole blueprint and changes nothing.
# Deleting an entry leaves its binding in place; set `state: absent` and let it apply first.

entries:
  - model: authentik_policies_expression.expressionpolicy
    id: any-account
    identifiers:
      name: Any account
    state: present
    attrs:
      expression: return True
      execution_logging: false

  - model: authentik_core.group
    identifiers:
      name: home-assistant-users
    state: created

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, autobrr]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, bytestash]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, cleanuparr]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, filebrowser]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, grafana]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, internal-gate]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, listmonk]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, paperless-ngx]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, vaultwarden]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, home-assistant]]
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, home-assistant]]
      group: !Find [authentik_core.group, [name, home-assistant-users]]
      order: 1
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, calibre-web-automated]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, excalidash]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, jellyfin]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, karakeep]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, metube]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, navidrome]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, shelfmark]]
      policy: !KeyOf any-account
      order: 0
    state: present
    attrs:
      enabled: true
      negate: false
