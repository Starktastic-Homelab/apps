apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - aof-rules.yaml
  - redis-secret.yaml
  - server-acl.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: redis-retained-startup
    namespace: databases
    files:
      - guard.sh=retained-startup/guard.sh
