                  maximumFractionDigits: 0
      - Telemetry:
          id: telemetry
          icon: mdi-chart-timeline-variant
          href: https://grafana.internal.starktastic.net/explore
          description: Loki, Alloy and Tempo · losses over 24 h
          widgets:
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: Log Lines/s
              query: sum(rate(loki_distributor_lines_received_total[5m]))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Logs Discarded
              query: floor(sum(increase((sum by (pod) (loki_discarded_samples_total) or 0 * sum by (pod) (loki_build_info))[24h:5m]))) and count(loki_build_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Logs Dropped
              query: floor(sum(increase((sum by (pod) (loki_write_dropped_entries_total) or 0 * sum by (pod) (alloy_build_info))[24h:5m]))) and count(alloy_build_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Alloy Unhealthy
              query: (sum(alloy_component_controller_running_components{health_type=~"unhealthy|exited"}) or vector(0)) and count(alloy_build_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: Spans/s
              query: sum(rate(tempo_distributor_spans_received_total[5m]))
              format:
                type: number
                options:
                  maximumFractionDigits: 1
            - label: Spans Discarded
              query: floor(sum(increase((sum by (pod) (tempo_discarded_spans_total) or 0 * sum by (pod) (tempo_build_info))[24h:5m]))) and count(tempo_build_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
    - Core:
      - pgAdmin:
          id: pgadmin
          icon: pgadmin.png
          href: https://pgadmin.internal.starktastic.net
          description: Database administration
          siteMonitor: http://pgadmin-pgadmin4.databases:80
          namespace: databases
          app: pgadmin4
          widgets:
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Postgres
              query: min(pg_up)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Connections
              query: sum(pg_stat_database_numbackends) / sum(pg_settings_max_connections)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: DB Size
              query: sum(pg_database_size_bytes)
              format:
                type: bytes
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Redis
              query: min(redis_up)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Redis Memory
              query: sum(redis_memory_used_bytes)
              format:
                type: bytes
      - Cluster Services:
          id: cluster-services
          icon: mdi-cogs
          description: Reloader, MetalLB and Sealed Secrets
          widgets:
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: Failed Reloads 24h
              query: floor(sum(increase((sum by (pod) (reloader_reloads_failed_total) or 0 * sum by (pod) (reloader_info))[24h:5m]))) and count(reloader_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: LB In Use
              query: sum(max by (pool) (metallb_allocator_addresses_in_use_total))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: LB Pool
              query: sum(max by (pool) (metallb_allocator_addresses_total))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Unsynced Secrets
              query: (count(sealed_secrets_controller_condition_info{condition="Synced"} != 1) or vector(0)) and count(sealed_secrets_controller_build_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: GPU Nodes
              query: count(max by (node) (kube_node_status_allocatable{resource="gpu_intel_com_i915"}) > 0)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: GPU Slots
              query: sum(max by (node) (kube_node_status_allocatable{resource="gpu_intel_com_i915"}))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: GPU Requested
              query: sum(max by (namespace, pod, container) (kube_pod_container_resource_requests{resource="gpu_intel_com_i915"})) or vector(0)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
    - Compute:
      - Proxmox VE:
          id: proxmox-ve
          icon: proxmox.png
          href: https://10.9.9.20:8006
          description: Hypervisor and its storage
          widgets:
          - type: proxmox
            url: https://10.9.9.20:8006
            username: '{{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}'
            password: '{{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}'
            node: pve
            fields:
            - vms
            - resources.cpu
            - resources.mem
          - type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/storage?enabled=1
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 300000
            display: dynamic-list
            mappings:
              items: data
              name: storage
              label: used_fraction
              format: percent
              scale: 100
      - kube-master-01:
          id: kube-master-01
          icon: proxmox.png
          description: Control plane (4c / 16GB)
          proxmoxNode: pve
          proxmoxVMID: 200
          widget:
            type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/qemu/200/status/current
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 60000
            mappings:
            - field: data.cpu
              label: CPU
              scale: 100
              format: percent
            - field: data.mem
              label: Memory
              format: bytes
            - field: data.uptime
              label: Uptime
              format: duration
      - kube-worker-01:
          id: kube-worker-01
          icon: proxmox.png
          description: Worker (6c / 28GB / GPU)
          proxmoxNode: pve
          proxmoxVMID: 201
          widget:
            type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/qemu/201/status/current
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 60000
            mappings:
            - field: data.cpu
              label: CPU
              scale: 100
              format: percent
            - field: data.mem
              label: Memory
              format: bytes
            - field: data.uptime
              label: Uptime
              format: duration
      - kube-worker-02:
          id: kube-worker-02
          icon: proxmox.png
          description: Worker (6c / 28GB / GPU)
          proxmoxNode: pve
          proxmoxVMID: 202
          widget:
            type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/qemu/202/status/current
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 60000
            mappings:
            - field: data.cpu
              label: CPU
              scale: 100
              format: percent
            - field: data.mem
              label: Memory
              format: bytes
            - field: data.uptime
              label: Uptime
              format: duration
      - Runner:
          id: runner
          icon: mdi-github
          description: CI and live operations
          proxmoxNode: pve
          proxmoxVMID: 300
          widget:
            type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/qemu/300/status/current
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 60000
            mappings:
            - field: data.cpu
              label: CPU
              scale: 100
              format: percent
            - field: data.mem
              label: Memory
              format: bytes
            - field: data.uptime
              label: Uptime
              format: duration
    - Network:
      - OPNsense:
          id: opnsense
          icon: opnsense.png
          href: https://10.9.9.1
          description: Firewall & router
          siteMonitor: https://10.9.9.1/ui/
          widget:
            type: opnsense
            url: https://10.9.9.1
            username: '{{ "{{" }}HOMEPAGE_VAR_OPNSENSE_USER{{ "}}" }}'
            password: '{{ "{{" }}HOMEPAGE_VAR_OPNSENSE_PASS{{ "}}" }}'
      - AdGuard Home:
          id: adguard-home
          icon: adguard-home.png
          href: http://10.9.9.1:3000
          description: DNS filtering
          siteMonitor: http://10.9.9.1:3000/
          widgets:
          - type: adguard
            url: http://10.9.9.1:3000
            username: '{{ "{{" }}HOMEPAGE_VAR_ADGUARD_USER{{ "}}" }}'
            password: '{{ "{{" }}HOMEPAGE_VAR_ADGUARD_PASS{{ "}}" }}'
          - type: customapi
            url: http://10.9.9.1:3000/control/status
            username: '{{ "{{" }}HOMEPAGE_VAR_ADGUARD_USER{{ "}}" }}'
            password: '{{ "{{" }}HOMEPAGE_VAR_ADGUARD_PASS{{ "}}" }}'
            refreshInterval: 60000
            mappings:
            - field: protection_enabled
              label: Protection
              remap:
              - value: true
                to: 'On'
              - value: false
                to: Paused
            - field: version
              label: Version
            highlight:
              Protection:
                string:
                - level: warn
                  when: equals
                  value: Paused
      - Internet:
          id: internet
          icon: mdi-web
          description: The outside world, seen from the cluster
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Ping
              query: max(probe_duration_seconds{probe_kind="icmp"}) * 1000
              format:
                type: number
                suffix: ' ms'
                options:
                  maximumFractionDigits: 0
            - label: DNS
              query: max(probe_duration_seconds{probe_kind="dns"}) * 1000
              format:
                type: number
                suffix: ' ms'
                options:
                  maximumFractionDigits: 0
            - label: Up 24h
              query: avg(avg_over_time(probe_success{tier="external"}[24h])) * 100
              format:
                type: percent
                options:
                  maximumFractionDigits: 2
    - Storage:
      - TrueNAS:
          id: truenas
          icon: truenas.png
          href: https://10.9.9.30
          description: NAS & shared storage
          siteMonitor: https://10.9.9.30/ui/
          widget:
            type: truenas
            url: https://10.9.9.30
            version: 2
            key: '{{ "{{" }}HOMEPAGE_VAR_TRUENAS_KEY{{ "}}" }}'
            enablePools: true
            highlight:
              alerts:
                numeric:
                - level: warn
                  when: gte
                  value: 1
      - VM Backups:
          id: vm-backups
          icon: mdi-backup-restore
          href: https://10.9.9.20:8006
          description: Proxmox backup runs, newest first
          widgets:
          - type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/tasks?typefilter=vzdump&limit=1
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 300000
            mappings:
            - field: data.0.starttime
              label: Last Run
              format: relativeDate
              scale: 1000
            - field: data.0.status
              label: Result
            highlight:
              Result:
                string:
                - level: warn
                  when: equals
                  value: OK
                  negate: true
          - type: customapi
            url: https://10.9.9.20:8006/api2/json/nodes/pve/tasks?typefilter=vzdump&limit=5
            headers:
              Authorization: PVEAPIToken={{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}={{ "{{" }}HOMEPAGE_VAR_PROXMOX_PASS{{ "}}" }}
            refreshInterval: 300000
            display: dynamic-list
            mappings:
              items: data
              name: status
              label: starttime
              format: relativeDate
              scale: 1000
