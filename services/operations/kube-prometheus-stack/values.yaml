# =============================================================================
# kube-prometheus-stack Helm values
# Deploys: Prometheus, Grafana, AlertManager, node-exporter, kube-state-metrics
# =============================================================================

# -----------------------------------------------------------------------------
# K3s compatibility - disable components that don't expose standard endpoints
# -----------------------------------------------------------------------------
# CRDs are installed separately via prometheus-operator-crds (crds deploy phase)
crds:
  enabled: false

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# -----------------------------------------------------------------------------
# Prometheus
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "8GB"
    # Scrape all ServiceMonitors/PodMonitors cluster-wide, not just those
    # matching the Helm release labels
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    replicas: 1
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    securityContext:
      fsGroup: null
      runAsUser: 1000
      runAsGroup: 2000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: retained-state
        image: python@sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - prometheus
          - /data
        securityContext:
          runAsUser: 1000
          runAsGroup: 2000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
          - name: prometheus-data-block
            mountPath: /data
            readOnly: true
          - name: retained-startup
            mountPath: /retained-startup
            readOnly: true
    volumes:
      - name: retained-startup
        configMap:
          name: monitoring-retained-startup-guard
          defaultMode: 292
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-data-block
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          storageClassName: proxmox-retained
          accessModes:
            - ReadWriteOncePod
          resources:
            requests:
              storage: 16Gi
          volumeName: prometheus-data-block
    image:
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.15.0-distroless

# -----------------------------------------------------------------------------
# AlertManager
# -----------------------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    securityContext:
      fsGroup: null
      runAsUser: 1000
      runAsGroup: 2000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: retained-state
        image: python@sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - alertmanager
          - /data
        securityContext:
          runAsUser: 1000
          runAsGroup: 2000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
          - name: alertmanager-data-block
            mountPath: /data
            readOnly: true
          - name: retained-startup
            mountPath: /retained-startup
            readOnly: true
    volumes:
      - name: retained-startup
        configMap:
          name: monitoring-retained-startup-guard
          defaultMode: 292
    storage:
      volumeClaimTemplate:
        metadata:
          name: alertmanager-data-block
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          storageClassName: proxmox-retained
          accessModes:
            - ReadWriteOncePod
          resources:
            requests:
              storage: 2Gi
          volumeName: alertmanager-data-block
    image:
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.34.1
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 15m
      repeat_interval: 24h
      receiver: "ntfy"
      routes:
        # Watchdog fires continuously as a dead-man's switch.
        # TODO: Route to Uptime Kuma push monitor once deployed:
        #   - receiver: "watchdog"
        #     matchers: [alertname = "Watchdog"]
        #     group_interval: 1m
        #     repeat_interval: 1m
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        # Silence noisy built-in alerts that fire during normal rollouts
        - receiver: "null"
          matchers:
            - alertname =~
              "KubePodNotReady|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeContainerWaiting|CPUThrottlingHigh|KubeHpaReplicasMismatch"
        - receiver: "ntfy"
          continue: true
    receivers:
      - name: "null"
      - name: "ntfy"
        webhook_configs:
          # Routes through alertmanager-ntfy adapter for formatted notifications
          # with proper titles, descriptions, priority, and tags
          - url: "http://alertmanager-ntfy.monitoring:8000/hook"
            send_resolved: true
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]

# -----------------------------------------------------------------------------
# Grafana
# -----------------------------------------------------------------------------
grafana:
  replicas: 1
  deploymentStrategy:
    type: Recreate
  image:
    sha: 202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
  securityContext:
    fsGroup: null
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  env:
    GF_DATABASE_TYPE: postgres
    GF_DATABASE_HOST: postgres-postgresql.databases:5432
    GF_DATABASE_NAME: grafana
    GF_DATABASE_USER: grafana
    GF_DATABASE_SSL_MODE: disable
    GF_DATABASE_MAX_OPEN_CONN: "5"
    GF_DATABASE_MAX_IDLE_CONN: "2"
  envValueFrom:
    GF_DATABASE_PASSWORD: &id001
      secretKeyRef:
        name: grafana-postgres-secret
        key: password
  extraInitContainers:
    - name: grafana-retained-state
      image: python@sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
      command:
        - python3
        - -I
        - -B
        - /retained-startup/guard.py
        - /var/lib/grafana
        - /credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: &id002
          drop:
            - ALL
        seccompProfile: &id003
          type: RuntimeDefault
      env:
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_HOST
          value: postgres-postgresql.databases:5432
        - name: GF_DATABASE_NAME
          value: grafana
        - name: GF_DATABASE_USER
          value: grafana
        - name: GF_DATABASE_SSL_MODE
          value: disable
        - name: GF_DATABASE_MAX_OPEN_CONN
          value: "5"
        - name: GF_DATABASE_MAX_IDLE_CONN
          value: "2"
        - name: GF_DATABASE_PASSWORD
          valueFrom: *id001
      volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
          readOnly: true
        - name: retained-startup
          mountPath: /retained-startup
          readOnly: true
        - name: pg-completion-password
          mountPath: /credentials
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    - name: postgres-enrollment-acceptance
      image: python@sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
      command:
        - python3
        - -B
        - /gate/completion_gate.py
      args:
        - --id
        - grafana
        - --database
        - grafana
        - --role
        - grafana
      securityContext: &id004
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: *id002
        seccompProfile: *id003
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: pg-completion-script
          mountPath: /gate
          readOnly: true
        - name: pg-completion-api
          mountPath: /gate-api
          readOnly: true
    - name: postgres-canonical-login
      image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      command:
        - /bin/sh
        - -ec
        - export PGPASSWORD="$(cat /credentials/password)"; exec psql -XqAt -v ON_ERROR_STOP=1 -f
          /retained-startup/main.sql >/dev/null 2>&1
      env:
        - name: PGHOST
          value: postgres-postgresql.databases
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: grafana
        - name: PGDATABASE
          value: grafana
        - name: PGCONNECT_TIMEOUT
          value: "10"
      securityContext: *id004
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
      volumeMounts:
        - name: pg-completion-password
          mountPath: /credentials
          readOnly: true
        - name: retained-startup
          mountPath: /retained-startup
          readOnly: true
  extraContainerVolumes:
    - name: pg-completion-script
      configMap:
        name: grafana-postgres-completion
        defaultMode: 292
    - name: pg-completion-api
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    - name: pg-completion-password
      secret:
        secretName: grafana-postgres-secret
        defaultMode: 292
        items:
          - key: password
            path: password
    - name: retained-startup
      configMap:
        name: grafana-retained-startup-guard
        defaultMode: 292
  sidecar:
    dashboards:
      initDashboards: true
      restartPolicy: Always
      startupProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 2
        failureThreshold: 60
    datasources:
      initDatasources: true
      restartPolicy: Always
      startupProbe:
        httpGet:
          path: /healthz
          port: 8081
        periodSeconds: 2
        failureThreshold: 60
  enabled: true
  resources:
    requests:
      memory: 640Mi
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: grafana-oidc-secret
  defaultDashboardsTimezone: Asia/Jerusalem
  initChownData:
    enabled: false
  podSecurityContext:
    fsGroup: 472
    runAsUser: 472
    runAsGroup: 472
  grafana.ini:
    server:
      root_url: https://grafana.internal.starktastic.net # source: globals.yaml → global.domains.internal
    auth.anonymous:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      auto_login: true
      scopes: openid profile email
      auth_url: https://auth.starktastic.net/application/o/authorize/ # source: globals.yaml → global.domains.public
      token_url: https://auth.starktastic.net/application/o/token/ # source: globals.yaml → global.domains.public
      api_url: https://auth.starktastic.net/application/o/userinfo/ # source: globals.yaml → global.domains.public
      # client_id & client_secret injected via GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      # and GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from grafana-oidc-secret
      role_attribute_path:
        "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' ||
        'Viewer'"
    unified_alerting.screenshots:
      capture: true
  persistence:
    enabled: true
    existingClaim: grafana-data-block
    storageClassName: nfs-pv
    accessModes: ["ReadWriteMany"]
    size: 2Gi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring
      jsonData:
        maxLines: 250
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus
  imageRenderer:
    enabled: true
    env:
      HTTP_HOST: 0.0.0.0
      BROWSER_TZ: Asia/Jerusalem
      BROWSER_READINESS_TIMEOUT: 60s
      BROWSER_READINESS_DISABLE_NETWORK_WAIT: "true"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

# -----------------------------------------------------------------------------
# node-exporter (DaemonSet - hardware & OS metrics from every node)
# -----------------------------------------------------------------------------
nodeExporter:
  enabled: true

# -----------------------------------------------------------------------------
# kube-state-metrics (K8s object state - pod status, deployments, etc.)
# -----------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true
