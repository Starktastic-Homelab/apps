name: qbittorrent-ru
namespace: media
deployPhase: services
baseApp: services/media/qbittorrent
valuesOverride: true

ingress:
  enabled: true
  host: qbittorrent-ru
  domainType: "internal"
  port: 8080
  serviceName: qbittorrent-ru-main
  auth: true
  authAdmin: true # explicit, though inherited from baseApp (ADR 0014)
  rateLimit: true
