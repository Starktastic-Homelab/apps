  # The three external probes of probe-external.yaml (1.1.1.1 by ICMP, DNS and HTTPS), by their tier and
  # probe_kind labels. An outage is coloured on Pulse (Edge & WAN), where red mirrors BlackboxExternalDepDown.
  internet:
    name: Internet
    icon: mdi-web
    description: The outside world, seen from the cluster
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          # Proof: every Probe scrape that gives probe_success (Edge & WAN tile) gives probe_duration_seconds.
          - label: Ping
            query: max(probe_duration_seconds{probe_kind="icmp"}) * 1000
            format: &milliseconds
              type: number
              suffix: " ms"
              options:
                maximumFractionDigits: 0
          # Proof: as Ping, on the DNS probe.
          - label: DNS
            query: max(probe_duration_seconds{probe_kind="dns"}) * 1000
            format: *milliseconds
          # Proof: probe_success by tier is the Edge & WAN tile's Internet block.
          - label: Up 24h
            query: avg(avg_over_time(probe_success{tier="external"}[24h])) * 100
            format:
              type: percent
              options:
                maximumFractionDigits: 2
  # Traefik's host comes from infrastructure/configs, not a services app.yaml: explicit.
  traefik:
    name: Traefik
    icon: traefik.png
    href: https://traefik.internal.starktastic.net
    description: Ingress & reverse proxy
    siteMonitor: http://traefik-api.traefik-system:8080/ping
    namespace: traefik-system
    app: traefik
    widgets:
      - type: traefik
        url: http://traefik-api.traefik-system:8080
      # Certificates and traffic, from the old Edge & Certs tile. Both cert rules warn at 10 days; red at 3 is an
      # addition, because HSTS turns an expired certificate into an outage (ADR 0020).
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 30000
        metrics:
          - label: Cert Expiry
            query:
              min(certmanager_certificate_expiration_timestamp_seconds{issuer_name="letsencrypt-prod"} > 0) - time()
            format:
              type: number
              scale: 1/86400
              suffix: " days"
              options:
                maximumFractionDigits: 0
          - label: Requests
            query: sum(rate(traefik_entrypoint_requests_total[5m]))
            format:
              type: number
              suffix: " req/s"
              options:
                maximumFractionDigits: 1
          - label: p95 Latency
            query: histogram_quantile(0.95, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))
            format:
              type: number
              scale: 1000
              suffix: " ms"
              options:
                maximumFractionDigits: 0
        highlight:
          Cert Expiry:
            numeric:
              - level: danger
                when: lt
                value: 3
              - level: warn
                when: lt
                value: 10
      # Traefik's own health, job traefik-metrics (proven live 2026-11-14, platform-metrics-probe, third batch):
      # traefik_service_requests_total by code, traefik_open_connections by entrypoint (the metrics entrypoint is
      # left out), traefik_config_last_reload_success. That last one is the Unix time of the last reload that
      # worked, not a 0/1 flag (seen live 2026-11-14), so the block shows its age. Traefik reloads whenever a route
      # or an endpoint changes; an age that only grows while pods restart means reloads have stopped working.
      # No alert rule in Git reads these, so no highlight.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 30000
        metrics:
          - label: 5xx Rate
            query:
              (sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) or vector(0)) and
              count(up{job="traefik-metrics"} == 1)
            format:
              type: number
              suffix: " req/s"
              options:
                maximumFractionDigits: 2
          - label: Open Conns
            query: sum(traefik_open_connections{entrypoint!="metrics"})
            format: *whole
          - label: Last Reload
            query: time() - max(traefik_config_last_reload_success)
            format:
              type: number
              scale: 1/60
              suffix: " min"
              options:
                maximumFractionDigits: 0
  # Blackbox targets that fail right now, by target and tier. The list is empty when all answer. Proof:
  # probe_success with labels instance and tier (proven live 2026-11-14, platform-metrics-probe, third batch); the
  # Edge & WAN card counts the same series.
  failing-probes:
    name: Failing Probes
    icon: mdi-lan-disconnect
    description: Targets that do not answer
    widgets:
      - type: customapi
        url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query?query=probe_success%20%3D%3D%200
        refreshInterval: 30000
        display: dynamic-list
        mappings:
          items: data.result
          name: metric.instance
          label: metric.tier
          limit: 8
  # Off-cluster: explicit.
