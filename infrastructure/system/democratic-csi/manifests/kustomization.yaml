apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD builds this with kustomize.buildOptions --enable-helm (ansible bootstrap_cluster):
# the upstream chart, plus one patch to the node DaemonSet's shutdown (F14, ADR 0017).
helmCharts:
  - name: democratic-csi
    repo: https://democratic-csi.github.io/charts/
    version: 0.15.1
    releaseName: democratic-csi
    namespace: democratic-csi
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - storage-fencer.yaml
  - f1-canary.yaml

patches:
  - path: node-shutdown-patch.yaml
    target:
      kind: DaemonSet
      name: democratic-csi-node
