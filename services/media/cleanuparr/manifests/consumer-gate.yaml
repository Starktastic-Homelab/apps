apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanuparr-postgres-completion
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanuparr-postgres-completion
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-enrollment-completion-reader
subjects:
  - kind: ServiceAccount
    name: cleanuparr-postgres-completion
    namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanuparr-postgres-completion
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-enrollment-completion-reader
subjects:
  - kind: ServiceAccount
    name: cleanuparr-postgres-completion
    namespace: media
