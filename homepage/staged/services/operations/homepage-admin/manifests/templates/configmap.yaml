apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-admin-config
  namespace: operations
data:
  proxmox.yaml: |
    pve:
      url: https://10.9.9.20:8006
      token: '{{ "{{" }}HOMEPAGE_VAR_PROXMOX_USER{{ "}}" }}'
