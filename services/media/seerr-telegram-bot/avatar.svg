<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Bot profile picture: household palette (homepage/pages/household/files/favicon.svg). Telegram crops it to a circle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1D33"/>
      <stop offset="1" stop-color="#0F0F1A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st" gradientUnits="userSpaceOnUse" x1="128" y1="110" x2="384" y2="390">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#93C5FD"/>
      <stop offset=".75" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="236" fill="url(#glow)"/>
  <!-- chat bubble -->
  <path d="M184 128H328A56 56 0 0 1 384 184V272A56 56 0 0 1 328 328H240L168 380L184 328A56 56 0 0 1 128 272V184A56 56 0 0 1 184 128Z"
        fill="#FFFFFF" fill-opacity=".04" stroke="url(#st)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- play button -->
  <path d="M232 180L232 276L314 228Z" fill="url(#st)" stroke="url(#st)" stroke-width="16" stroke-linejoin="round"/>
</svg>
