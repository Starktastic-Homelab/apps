apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ak-outpost-internal-gate-ingress
  namespace: authentik
  annotations:
    comment: The gate decides admin access for *.internal, so only Traefik and Prometheus may reach it (ADR 0014)
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost-proxy
      app.kubernetes.io/instance: ak-outpost-internal-gate
  policyTypes:
    - Ingress
  ingress:
    # Traefik sends forwardAuth checks and the auth.internal outpost paths.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik-system
      ports:
        - port: 9000
          protocol: TCP
    # The ServiceMonitor scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9300
          protocol: TCP
