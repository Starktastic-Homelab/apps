  <rect class="tag" x="620" y="124" width="56" height="22" rx="11"/><text class="tagt" x="648" y="139.32" font-size="12" text-anchor="middle">base</text>
  <path class="rule" d="M386 178H674"/>
  <rect class="wf" x="384" y="194" width="292" height="28" rx="8"/><text class="wft mono" x="394" y="212.375" font-size="12.5">templates/globals.yaml</text>
  <rect class="wf" x="384" y="268" width="292" height="28" rx="8"/><text class="wft mono" x="394" y="286.375" font-size="12.5">templates/common.yaml</text>
  <rect class="wf" x="384" y="342" width="292" height="28" rx="8"/><text class="wft mono" x="394" y="360.375" font-size="12.5">templates/media-arr-common.yaml</text>
  <rect class="wf" x="384" y="416" width="292" height="28" rx="8"/><text class="wft mono" x="394" y="434.375" font-size="12.5">services/media/radarr/values.yaml</text>
  <g class="t2" font-size="12.5">
    <text x="384" y="388">named in its commonValuesExtras</text>
    <text x="384" y="462">its own values</text>
  </g>
  <text class="t3" x="384" y="509" font-size="12.5">no fifth file: radarr has no base app</text>

  <!-- variant -->
