apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: karakeep-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: held-source
      expression:
        has(object.spec.volumes) && object.spec.volumes.exists(v, (object.metadata.namespace == "operations" &&
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ["karakeep-data", "karakeep-meilisearch"])
        || (has(v.nfs) && (v.nfs.path == "/mnt/apps/pv/operations/karakeep-data" ||
        v.nfs.path.startsWith("/mnt/apps/pv/operations/karakeep-data/") || v.nfs.path ==
        "/mnt/apps/pv/operations/karakeep-meilisearch" ||
        v.nfs.path.startsWith("/mnt/apps/pv/operations/karakeep-meilisearch/"))))
  validations:
    - expression: "false"
      message: Preserved karakeep NFS state is retired; recovery acceptance is required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: karakeep-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: karakeep-source-hold
  validationActions:
    - Deny
