apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - immich-secret.yaml
  - pvc.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: immich-postgres-retained-startup
    namespace: media
    files:
      - guard.sh=retained-startup/guard.sh
