apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data-block
  namespace: operations
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: proxmox-retained
  volumeName: ntfy-data-block
  resources:
    requests:
      storage: 8Gi
