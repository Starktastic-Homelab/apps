# Shared bjw-s app-template values for the *arr family (sonarr, radarr,
# lidarr, prowlarr, bazarr). Loaded via `commonValuesExtras` from each
# service's app.yaml, before the service's own values.yaml.
#
# Per-service values.yaml still owns:
#   - controllers.main.containers.main.image
#   - probe spec.httpGet.port and service.main.ports.http.port
#   - service-specific extras (e.g. bazarr's envFrom and scripts mount,
#     prowlarr's persistence.media.enabled: false override)
controllers:
  main:
    containers:
      main:
        # A pod IP can change after recreation and fail the app's AllowedHosts.
        # Keep probing that IP, with a stable hostname accepted by the app.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                httpHeaders:
                  - name: Host
                    value: localhost
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                httpHeaders:
                  - name: Host
                    value: localhost
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                httpHeaders:
                  - name: Host
                    value: localhost

service:
  main:
    controller: main

persistence:
  media:
    enabled: true
