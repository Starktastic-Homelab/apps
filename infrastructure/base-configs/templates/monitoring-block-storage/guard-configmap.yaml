apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-retained-startup-guard
  namespace: monitoring
data:
  guard.py: "#!/usr/bin/env python3\n\"\"\"Check retained monitoring identity and\
    \ native paths without changing data.\n\nNative block/WAL parsing belongs to the\
    \ exact application images and qualified\nrecovery checks. This guard prevents\
    \ missing-volume bootstrap; it is not a backup\nintegrity checker and does not\
    \ repair any file.\n\"\"\"\nimport os\nfrom pathlib import Path\nimport stat\n\
    import sys\n\nLAYOUTS = {\n    'prometheus': (('prometheus-db', 'prometheus-db/wal'),\
    \ ()),\n    'alertmanager': (('alertmanager-db',), ('alertmanager-db/silences',\
    \ 'alertmanager-db/nflog')),\n    'loki': (('wal', 'chunks', 'tsdb-shipper-active',\
    \ 'compactor'), ()),\n    'tempo': (('wal', 'traces'), ()),\n}\n\n\ndef validate(app,\
    \ root):\n    if app not in LAYOUTS or root.absolute() != root.resolve(strict=True)\
    \ or not root.is_dir():\n        raise ValueError('Invalid retained root or application')\n\
    \    marker = root / ('.homelab-' + app + '-data')\n    fd = os.open(marker, os.O_RDONLY\
    \ | os.O_NOFOLLOW)\n    with os.fdopen(fd, 'rb') as file:\n        info = os.fstat(file.fileno())\n\
    \        if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 128:\n \
    \           raise ValueError('Invalid retained identity file')\n        if file.read(129)\
    \ != ('homelab/' + app + '/data/v1\\n').encode():\n            raise ValueError('Wrong\
    \ retained identity')\n    directories, files = LAYOUTS[app]\n    for name in\
    \ directories:\n        path = root\n        for part in Path(name).parts:\n \
    \           path = path / part\n            if not stat.S_ISDIR(path.lstat().st_mode):\n\
    \                raise ValueError('Missing native retained directory')\n    for\
    \ name in files:\n        path = root / name\n        info = path.lstat()\n  \
    \      if not stat.S_ISREG(info.st_mode):\n            raise ValueError('Missing\
    \ native retained file')\n\n\nif __name__ == '__main__':\n    try:\n        if\
    \ len(sys.argv) != 3:\n            raise ValueError('Expected application and\
    \ retained root')\n        validate(sys.argv[1], Path(sys.argv[2]))\n    except\
    \ (OSError, ValueError, RuntimeError):\n        print('Retained monitoring state\
    \ refused; recovery acceptance is required.', file=sys.stderr)\n        raise\
    \ SystemExit(1) from None\n    print('Retained monitoring identity and native\
    \ paths accepted.')\n"
