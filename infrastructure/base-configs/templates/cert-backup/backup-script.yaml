apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-backup-script
  namespace: cert-backup
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    umask 077

    BACKUP_DIR=/backup
    TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    LIST="${BACKUP_DIR}/.list.tmp"
    FAILURES=0
    # Every "<ns>--<name>" a successful list returned; only these backups survive stale cleanup.
    SEEN=" "
    trap 'rm -f "${BACKUP_DIR}"/.*.tmp' EXIT
    trap 'exit 1' HUP INT TERM

    echo "Starting cert backup at ${TIMESTAMP}"

    fail() {
      echo "  ✗ $1" >&2
      FAILURES=$((FAILURES + 1))
    }

    # Secrets to skip:
    #   - k3s-serving: auto-generated by K3s on every boot
    #   - sealed-secrets-key-*: pre-seeded via Ansible Vault
    #   - webhook certs from self-signed issuers (non-LE)
    should_skip() {
      local ns=$1
      local name=$2

      # K3s internal serving cert (regenerated on boot)
      [ "$name" = "k3s-serving" ] && return 0

      # Sealed Secrets key (already managed by Ansible Vault)
      case "$name" in sealed-secrets-key*) return 0 ;; esac

      # Self-signed / internal issuer certs (not from letsencrypt-prod); a failed lookup counts and keeps the backup
      local issuer
      issuer=$(kubectl get secret "$name" -n "$ns" -o jsonpath='{.metadata.annotations.cert-manager\.io/issuer-name}') \
        || { fail "${ns}/${name} issuer lookup failed"; return 1; }
      if [ -n "$issuer" ] && [ "$issuer" != "letsencrypt-prod" ]; then
        return 0
      fi

      return 1
    }

    backup_secret() {
      local ns=$1
      local name=$2
      local base="${ns}--${name}"
      local raw="${BACKUP_DIR}/.${base}.raw.tmp"
      local tmp="${BACKUP_DIR}/.${base}.tmp"

      if should_skip "$ns" "$name"; then
        echo "  ⊘ ${ns}/${name} (skipped)"
        return
      fi
      SEEN="${SEEN}${base} "

      echo "Backing up ${ns}/${name}..."
      # Separate commands preserve kubectl failures on POSIX sh (no pipefail).
      if kubectl get secret "${name}" -n "${ns}" -o yaml > "$raw" && [ -s "$raw" ] \
        && sed -e '/^\s*\(resourceVersion\|uid\|creationTimestamp\|selfLink\|managedFields\):/d' \
          -e '/^\s*manager:/d; /^\s*operation:/d; /^\s*time:/d; /^\s*fieldsType:/d; /^\s*fieldsV1:/d' \
          -e '/^\s*f:/d' "$raw" > "$tmp" && [ -s "$tmp" ]; then
        mv "$tmp" "${BACKUP_DIR}/${base}.yaml"
        echo "  ✓ ${ns}/${name}"
      else
        fail "${ns}/${name} (failed, previous backup kept)"
      fi
      rm -f "$raw" "$tmp"
    }

    # Backs up every secret `kubectl get secrets --all-namespaces <selector>` lists.
    backup_listed() {
      if ! kubectl get secrets --all-namespaces "$@" \
        -o jsonpath='{range .items[*]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' > "$LIST"; then
        fail "listing secrets $* failed"
        return
      fi
      while read -r ns name; do
        [ -z "$ns" ] && continue
        backup_secret "$ns" "$name"
      done < "$LIST"
    }

    # Discover and back up all TLS secrets (cert-manager issued certs)
    echo "Discovering kubernetes.io/tls secrets..."
    backup_listed --field-selector type=kubernetes.io/tls
    # A healthy cluster always has Let's Encrypt certs, so an empty answer must not prune them all.
    [ -s "$LIST" ] || fail "TLS secret list was empty; refusing stale cleanup"

    # Back up ACME account keys (type Opaque, managed by cert-manager)
    echo "Discovering ACME account keys..."
    backup_listed -l cert-manager.io/key-usage=account-key

    # Also grab the well-known ACME key name as fallback (may not have the label)
    if NAMESPACES=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}'); then
      for ns in $NAMESPACES; do
        if ! found=$(kubectl get secret letsencrypt-prod-account-key -n "$ns" -o name --ignore-not-found); then
          fail "${ns}/letsencrypt-prod-account-key lookup failed"
        elif [ -n "$found" ]; then
          backup_secret "$ns" letsencrypt-prod-account-key
        fi
      done
    else
      fail "listing namespaces failed"
    fi

    # Remove stale backups only after a clean run: an API error must never look like a deleted secret.
    if [ "$FAILURES" -eq 0 ]; then
      echo "Cleaning stale backups..."
      for f in "${BACKUP_DIR}"/*.yaml; do
        [ -f "$f" ] || continue
        fname=$(basename "$f" .yaml)
        case "$SEEN" in
          *" ${fname} "*) ;;
          *)
            echo "  🗑 Removing stale ${fname}.yaml"
            rm -f "$f"
            ;;
        esac
      done
    else
      echo "Skipping stale cleanup after ${FAILURES} failure(s)" >&2
    fi

    echo "Backed up files:"
    ls -l "${BACKUP_DIR}/"

    if [ "$FAILURES" -gt 0 ]; then
      echo "Cert backup failed with ${FAILURES} failure(s) at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2
      exit 1
    fi
    echo "Backup complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
