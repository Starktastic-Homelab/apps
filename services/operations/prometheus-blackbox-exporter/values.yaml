fullnameOverride: prometheus-blackbox-exporter

replicas: 1

resources:
  requests:
    cpu: 25m
    # Peak working set is 51Mi, so 32Mi under-declared it to the scheduler.
    memory: 48Mi
  limits:
    # 51Mi peak was 80% of the old 64Mi cap.
    memory: 96Mi

# Default chart securityContext drops ALL caps; NET_RAW is required for the
# icmp prober (external-dependency reachability to 1.1.1.1).
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["NET_RAW"]

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        method: GET
        follow_redirects: true
        preferred_ip_protocol: "ip4"
    http_auth:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 302, 401, 403]
        method: GET
        follow_redirects: false
        preferred_ip_protocol: "ip4"
    http_admin_gate:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [302]
        method: GET
        follow_redirects: false
        preferred_ip_protocol: "ip4"
        headers:
          Host: admin.internal.starktastic.net
        fail_if_header_not_matches:
          - header: Location
            regexp: '^https://auth\.starktastic\.net/application/o/authorize/\?.*redirect_uri=https%3A%2F%2Fauth\.internal\.starktastic\.net%2F'
        tls_config:
          server_name: admin.internal.starktastic.net
    # A Probe cannot set a Host header per target, so each negative Host gets its own module.
    http_404_admin_public:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [404]
        method: GET
        follow_redirects: false
        preferred_ip_protocol: "ip4"
        headers:
          Host: admin.starktastic.net
        tls_config:
          server_name: admin.starktastic.net
    http_404_auth_internal:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [404]
        method: GET
        follow_redirects: false
        preferred_ip_protocol: "ip4"
        headers:
          Host: auth.internal.starktastic.net
        tls_config:
          server_name: auth.internal.starktastic.net
    icmp:
      prober: icmp
      timeout: 5s
      icmp:
        preferred_ip_protocol: "ip4"
    dns_cloudflare:
      prober: dns
      timeout: 5s
      dns:
        query_name: "cloudflare.com"
        query_type: "A"
        preferred_ip_protocol: "ip4"
    tcp_connect:
      prober: tcp
      timeout: 5s
