controllers:
  main:
    serviceAccount:
      name: homepage-admin
    containers:
      main:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
        env:
          HOMEPAGE_ALLOWED_HOSTS: "admin.internal.starktastic.net"
          LOG_TARGETS: "stdout"
        envFrom:
          - secretRef:
              name: homepage-admin-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/healthcheck
                port: 3000
                httpHeaders:
                  - name: Host
                    value: admin.internal.starktastic.net
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/healthcheck
                port: 3000
                httpHeaders:
                  - name: Host
                    value: admin.internal.starktastic.net
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/healthcheck
                port: 3000
                httpHeaders:
                  - name: Host
                    value: admin.internal.starktastic.net
              failureThreshold: 30
              periodSeconds: 5

defaultPodOptions:
  automountServiceAccountToken: true
  securityContext:
    fsGroup: 1000

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  config:
    enabled: false
  homepage-admin-config:
    enabled: true
    type: configMap
    name: homepage-admin-config
    globalMounts:
      - path: /app/config/settings.yaml
        subPath: settings.yaml
        readOnly: true
      - path: /app/config/services.yaml
        subPath: services.yaml
        readOnly: true
      - path: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
        readOnly: true
      - path: /app/config/widgets.yaml
        subPath: widgets.yaml
        readOnly: true
      - path: /app/config/kubernetes.yaml
        subPath: kubernetes.yaml
        readOnly: true
      - path: /app/config/proxmox.yaml
        subPath: proxmox.yaml
        readOnly: true
      - path: /app/config/custom.js
        subPath: custom.js
        readOnly: true
      - path: /app/config/custom.css
        subPath: custom.css
        readOnly: true
      - path: /app/config/docker.yaml
        subPath: docker.yaml
        readOnly: true
      - path: /app/public/icons/favicon.svg
        subPath: favicon.svg
        readOnly: true
      # The page design's images (ADR 0020). generate.py checks these mounts against the ConfigMap's keys.
      - path: /app/public/images/aurora-live.svg
        subPath: aurora-live.svg
        readOnly: true
      - path: /app/public/images/aurora-still.svg
        subPath: aurora-still.svg
        readOnly: true
      - path: /app/public/images/glyph-iron.svg
        subPath: glyph-iron.svg
        readOnly: true
      - path: /app/public/images/glyph-media.svg
        subPath: glyph-media.svg
        readOnly: true
      - path: /app/public/images/glyph-pipeline.svg
        subPath: glyph-pipeline.svg
        readOnly: true
      - path: /app/public/images/glyph-platform.svg
        subPath: glyph-platform.svg
        readOnly: true
      - path: /app/public/images/glyph-pulse.svg
        subPath: glyph-pulse.svg
        readOnly: true
      - path: /app/public/images/glyph-tools.svg
        subPath: glyph-tools.svg
        readOnly: true
      - path: /app/public/images/grain.svg
        subPath: grain.svg
        readOnly: true
  logs:
    enabled: true
    type: emptyDir
    globalMounts:
      - path: /app/config/logs
