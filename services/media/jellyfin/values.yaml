controllers:
  main:
    # Maintenance hold: follow README.md before resuming or upgrading.
    replicas: 0
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 10.11.11ubu2604-ls47@sha256:438e44330078e6b1a810fdec9dc0f4773e6595edb137c5eb4417a516da4c7f0e
        env:
          JELLYFIN_PublishedServerUrl: "https://benplus.app" # source: globals.yaml → global.domains.media
        resources:
          limits:
            gpu.intel.com/i915: "1"
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
          readiness:
            enabled: true
            # Jellyfin 12 returns HTTP 200 with "Degraded" during migrations.
            # Gate traffic on the body, without turning migration into a liveness failure.
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test "$(curl -fsS --max-time 4 http://127.0.0.1:8096/health)" = Healthy
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
            spec:
              initialDelaySeconds: 30
              failureThreshold: 60
              periodSeconds: 10

service:
  main:
    controller: main
    ports:
      http:
        port: 8096
  discovery:
    controller: main
    type: ClusterIP
    ports:
      discovery:
        port: 7359
        protocol: UDP

persistence:
  config:
    enabled: false
  jellyfin-config:
    existingClaim: jellyfin-config
    globalMounts:
      - path: /config
  media:
    enabled: true
  jellyfin-cache:
    existingClaim: jellyfin-cache
    globalMounts:
      - path: /config/cache
