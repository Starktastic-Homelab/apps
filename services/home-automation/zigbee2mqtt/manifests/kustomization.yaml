apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: zigbee2mqtt-retained-startup-guard
    namespace: home-automation
    files:
      - guard.py=retained-startup/guard.py
