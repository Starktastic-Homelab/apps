env:
  email: "benfaingold@gmail.com"
existingSecret: "pgadmin-secret"
secretKeys:
  pgadminPasswordKey: "password"
envVarsExtra:
  - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
    value: "['webserver', 'internal']"

  - name: PGADMIN_CONFIG_WEBSERVER_REMOTE_USER
    value: "'X-authentik-email'"

  - name: PGADMIN_CONFIG_WEBSERVER_AUTO_CREATE_USER
    value: "False"

  - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
    value: "False"
persistentVolume:
  enabled: true
  size: 1Gi
  # Must stay explicit. infrastructure/** apps get commonValues: "" from the
  # appset, so templates/common.yaml never reaches them and this has to be
  # pinned per chart. See docs/adr/0009-explicit-storageclass-over-default.md.
  storageClass: nfs-pv
serverDefinitions:
  enabled: true
  resourceType: ConfigMap
  servers:
    primaryDB:
      Name: "Starktastic Postgres"
      Group: "Servers"
      Username: "postgres"
      Host: "postgres-postgresql"
      Port: 5432
      SSLMode: "prefer"
      MaintenanceDB: "postgres"
securityContext:
  fsGroup: 5050
  runAsUser: 5050
