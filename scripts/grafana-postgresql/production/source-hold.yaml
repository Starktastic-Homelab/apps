apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: grafana-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: held-data-claim
      expression:
        has(object.spec.volumes) && object.spec.volumes.exists(v, (object.metadata.namespace == 'monitoring' &&
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'kube-prometheus-stack-grafana') ||
        (has(v.nfs) && (v.nfs.path == '/mnt/apps/pv/monitoring/kube-prometheus-stack-grafana' ||
        v.nfs.path.startsWith('/mnt/apps/pv/monitoring/kube-prometheus-stack-grafana/'))))
  validations:
    - expression: "false"
      message: The preserved Grafana NFS source is held; restore acceptance is required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: grafana-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: grafana-source-hold
  validationActions:
    - Deny
