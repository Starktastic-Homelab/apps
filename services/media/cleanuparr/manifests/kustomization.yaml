apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - consumer-gate.yaml
  - database-guard.yaml
  - postgres-secret.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: cleanuparr-retained-startup-guard
    namespace: media
    files:
      - guard.py=retained-startup/guard.py
