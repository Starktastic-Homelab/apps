    - Edge:
      - Traefik:
          id: traefik
          icon: traefik.png
          href: https://traefik.internal.starktastic.net
          description: Ingress & reverse proxy
          siteMonitor: http://traefik-api.traefik-system:8080/ping
          namespace: traefik-system
          app: traefik
          widgets:
          - type: traefik
            url: http://traefik-api.traefik-system:8080
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Cert Expiry
              query: min(certmanager_certificate_expiration_timestamp_seconds{issuer_name="letsencrypt-prod"} > 0) - time()
              format:
                type: number
                scale: 1/86400
                suffix: ' days'
                options:
                  maximumFractionDigits: 0
            - label: Requests
              query: sum(rate(traefik_entrypoint_requests_total[5m]))
              format:
                type: number
                suffix: ' req/s'
                options:
                  maximumFractionDigits: 1
            - label: p95 Latency
              query: histogram_quantile(0.95, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))
              format:
                type: number
                scale: 1000
                suffix: ' ms'
                options:
                  maximumFractionDigits: 0
            highlight:
              Cert Expiry:
                numeric:
                - level: danger
                  when: lt
                  value: 3
                - level: warn
                  when: lt
                  value: 10
