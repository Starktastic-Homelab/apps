controllers:
  main:
    containers:
      main:
        env:
          RADARR__SERVER__ALLOWEDHOSTS: radarr-ru,radarr-ru.media,radarr-ru.media.svc,radarr-ru.media.svc.cluster.local,radarr-ru.internal.starktastic.net
    initContainers:
      retained-state:
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - radarr-ru
          - /retained
persistence:
  retained-config:
    existingClaim: radarr-ru-config-block
