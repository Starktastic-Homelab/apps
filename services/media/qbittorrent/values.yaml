controllers:
  main:
    pod:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
    initContainers:
      clean-stale-locks:
        image:
          repository: busybox
          tag: stable
        command:
          - sh
          - -c
          - |
            rm -fv /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
        dependsOn: retained-data
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - qbittorrent
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 5.2.3_v2.0.14-ls476@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
        env:
          WEBUI_PORT: "8080"
          DOCKER_MODS: "ghcr.io/gabe565/linuxserver-mod-vuetorrent"
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8080
          readiness:
            enabled: true
            type: TCP
            port: 8080
          startup:
            enabled: true
            type: TCP
            port: 8080
            spec:
              failureThreshold: 30
              periodSeconds: 5
    replicas: 1
    strategy: Recreate
service:
  main:
    controller: main
    ports:
      http:
        port: 8080
  bittorrent:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: "{{ .Values.global.network.loadBalancers.qbittorrent }}"
    ports:
      bittorrent-tcp:
        enabled: true
        port: 56881
        protocol: TCP
      bittorrent-udp:
        enabled: true
        port: 56881
        protocol: UDP
persistence:
  config:
    globalMounts:
      - path: /config
      # Keep downloaded mods available when the registry is unreachable at startup.
      - path: /modcache
        subPath: modcache
    enabled: false
  media:
    enabled: true
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /data
  incomplete:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: qbittorrent-incomplete-pvc
    advancedMounts:
      main:
        main:
          - path: /downloads/incomplete
            subPath: qbittorrent
    globalMounts: []
  retained-startup:
    type: configMap
    name: utility-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  retained-config:
    enabled: true
    existingClaim: qbittorrent-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
          - subPath: modcache
            path: /modcache
        retained-data:
          - path: /retained
            readOnly: true
        clean-stale-locks:
          - path: /config
