apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-data-block
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: proxmox-retained
  volumeName: pgadmin-data-block
  resources:
    requests:
      storage: 1Gi
