controllers:
  main:
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.6.2-ls373@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
        envFrom:
          - secretRef:
              name: bazarr-secret
        probes:
          liveness:
            spec:
              httpGet:
                port: 6767
          readiness:
            spec:
              httpGet:
                port: 6767
          startup:
            spec:
              httpGet:
                port: 6767
        env:
          POSTGRES_ENABLED: "true"
          POSTGRES_HOST: postgres-postgresql.databases
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: bazarr
          POSTGRES_USERNAME: bazarr
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: bazarr-postgres-secret
                key: password
    replicas: 1
    strategy: Recreate
    serviceAccount:
      name: bazarr-postgres-completion
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - bazarr
          - /config
          - config
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      enrollment:
        command:
          - python3
          - -B
          - /gate/completion_gate.py
        args:
          - --id
          - bazarr
          - --database
          - bazarr
          - --role
          - bazarr
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        dependsOn: retained-state
service:
  main:
    ports:
      http:
        port: 6767
persistence:
  scripts:
    type: configMap
    name: bazarr-scripts
    defaultMode: 493
    globalMounts:
      - path: /scripts
  pg-completion-script:
    type: configMap
    name: bazarr-postgres-completion
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate
            readOnly: true
  pg-completion-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate-api
            readOnly: true
  config:
    enabled: false
  bazarr-config:
    existingClaim: bazarr-files
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /config
            readOnly: true
  retained-startup:
    type: configMap
    name: retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
