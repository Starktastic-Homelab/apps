# Link previews: the household page is behind Authentik, so a chat app's link fetcher (WhatsApp, Telegram,
# Slack, ...) only ever saw the sign-in page, which has no preview tags. Requests to starktastic.net whose
# User-Agent is a known link fetcher get this static card instead. A spoofed User-Agent gets the same card and
# nothing else: no dashboard, no data. Everyone else still goes through the Homepage route and Authentik.
# The image is files/link-preview/og.svg rendered to og.jpg (1200x630; chat apps take no SVG):
#   rsvg-convert -w 1200 -h 630 og.svg | magick - -strip -quality 92 og.jpg   (Manrope must be installed)
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-link-preview
  namespace: operations
data:
  index.html: |
{{ .Files.Get "files/link-preview/index.html" | indent 4 }}
  default.conf: |
{{ .Files.Get "files/link-preview/default.conf" | indent 4 }}
binaryData:
  og.jpg: {{ .Files.Get "files/link-preview/og.jpg" | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-link-preview
  namespace: operations
  labels:
    app.kubernetes.io/name: homepage-link-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage-link-preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage-link-preview
      annotations:
        checksum/content: {{ print (.Files.Get "files/link-preview/index.html") (.Files.Get "files/link-preview/default.conf") (.Files.Get "files/link-preview/og.jpg") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /usr/share/nginx/html/og.jpg
              subPath: og.jpg
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: homepage-link-preview
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homepage-link-preview
  namespace: operations
spec:
  selector:
    app.kubernetes.io/name: homepage-link-preview
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-link-preview
  namespace: operations
spec:
  entryPoints:
    - websecure
  routes:
    # Longer than the Homepage route's Host() rule, so Traefik's default (rule-length) priority tries it first.
    - match: Host(`starktastic.net`) && HeaderRegexp(`User-Agent`, `(?i)(whatsapp|facebookexternalhit|facebookcatalog|meta-externalagent|twitterbot|telegrambot|slackbot|discordbot|linkedinbot|skypeuripreview|microsoftpreview|google-pagerenderer|viber|embedly|iframely|pinterestbot|redditbot|mastodon)`)
      kind: Rule
      services:
        - name: homepage-link-preview
          port: 80
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik-system
        - name: rate-limit-strong
          namespace: traefik-system
    # The card's image is public for any client: chat apps often fetch it through an image proxy (Slack-ImgProxy, ...)
    # whose User-Agent the rule above does not know.
    - match: Host(`starktastic.net`) && Path(`/og.jpg`)
      kind: Rule
      services:
        - name: homepage-link-preview
          port: 80
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik-system
        - name: rate-limit-strong
          namespace: traefik-system
  tls:
    store:
      name: default
      namespace: traefik-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage-link-preview-ingress
  namespace: operations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage-link-preview
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik-system
      ports:
        - port: 8080
