apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres-completion-gate.yaml
  - prowlarr-postgres-secret.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: prowlarr-retained-startup-guard
    namespace: media
    files:
      - guard.py=retained-startup/guard.py
      - main.sql=retained-startup/main.sql
