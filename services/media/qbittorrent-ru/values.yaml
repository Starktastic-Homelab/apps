# Override values for qbittorrent-ru (base: services/media/qbittorrent)
# Only the delta from the base service's values.yaml
service:
  bittorrent:
    annotations:
      metallb.universe.tf/loadBalancerIPs: "{{ .Values.global.network.loadBalancers.qbittorrentRu }}"
    ports:
      bittorrent-tcp:
        port: 56882
      bittorrent-udp:
        port: 56882

persistence:
  incomplete:
    advancedMounts:
      main:
        main:
          - path: /downloads/incomplete
            subPath: qbittorrent-ru
  retained-config:
    existingClaim: qbittorrent-ru-block
controllers:
  main:
    initContainers:
      retained-data:
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - qbittorrent-ru
          - /retained
