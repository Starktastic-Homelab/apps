defaultPodOptions:
  securityContext:
    fsGroup: 1000

controllers:
  main:
    containers:
      main:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        env:
          TZ: "Asia/Jerusalem"
          PUID: "1000"
          PGID: "1000"
        probes:
          liveness:
            spec:
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            spec:
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            spec:
              failureThreshold: 30
              periodSeconds: 5

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    # Must stay explicit. k3s recreates its local-path StorageClass (also
    # annotated default) on every restart, so it is always the newest default
    # and always wins the DefaultStorageClass newest-wins tiebreak. Omitting
    # this silently puts an RWX volume on node-local RWO storage.
    storageClass: nfs-pv
    size: 1Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /config
  media:
    enabled: false
    existingClaim: media-library-pvc
    globalMounts:
      - path: /data
