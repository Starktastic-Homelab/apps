controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 12.4ubu2604-ls59@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
        env:
          JELLYFIN_PublishedServerUrl: "https://benplus.app" # source: globals.yaml → global.domains.media
          # The image ships no Intel OpenCL ICD; without it HDR tone mapping falls back to VPP only.
          # shortcut: floating mod tag installed at every start, pin a digest if Renovate learns DOCKER_MODS.
          DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
          # Intel OpenCL opens /dev/dri/by-path/*-render, which the GPU plugin bind-mounts with the host's
          # render gid. The image default (`/dev/dri ... -type c`) skips those mounts, so abc never joins that
          # group and OpenCL finds no platform. `! -type d` lets init-device-perms add abc to it.
          ATTACHED_DEVICES_PERMS: "/dev/dri ! -type d"
        resources:
          limits:
            gpu.intel.com/i915: "1"
            ephemeral-storage: 12Gi
          requests:
            ephemeral-storage: 12Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
          readiness:
            enabled: true
            # Jellyfin 12 returns HTTP 200 with "Degraded" during migrations.
            # Gate traffic on the body, without turning migration into a liveness failure.
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test "$(curl -fsS --max-time 4 http://127.0.0.1:8096/health)" = Healthy
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
            spec:
              initialDelaySeconds: 30
              failureThreshold: 60
              periodSeconds: 10
    strategy: Recreate
    pod:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
    initContainers:
      disposable-dirs:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 12.4ubu2604-ls59@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
        command:
          - /bin/sh
          - -ec
          - mkdir -p /disposable/cache; chown 1000:1000 /disposable/cache
        securityContext:
          runAsUser: 0
service:
  main:
    controller: main
    ports:
      http:
        port: 8096
  discovery:
    controller: main
    type: ClusterIP
    ports:
      discovery:
        port: 7359
        protocol: UDP
persistence:
  config:
    enabled: false
  jellyfin-config:
    existingClaim: jellyfin-config-block
    globalMounts:
      - path: /config
  media:
    enabled: true
  disposable:
    enabled: true
    type: emptyDir
    sizeLimit: 10Gi
    advancedMounts:
      main:
        main:
          # Jellyfin 12 transcodes into <CachePath>/transcodes, so this also holds them.
          - path: /config/cache
            subPath: cache
        disposable-dirs:
          - path: /disposable
