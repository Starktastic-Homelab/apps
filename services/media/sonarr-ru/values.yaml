controllers:
  main:
    containers:
      main:
        env:
          SONARR__SERVER__ALLOWEDHOSTS: sonarr-ru,sonarr-ru.media,sonarr-ru.media.svc,sonarr-ru.media.svc.cluster.local,sonarr-ru.internal.starktastic.net
    initContainers:
      retained-state:
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - sonarr-ru
          - /retained
persistence:
  retained-config:
    existingClaim: sonarr-ru-config-block
