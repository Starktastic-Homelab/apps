apiVersion: batch/v1
kind: CronJob
metadata:
  name: listmonk-sync
  namespace: operations
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: badouralix/curl-jq:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e

                  AUTHENTIK_URL="http://authentik-server.authentik"
                  LISTMONK_URL="http://listmonk.operations:9000"
                  LIST_ID=3
                  EXCLUDE_EMAILS="root@example.com,benfaingold@gmail.com"

                  echo "Fetching users from Authentik..."
                  PAGE=1
                  while true; do
                    RESPONSE=$(curl -sf \
                      -H "Authorization: Bearer ${AUTHENTIK_API_TOKEN}" \
                      "${AUTHENTIK_URL}/api/v3/core/users/?is_active=true&page=${PAGE}&page_size=100")

                    # Accounts without an email are dropped in jq: read strips a leading tab, so the name would land in EMAIL.
                    echo "$RESPONSE" | jq -r '.results[] | select((.email // "") != "") | "\(.email)\t\(.name)"' | while IFS="$(printf '\t')" read -r EMAIL NAME; do
                      echo "${EXCLUDE_EMAILS}" | tr ',' '\n' | grep -qxF "$EMAIL" && {
                        echo "Skipping excluded: ${EMAIL}"
                        continue
                      }

                      [ -z "$NAME" ] && NAME="$EMAIL"

                      echo "Syncing: ${NAME} <${EMAIL}>"

                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                        -u "${LISTMONK_API_USER}:${LISTMONK_API_PASSWORD}" \
                        -H "Content-Type: application/json" \
                        -d "{\"email\":\"${EMAIL}\",\"name\":\"${NAME}\",\"status\":\"enabled\",\"lists\":[${LIST_ID}],\"preconfirm_subscriptions\":true}" \
                        "${LISTMONK_URL}/api/subscribers")

                      case "$STATUS" in
                        200) echo "  -> Created" ;;
                        409) echo "  -> Already exists (skipped)" ;;
                        *)   echo "  -> Unexpected status: ${STATUS}" ;;
                      esac
                    done

                    # Authentik pages under .pagination; next is the next page number, 0 on the last page.
                    PAGE=$(echo "$RESPONSE" | jq -r '.pagination.next // 0')
                    [ "$PAGE" = "0" ] && break
                  done

                  echo "Sync complete."
              envFrom:
                - secretRef:
                    name: listmonk-sync-secret
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
