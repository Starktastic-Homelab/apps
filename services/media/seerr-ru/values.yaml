controllers:
  main:
    serviceAccount:
      name: seerr-ru-postgres-completion
    containers:
      main:
        env:
          DB_USER: seerr_ru
          DB_NAME: seerr_ru
          DB_PASS:
            valueFrom:
              secretKeyRef:
                name: seerr-ru-postgres-secret
    initContainers:
      retained-state:
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - seerr-ru
          - /app/config
          - config
          - .homelab-seerr-config
      enrollment:
        args:
          - --id
          - seerr-ru
          - --database
          - seerr_ru
          - --role
          - seerr_ru
persistence:
  pg-completion-script:
    name: seerr-ru-postgres-completion
  seerr-config:
    existingClaim: seerr-ru-files
