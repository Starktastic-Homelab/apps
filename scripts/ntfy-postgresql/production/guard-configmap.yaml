apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-retained-startup-guard
  namespace: operations
data:
  guard.py: |
    #!/usr/bin/env python3
    """Reject missing/wrong retained ntfy state before stock startup; never write or print secrets."""
    import os
    from pathlib import Path
    import sys
    from typing import Mapping
    from urllib.parse import quote


    def validate(root: Path, credentials: Path, env: Mapping[str, str]) -> None:
        if root.is_symlink() or not root.is_dir() or credentials.is_symlink() or not credentials.is_dir():
            raise ValueError('Invalid retained directory')

        def read(path, limit):
            if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size <= limit:
                raise ValueError('Invalid retained file')
            return path.read_text()

        if read(root / '.homelab-ntfy-data', 128) != 'homelab/ntfy/data/v1\n':
            raise ValueError('Wrong retained identity')
        attachments = root / 'attachments'
        if attachments.is_symlink() or not attachments.is_dir():
            raise ValueError('Missing retained attachment directory')
        for name in ('cache.db', 'user.db', 'webpush.db'):
            for suffix in ('', '-wal', '-shm', '-journal'):
                path = root / (name + suffix)
                if path.exists() or path.is_symlink():
                    raise ValueError('Active SQLite fallback')
        # Secret volume keys use kubelet atomic-writer links; the marker must remain a plain file.
        try:
            password_path = (credentials / 'password').resolve(strict=True)
            if not password_path.is_relative_to(credentials.resolve(strict=True)):
                raise ValueError('Credential projection escapes its volume')
        except (OSError, RuntimeError) as error:
            raise ValueError('Invalid credential projection') from error
        password = read(password_path, 4096)
        if not password.strip() or any(c in password for c in '\0\r\n'):
            raise ValueError('Invalid database credential')
        expected = 'postgresql://ntfy:' + quote(password, safe='') + '@postgres-postgresql.databases:5432/ntfy'
        if env.get('NTFY_DATABASE_URL') != expected:
            raise ValueError('Wrong database URL')
        for name in ('NTFY_AUTH_FILE', 'NTFY_CACHE_FILE', 'NTFY_WEB_PUSH_FILE', 'NTFY_DATABASE_REPLICA_URLS'):
            if env.get(name):
                raise ValueError('Conflicting database configuration')


    if __name__ == '__main__':
        try:
            if len(sys.argv) != 3:
                raise ValueError('Expected retained and credential directories')
            validate(Path(sys.argv[1]), Path(sys.argv[2]), os.environ)
        except (OSError, UnicodeError, ValueError):
            print('Retained ntfy state refused; restore acceptance is required.', file=sys.stderr)
            raise SystemExit(1) from None
        print('Retained ntfy identity accepted.')
  main.sql: |
    -- Read-only canonical ntfy login. No empty database initialization or credential output.
    BEGIN READ ONLY;
    SET LOCAL statement_timeout = '10s';
    DO $guard$
    DECLARE actual jsonb;
    BEGIN
      IF current_database() <> 'ntfy' OR current_user <> 'ntfy'
         OR (SELECT system_identifier::text FROM pg_control_system()) <> '7584099661242523698' THEN
        RAISE EXCEPTION 'Retained ntfy physical database identity rejected';
      END IF;
      IF (SELECT count(*) FROM pg_catalog.pg_class
          WHERE relnamespace='public'::regnamespace AND relkind IN ('r','p')) <> 12
         OR EXISTS (SELECT 1 FROM pg_catalog.pg_class c JOIN pg_catalog.pg_roles r ON r.oid=c.relowner
                    WHERE c.relnamespace='public'::regnamespace AND c.relkind IN ('r','p') AND r.rolname <> 'ntfy') THEN
        RAISE EXCEPTION 'Retained ntfy unexpected schema rejected';
      END IF;
      SELECT jsonb_object_agg(table_name,cols) INTO actual FROM (
        SELECT table_name,jsonb_agg(jsonb_build_array(column_name,data_type,is_nullable) ORDER BY ordinal_position) cols
        FROM information_schema.columns WHERE table_schema='public' GROUP BY table_name
      ) columns;
      IF actual IS DISTINCT FROM $columns${"message":[["id","bigint","NO"],["mid","text","NO"],["sequence_id","text","NO"],["time","bigint","NO"],["event","text","NO"],["expires","bigint","NO"],["topic","text","NO"],["message","text","NO"],["title","text","NO"],["priority","integer","NO"],["tags","text","NO"],["click","text","NO"],["icon","text","NO"],["actions","text","NO"],["attachment_name","text","NO"],["attachment_type","text","NO"],["attachment_size","bigint","NO"],["attachment_expires","bigint","NO"],["attachment_url","text","NO"],["attachment_deleted","boolean","NO"],["sender","text","NO"],["user_id","text","NO"],["content_type","text","NO"],["encoding","text","NO"],["published","boolean","NO"]],"message_stats":[["key","text","NO"],["value","bigint","YES"]],"schema_version":[["store","text","NO"],["version","integer","NO"]],"tier":[["id","text","NO"],["code","text","NO"],["name","text","NO"],["messages_limit","bigint","NO"],["messages_expiry_duration","bigint","NO"],["emails_limit","bigint","NO"],["calls_limit","bigint","NO"],["reservations_limit","bigint","NO"],["attachment_file_size_limit","bigint","NO"],["attachment_total_size_limit","bigint","NO"],["attachment_expiry_duration","bigint","NO"],["attachment_bandwidth_limit","bigint","NO"],["stripe_monthly_price_id","text","YES"],["stripe_yearly_price_id","text","YES"]],"user":[["id","text","NO"],["tier_id","text","YES"],["user_name","text","NO"],["pass","text","NO"],["role","text","NO"],["prefs","jsonb","NO"],["sync_topic","text","NO"],["provisioned","boolean","NO"],["stats_messages","bigint","NO"],["stats_emails","bigint","NO"],["stats_calls","bigint","NO"],["stripe_customer_id","text","YES"],["stripe_subscription_id","text","YES"],["stripe_subscription_status","text","YES"],["stripe_subscription_interval","text","YES"],["stripe_subscription_paid_until","bigint","YES"],["stripe_subscription_cancel_at","bigint","YES"],["created","bigint","NO"],["deleted","bigint","YES"]],"user_access":[["user_id","text","NO"],["topic","text","NO"],["read","boolean","NO"],["write","boolean","NO"],["owner_user_id","text","YES"],["provisioned","boolean","NO"]],"user_email":[["user_id","text","NO"],["email","text","NO"],["is_primary","boolean","NO"]],"user_magic_link":[["token_hash","text","NO"],["kind","text","NO"],["user_id","text","NO"],["email","text","YES"],["expires","bigint","NO"],["created","bigint","NO"]],"user_phone":[["user_id","text","NO"],["phone_number","text","NO"]],"user_token":[["user_id","text","NO"],["token","text","NO"],["label","text","NO"],["last_access","bigint","NO"],["last_origin","text","NO"],["expires","bigint","NO"],["provisioned","boolean","NO"]],"webpush_subscription":[["id","text","NO"],["endpoint","text","NO"],["key_auth","text","NO"],["key_p256dh","text","NO"],["user_id","text","NO"],["subscriber_ip","text","NO"],["updated_at","bigint","NO"],["warned_at","bigint","NO"]],"webpush_subscription_topic":[["subscription_id","text","NO"],["topic","text","NO"]]}$columns$::jsonb THEN
        RAISE EXCEPTION 'Retained ntfy incomplete columns rejected';
      END IF;
      IF (SELECT jsonb_object_agg(store,version) FROM public.schema_version)
             IS DISTINCT FROM '{"user":9,"message":15,"webpush":1}'::jsonb
         OR (SELECT count(*) FROM public.schema_version) <> 3
         OR NOT EXISTS (SELECT 1 FROM public."user" WHERE id='u_everyone' AND user_name='*' AND role='anonymous')
         OR NOT EXISTS (SELECT 1 FROM public."user" WHERE role='admin')
         OR NOT EXISTS (SELECT 1 FROM public.message_stats WHERE key='messages' AND value >= 0) THEN
        RAISE EXCEPTION 'Retained ntfy initialized state rejected';
      END IF;
    END
    $guard$;
    COMMIT;
