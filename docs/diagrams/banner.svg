  <style>
    text { font-family: Manrope, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .panel { fill: #0B0C16; }
    .card { fill: url(#card); fill-opacity: .8; }
    .rim { fill: none; stroke: url(#rim); }
    .lit { fill: none; stroke: #60A5FA; stroke-width: 2; }
    .lane { fill: #FFFFFF; fill-opacity: .035; stroke: #FFFFFF; stroke-opacity: .09; }
    .tile { fill: #262A52; }
    .t1 { fill: #F5F7FF; }
    .t2 { fill: #AEB9D6; }
    .t3 { fill: #7F8AAB; }
    .acc { fill: #93C5FD; }
    .vio { fill: #C4B5FD; }
    .amb { fill: #FCD34D; }
    .rule { stroke: #FFFFFF; stroke-opacity: .1; }
    .chip { fill: #3B82F6; fill-opacity: .16; stroke: #60A5FA; stroke-opacity: .45; }
    .chipt { fill: #DBEAFE; }
    .wf { fill: #FFFFFF; fill-opacity: .06; stroke: #FFFFFF; stroke-opacity: .2; }
    .wft { fill: #E6EBFA; }
    .dot { fill: #22D3EE; }
    .edge { fill: none; stroke: url(#edge); stroke-width: 2.5; stroke-opacity: .35; }
    .flow { fill: none; stroke: url(#edge); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 1.1s linear infinite; }
    .head { fill: #22D3EE; }
    .badge { fill: #0F1124; stroke: #60A5FA; stroke-width: 1.5; }
    .badget { fill: #DBEAFE; }
    .side { fill: none; stroke: #A78BFA; stroke-width: 1.5; stroke-dasharray: 3 5; stroke-linecap: round; animation: flow 3s linear infinite; }
    .sidehead { fill: #A78BFA; }
    .pill { fill: #171331; stroke: #A78BFA; stroke-opacity: .55; }
    .pillt { fill: #DDD6FE; }
    .wire { fill: none; stroke: #8A94B8; stroke-opacity: .6; stroke-width: 1.5; }
    .wirehead { fill: #8A94B8; }
    .hum { fill: #2A2110; stroke: #FBBF24; stroke-opacity: .6; }
    .humt { fill: #FDE68A; }
    .gate { fill: none; stroke: #FBBF24; stroke-opacity: .7; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .tag { fill: #151936; stroke: #8A94B8; stroke-opacity: .5; }
    .tagt { fill: #C9D1EA; }
    .here { fill: #13244D; stroke: #60A5FA; }
    .heret { fill: #DBEAFE; }
    .dim { opacity: .5; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow, .side { animation: none; } }
  </style>
