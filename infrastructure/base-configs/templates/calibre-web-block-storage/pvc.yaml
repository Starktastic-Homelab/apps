apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-block
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: proxmox-retained
  volumeName: calibre-web-block
  resources:
    requests:
      storage: 1Gi
