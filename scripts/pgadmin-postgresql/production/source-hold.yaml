apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pgadmin-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: held-data-claim
      expression:
        has(object.spec.volumes) && object.spec.volumes.exists(v, (object.metadata.namespace == 'databases' &&
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'pgadmin-pgadmin4') || (has(v.nfs) &&
        (v.nfs.path == '/mnt/apps/pv/databases/pgadmin-pgadmin4' ||
        v.nfs.path.startsWith('/mnt/apps/pv/databases/pgadmin-pgadmin4/'))))
  validations:
    - expression: "false"
      message: The preserved pgAdmin NFS source is held; restore acceptance is required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pgadmin-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: pgadmin-source-hold
  validationActions:
    - Deny
