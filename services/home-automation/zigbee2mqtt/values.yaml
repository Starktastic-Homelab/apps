controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/koenkk/zigbee2mqtt
          tag: 2.14.1@sha256:fef0de769dcd04c27b3a6d277b61046eb96284bdd4198dcb1687c3a01b3020f3
        env:
          ZIGBEE2MQTT_CONFIG_MQTT_SERVER: "mqtt://mosquitto.home-automation:1883"
          ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "true"
          ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
          ZIGBEE2MQTT_CONFIG_SERIAL_PORT: "tcp://10.9.9.20:3333"
          ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: "ember"
          ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE: "115200"
          ZIGBEE2MQTT_CONFIG_SERIAL_RTSCTS: "false"
          ZIGBEE2MQTT_CONFIG_ADVANCED_WATCHDOG: "true"
        securityContext:
          privileged: false
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8080
          readiness:
            enabled: true
            type: TCP
            port: 8080
          startup:
            enabled: true
            type: TCP
            port: 8080
            spec:
              failureThreshold: 60
              periodSeconds: 5

    replicas: 1
    pod:
      automountServiceAccountToken: false
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - zigbee2mqtt
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 8080

persistence:
  config:
    enabled: false
  zigbee2mqtt-config:
    existingClaim: zigbee2mqtt-config
    globalMounts:
      - path: /app/data
    enabled: false
  media:
    enabled: false
  retained-startup:
    type: configMap
    name: utility-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  retained-config:
    enabled: true
    existingClaim: zigbee2mqtt-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /app/data
        retained-data:
          - path: /retained
            readOnly: true
