# Inactive review inputs, not an Application or executable controller.
consumers:
  authentik:
    namespace: authentik
    path: infrastructure/controllers/authentik
    hold:
      server:
        replicas: 0
      worker:
        replicas: 0
    release:
      server:
        replicas: 2
      worker:
        replicas: 1
