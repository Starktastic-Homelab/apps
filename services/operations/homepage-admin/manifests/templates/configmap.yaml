    - Ship:
      - Argo CD:
          id: argo-cd
          icon: argo-cd.png
          href: https://argocd.internal.starktastic.net
          description: GitOps controller
          siteMonitor: https://argocd-server.argocd.svc.cluster.local:443
          namespace: argocd
          app: argocd-server
          widgets:
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Apps
              query: count(argocd_app_info)
            - label: Synced
              query: (count(argocd_app_info{sync_status="Synced"}) or vector(0)) and count(argocd_app_info)
            - label: OutOfSync
              query: (count(argocd_app_info{sync_status="OutOfSync"}) or vector(0)) and count(argocd_app_info)
            - label: Unhealthy
              query: (count(argocd_app_info{health_status!~"Healthy|Progressing"}) or vector(0)) and count(argocd_app_info)
            highlight:
              OutOfSync:
                numeric:
                - level: warn
                  when: gt
                  value: 0
              Unhealthy:
                numeric:
                - level: danger
                  when: gt
                  value: 0
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Sync Fails 24h
              query: (sum(increase(argocd_app_sync_total{phase!="Succeeded"}[24h])) or vector(0)) and count(argocd_app_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Comparison Errors
              query: (count(max by (namespace, name, project) (argocd_app_info{sync_status="Unknown"}) or max by (namespace, name, project) (argocd_app_condition{condition="ComparisonError"})) or vector(0)) and count(argocd_app_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Notify Fails 1h
              query: (sum(increase(argocd_notifications_deliveries_total{succeeded="false"}[1h])) or vector(0)) and count(argocd_app_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: AppSet Errors
              query: (count(argocd_appset_info{resource_update_status!="ApplicationSetUpToDate"}) or vector(0)) and count(argocd_appset_info)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            highlight:
              Comparison Errors:
                numeric:
                - level: warn
                  when: gt
                  value: 0
              Notify Fails 1h:
                numeric:
                - level: warn
                  when: gt
                  value: 0
