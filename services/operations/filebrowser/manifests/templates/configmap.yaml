apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: operations
data:
  config.yaml: |
    server:
      database:
        path: /home/filebrowser/data/database.sqlite
        # v2 imports the v1 Bolt file into SQLite on first start and leaves it in place.
        migrateFrom: /home/filebrowser/data/database.db
      cacheDir: /home/filebrowser/data/cache
      numImageProcessors: 2
      maxArchiveSize: 5
      logging:
        - levels: "info|warning|error"
      sources:
        - path: /srv/apps
          name: apps
          config:
            defaultEnabled: true
            defaultPermissions:
              view: true
              download: true
              modify: true
              create: true
              delete: true
        - path: /srv/media
          name: media
          config:
            defaultEnabled: true
            defaultPermissions:
              view: true
              download: true
              modify: true
              create: true
              delete: true
    http:
      port: 80
      # Share links use the public host; its route only serves /public/.
      externalUrl: "https://files.{{ .Values.global.domains.public }}"
      trustProxyHeaders: true
    auth:
      methods:
        password:
          enabled: false
        oidc:
          enabled: true
          issuerUrl: "https://auth.{{ .Values.global.domains.public }}/application/o/filebrowser/"
          adminGroup: "authentik Admins"
          userGroups: ["authentik Admins"]
    userDefaults:
      account:
        permissions:
          admin: false
          share: true
          api: false
