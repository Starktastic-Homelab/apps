controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
        env:
          DB_HOSTNAME: immich-postgres
          DB_PORT: "5432"
          DB_DATABASE_NAME: immich
          DB_USERNAME: immich
          DB_VECTOR_EXTENSION: vectorchord
          REDIS_HOSTNAME: redis-master.databases
          REDIS_PORT: "6379"
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
        envFrom:
          - secretRef:
              name: immich-secret
        resources:
          limits:
            gpu.intel.com/i915: "1"
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/server/ping
            port: 2283
          readiness:
            enabled: true
            type: HTTP
            path: /api/server/ping
            port: 2283
          startup:
            enabled: true
            type: HTTP
            path: /api/server/ping
            port: 2283
            spec:
              failureThreshold: 30
              periodSeconds: 5
  machine-learning:
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/immich-machine-learning
          tag: v3.2.2-openvino@sha256:4013ec28ccf6344d7ae24554743a116d7f61124b98858f5646a401d5c5df12e2
        resources:
          limits:
            gpu.intel.com/i915: "1"
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /ping
            port: 3003
          readiness:
            enabled: true
            type: HTTP
            path: /ping
            port: 3003
          startup:
            enabled: true
            type: HTTP
            path: /ping
            port: 3003
            spec:
              failureThreshold: 30
              periodSeconds: 5
  postgres:
    pod:
      securityContext: {}
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
    initContainers:
      verify-retained-data:
        image:
          repository: ghcr.io/immich-app/postgres
          tag: 17-vectorchord0.4.3-pgvector0.8.1@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
        command:
          - /bin/bash
          - /retained-startup/guard.sh
        env:
          EXPECTED_SYSTEM_IDENTIFIER: "7614955115223928876"
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
    containers:
      main:
        image:
          repository: ghcr.io/immich-app/postgres
          tag: 17-vectorchord0.4.3-pgvector0.8.1@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
        env:
          POSTGRES_DB: immich
          POSTGRES_USER: immich
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-secret
                key: DB_PASSWORD
          POSTGRES_INITDB_ARGS: --data-checksums
          PGDATA: /data/pgdata
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 5432
          readiness:
            enabled: true
            type: TCP
            port: 5432
          startup:
            enabled: true
            type: TCP
            port: 5432
            spec:
              failureThreshold: 30
              periodSeconds: 5
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
    strategy: Recreate
service:
  main:
    controller: main
    ports:
      http:
        port: 2283
  machine-learning:
    controller: machine-learning
    ports:
      http:
        port: 3003
  postgres:
    controller: postgres
    ports:
      tcp:
        port: 5432
persistence:
  config:
    enabled: false
  library:
    existingClaim: media-library-pvc
    advancedMounts:
      main:
        main:
          - path: /usr/src/app/upload
            subPath: immich
  pgdata:
    existingClaim: immich-postgres-block
    advancedMounts:
      postgres:
        main:
          - path: /data
        verify-retained-data:
          - path: /data
            readOnly: true
  model-cache:
    existingClaim: immich-model-cache
    advancedMounts:
      machine-learning:
        main:
          - path: /cache
  retained-startup:
    type: configMap
    name: immich-postgres-retained-startup
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      postgres:
        verify-retained-data:
          - path: /retained-startup
            readOnly: true
  retained-scratch:
    type: emptyDir
    sizeLimit: 16Mi
    globalMounts: []
    advancedMounts:
      postgres:
        verify-retained-data:
          - path: /tmp
