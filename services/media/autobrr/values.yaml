controllers:
  main:
    replicas: 1
    strategy: Recreate
    pod:
      # Keep the source numeric ownership; no kubelet fsGroup rewrite is needed.
      securityContext: {}
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    containers:
      main:
        image:
          repository: ghcr.io/autobrr/autobrr
          tag: v1.86.0@sha256:0b8b997c40424557a4bd688a4cb487dd8a765a69b5aa5b003c0d8106f6a895af
        env:
          AUTOBRR__HOST: "0.0.0.0"
          AUTOBRR__PORT: "7474"
          AUTOBRR__CHECK_FOR_UPDATES: "false"
          AUTOBRR__DATABASE_TYPE: "sqlite"
          # OIDC with Authentik
          AUTOBRR__OIDC_ENABLED: "true"
          AUTOBRR__OIDC_ISSUER: "https://auth.starktastic.net/application/o/autobrr/" # source: globals.yaml → global.domains.public
          AUTOBRR__OIDC_REDIRECT_URL: "https://autobrr.internal.starktastic.net/api/auth/oidc/callback" # source: globals.yaml → global.domains.internal
          AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN: "false"
        envFrom:
          - secretRef:
              name: autobrr-secret
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/healthz/liveness
            port: 7474
          readiness:
            enabled: true
            type: HTTP
            path: /api/healthz/readiness
            port: 7474
          startup:
            enabled: true
            type: HTTP
            path: /api/healthz/liveness
            port: 7474
            spec:
              failureThreshold: 30
              periodSeconds: 5
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - /config
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 7474

persistence:
  retained-startup:
    type: configMap
    name: autobrr-retained-startup-guard
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
  autobrr-config:
    existingClaim: autobrr-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /config
            readOnly: true
  config:
    enabled: false
