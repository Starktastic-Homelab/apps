controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/dgtlmoon/changedetection.io
          tag: 0.60.7@sha256:096dae27b5d677b89f0e810fff95a70403271aa3ff3b6437952d2db9be7e74c5
        env:
          PLAYWRIGHT_DRIVER_URL: "ws://localhost:3000"
          BASE_URL: "https://changedetection.internal.starktastic.net"
          USE_X_SETTINGS: "1"
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 5000
            path: /
          readiness:
            enabled: true
            type: HTTP
            port: 5000
            path: /
          startup:
            enabled: true
            type: TCP
            port: 5000
            spec:
              failureThreshold: 30
              periodSeconds: 5
      sockpuppetbrowser:
        image:
          repository: dgtlmoon/sockpuppetbrowser
          tag: latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
        env:
          SCREEN_WIDTH: "1920"
          SCREEN_HEIGHT: "1024"
          SCREEN_DEPTH: "16"
          MAX_CONCURRENT_CHROME_PROCESSES: "5"
        securityContext:
          capabilities:
            add:
              - SYS_ADMIN
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - changedetection
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 5000

persistence:
  config:
    enabled: false
  data:
    existingClaim: changedetection-data
    advancedMounts:
      main:
        main:
          - path: /datastore
    enabled: false
  retained-startup:
    type: configMap
    name: utility-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  retained-config:
    enabled: true
    existingClaim: changedetection-data-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /datastore
        retained-data:
          - path: /retained
            readOnly: true
