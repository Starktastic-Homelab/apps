  custom.css: |
    /* ==========================================================================
       "Liquid glass": the part both pages share. The generator prepends this file to each page's custom.css,
       which sets the --d1-* identity tokens used below.
       Hook rule (ADR 0020): Homepage's ids, its named classes, its data and ARIA attributes, tile ids, and
       elements under those. Selectors that need page structure live in the no-hook block at the end.
       ========================================================================== */

    /* ---------- Tokens: first paint (:root) and after hydration (html:root beats .theme-* and .dark) ---------- */
    :root,
    html:root {
      --bg-color: 15 15 26; /* brand navy #0F0F1A */
      --d1-ink: 244 246 255;
      --d1-good: 52 211 153;
      --d1-warn: 251 191 36;
      --d1-danger: 248 113 113;
      --d1-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      --d1-sheen: linear-gradient(180deg, rgb(255 255 255 / 0.1) 0%, rgb(255 255 255 / 0.035) 38%, rgb(255 255 255 / 0.02) 100%);
      --d1-depth: 0 1px 1px rgb(0 0 0 / 0.25), 0 22px 44px -22px rgb(0 0 0 / 0.75);
      /* Manrope weights inside widgets: font-thin/light text is unreadable on glass */
      --font-weight-thin: 500;
      --font-weight-light: 500;
    }

    html,
    body {
      background-color: rgb(15 15 26);
    }

    /* ---------- Backdrop: grain over the aurora (kills gradient banding) ---------- */
    #background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("/images/grain.svg");
      opacity: 0.07;
      mix-blend-mode: overlay;
    }

    /* ---------- Glass card ---------- */
    .service-card {
      --radius-sm: 11px; /* list rows, calendar events */
      --color-900: 96 110 168; /* in-card strips (bg-theme-900/20) turn into faint glass instead of black */
      color: rgb(var(--color-200));
      font-weight: 600;
      overflow-wrap: break-word; /* long tokens break only when they would overflow; never shrinks short words */
      padding: 7px;
      margin-bottom: var(--d1-gap, 14px);
      border-radius: var(--d1-radius);
      background: var(--d1-sheen), rgb(var(--d1-fill) / var(--d1-fill-a, 0.42));
      backdrop-filter: blur(var(--d1-blur, 22px)) saturate(var(--d1-sat, 165%));
      -webkit-backdrop-filter: blur(var(--d1-blur, 22px)) saturate(var(--d1-sat, 165%));
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        var(--d1-depth);
      transition:
        background-color 0.25s var(--d1-ease),
        box-shadow 0.25s var(--d1-ease);
    }

    /* breathing room between groups */
    #layout-groups > * {
      min-width: 0; /* a 50-character release name wraps inside its group instead of widening it past the screen */
      padding-bottom: var(--d1-group-gap, 16px);
    }

    /* 1 px light-catching rim: bright top edge fading down, a tint at the foot (the page accent unless --d1-rim is set) */
    .service-card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(
        168deg,
        rgb(255 255 255 / 0.5) 0%,
        rgb(255 255 255 / 0.12) 22%,
        rgb(255 255 255 / 0.05) 55%,
        rgb(var(--d1-rim, var(--d1-acc-hi)) / 0.28) 100%
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box exclude,
        linear-gradient(#000 0 0);
      pointer-events: none;
    }

    .service-card:hover {
      background: var(--d1-sheen), var(--d1-sheen), rgb(var(--d1-fill) / var(--d1-fill-a, 0.42));
    }

    .service-icon img {
      filter: drop-shadow(0 3px 8px rgb(0 0 0 / 0.45));
    }

    .service-description {
      color: rgb(var(--color-300));
      line-height: 1.4;
      margin-top: 1px;
    }

    .service-card a:focus-visible,
    #myTab [role="tab"]:focus-visible {
      outline: 2px solid rgb(var(--d1-acc-hi));
      outline-offset: 2px;
      border-radius: 12px;
    }

    /* ---------- Blocks: value / label chips ---------- */
    /* a block row wraps only when its values cannot fit (an IP address on a phone), instead of widening the card */
    .service-container {
      flex-wrap: wrap;
    }

    .service-block {
      margin: 3px;
      padding: 10px 4px 9px;
      border-radius: calc(var(--d1-radius) - 10px);
      background: rgb(255 255 255 / 0.05);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06);
    }

    .service-block-value {
      color: rgb(var(--d1-ink));
      font-size: var(--d1-value-size, 16px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .service-block-label {
      margin-top: 3px;
      font-family: Manrope, "Manrope-Fallback", Arial, sans-serif; /* plexData keeps numbers mono, labels stay sans */
      font-size-adjust: none;
      color: rgb(var(--color-300));
      opacity: 1;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* ---------- Group headers: small caps label with a light rule ---------- */
    .service-group-name,
    .bookmark-group-name {
      display: flex; /* bookmark group headings are not flex upstream */
      flex: 1 1 auto;
      align-items: center;
      text-align: left;
      gap: 12px;
      color: rgb(var(--d1-label, var(--d1-acc-hi)));
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      /* a 1px dark outline and a soft feather: the labels scroll across the arc of light and keep 4.5:1 on it */
      text-shadow:
        1px 0 #04070f,
        -1px 0 #04070f,
        0 1px #04070f,
        0 -1px #04070f,
        1px 1px #04070f,
        -1px 1px #04070f,
        1px -1px #04070f,
        -1px -1px #04070f,
        0 0 6px rgb(4 7 18 / 0.7);
    }

    .service-group-name::after,
    .bookmark-group-name::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: linear-gradient(90deg, rgb(var(--d1-acc-hi) / 0.45), rgb(var(--d1-acc-hi) / 0));
    }

    /* ---------- Tabs: a glass segmented control ---------- */
    #myTab {
      display: flex;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.5);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        var(--d1-depth);
    }

    #myTab [role="presentation"] {
      flex: 1 1 0;
      height: auto;
    }

    #myTab [role="tab"] {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      margin: 0;
      border-radius: 999px;
      color: rgb(var(--color-300));
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition:
        color 0.2s var(--d1-ease),
        background-color 0.2s var(--d1-ease),
        box-shadow 0.2s var(--d1-ease);
    }

    #myTab [role="tab"]:hover {
      color: rgb(var(--d1-ink));
      background: rgb(255 255 255 / 0.06);
    }

    #myTab [role="tab"][aria-selected="true"] {
      color: #fff;
      background:
        linear-gradient(180deg, rgb(255 255 255 / 0.22), rgb(255 255 255 / 0.05)),
        rgb(var(--d1-acc) / 0.5);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.4),
        inset 0 0 0 1px rgb(255 255 255 / 0.5), /* a light rim marks the selected tab at 3:1 or more */
        0 8px 22px -8px rgb(var(--d1-acc) / 0.9);
      text-shadow: 0 1px 2px rgb(0 0 0 / 0.35);
    }

    /* tab glyphs: a drawn mask per tab id (each page sets --d1-glyph), painted in the tab's text colour */
    #myTab [role="tab"]::before {
      content: "";
      width: 18px;
      height: 18px;
      flex: none;
      background: currentColor;
      -webkit-mask: var(--d1-glyph) center / contain no-repeat;
      mask: var(--d1-glyph) center / contain no-repeat;
    }

    /* ---------- Header widgets: glass chips ---------- */
    #information-widgets :is(.information-widget-logo, .information-widget-greeting, .information-widget-customapi, .information-widget-openmeteo, .information-widget-datetime) {
      color: rgb(var(--color-200));
    }

    .information-widget-customapi,
    .information-widget-openmeteo,
    .information-widget-datetime {
      margin: 0;
      border-radius: 18px;
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.45);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        var(--d1-depth);
    }

    .information-widget-customapi span {
      color: rgb(var(--color-300));
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .information-widget-greeting span {
      margin: 0;
      background: linear-gradient(100deg, #fff 0%, rgb(var(--d1-acc-hi)) 55%, rgb(var(--d1-acc-2)) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .information-widget-logo img {
      filter: drop-shadow(0 6px 16px rgb(var(--d1-acc) / 0.55));
    }

    /* search, desktop: an empty slot in the header, placed by each page. The quicklaunch button is laid over it as a
       search bar (no-hook block below). Narrower screens and browsers without anchor positioning get no slot and
       keep the disc. */
    @media (min-width: 1024px) {
      @supports (anchor-name: --hp-search) {
        #information-widgets::before {
          content: "";
          height: 48px;
          anchor-name: --hp-search;
        }
      }
    }

    /* ---------- Bookmarks: glass rows, 48 px tall ---------- */
    .bookmark > a {
      --radius-md: 14px;
      --color-900: 96 110 168; /* the abbreviation tile (bg-theme-900/50) becomes tinted glass */
      --text-xs: 0.8125rem;
      overflow: hidden;
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.42);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.14),
        inset 0 0 0 1px rgb(255 255 255 / 0.07),
        var(--d1-depth);
    }

    .bookmark-icon,
    .bookmark-text {
      min-height: 48px;
    }

    .bookmark > a:hover {
      background: var(--d1-sheen), var(--d1-sheen), rgb(var(--d1-fill) / 0.42);
    }

    /* ---------- Footer: the refresh control as a 44 px glass button ---------- */
    #footer svg {
      box-sizing: content-box;
      padding: 10px;
      border-radius: 999px;
      color: rgb(var(--color-300));
      background: rgb(var(--d1-fill) / 0.45);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
    }

    /* ---------- Motion: nothing moves when motion is unwelcome ---------- */
    @media (prefers-reduced-motion: reduce) {
      #layout-groups *,
      #information-widgets *,
      #myTab * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* no-hook:start */
    /* Homepage v2.7.0 has no class, id or attribute for what these rules style. If an upgrade changes the markup
       they stop matching, the damage is cosmetic, and the render check fails on them. */

    /* group panels stop clipping card shadows and glows (safe: both pages set disableCollapse, so no height animation) */
    .services-group div:has(> ul > li) {
      overflow: visible;
    }

    /* header chip: the value under its label */
    .information-widget-customapi span + span {
      color: rgb(var(--d1-ink));
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    /* calendar agenda: a title fills its row up to the done mark and ends in an ellipsis (upstream clips it at 70 %) */
    #calendar .service-card span + div {
      flex: 1 1 0;
      min-width: 0;
      width: 0 !important; /* overrides the inline width: 70%; zero basis + grow, so long titles never widen the card */
      padding-right: 6px;
    }

    #calendar .service-card span + div > div {
      position: static;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* the one search: the quicklaunch button (the element right before #information-widgets, which Homepage shows
       on phones only). It finds apps first, then the web. Below 1024 px: a glass disc in the corner. */
    #inner_wrapper button:has(+ #information-widgets) {
      right: 14px;
      bottom: 16px;
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      cursor: pointer;
      color: rgb(var(--d1-ink));
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.72);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.2),
        inset 0 0 0 1px rgb(255 255 255 / 0.1),
        var(--d1-depth);
    }

    #inner_wrapper button:has(+ #information-widgets):focus-visible {
      outline: 2px solid rgb(var(--d1-acc-hi));
      outline-offset: 2px;
    }

    #inner_wrapper button:has(+ #information-widgets) svg {
      width: 22px;
      height: 22px;
    }

    /* desktop: the same button laid over the header slot, as a search bar that opens the same search */
    @media (min-width: 1024px) {
      @supports (anchor-name: --hp-search) {
        #inner_wrapper button:has(+ #information-widgets) {
          position: absolute; /* in the page container, so it scrolls away with the header */
          position-anchor: --hp-search;
          inset: anchor(top) anchor(right) anchor(bottom) anchor(left);
          display: flex;
          align-items: center;
          gap: 12px;
          width: auto;
          height: auto;
          padding: 0 17px;
          border-radius: 999px;
          color: rgb(var(--color-300));
          background: var(--d1-sheen), rgb(var(--d1-fill) / 0.5);
          backdrop-filter: blur(20px) saturate(170%);
          -webkit-backdrop-filter: blur(20px) saturate(170%);
          box-shadow:
            inset 0 1px 0 0 rgb(255 255 255 / 0.16),
            inset 0 0 0 1px rgb(255 255 255 / 0.1),
            var(--d1-depth);
          font-size: 15px;
        }

        #inner_wrapper button:has(+ #information-widgets)::after {
          content: "Search apps and the web"; /* also the button's accessible name */
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        #inner_wrapper button:has(+ #information-widgets) svg {
          flex: none;
          width: 18px;
          height: 18px;
        }
      }
    }

    /* List rows (a name and one value) have no class of their own. A gutter between the name and its value; the
       value stays on one line and the name wraps. :not() skips the wrappers that hold rows. */
    .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child) {
      column-gap: 12px;
    }

    .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child):not(:has(div div div)) > div:first-child {
      min-width: 0;
    }

    .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child):not(:has(div div div)) > div:last-child {
      flex: none;
      white-space: nowrap;
    }
    /* no-hook:end */
    /* ==========================================================================
       Household layer: brand blue on navy, phone-first ("premium app home screen").
       No alarm rules here: the household page has no alarm mode (ADR 0020).
       ========================================================================== */
    :root,
    html:root {
      --color-50: 248 250 255;
      --color-100: 232 238 252;
      --color-200: 226 233 250;
      --color-300: 192 208 242; /* secondary text and block labels: 4.5:1 over the brightest glass */
      --color-400: 125 148 200;
      --color-500: 88 108 160;
      --color-600: 58 74 122;
      --color-700: 34 44 84;
      --color-800: 15 15 26;
      --color-900: 8 9 20;
      --color-logo-start: 191 219 254;
      --color-logo-stop: 59 130 246;
      --d1-acc: 59 130 246; /* brand blue #3B82F6 */
      --d1-acc-hi: 147 197 253;
      --d1-acc-2: 103 232 249;
      --d1-fill: 13 18 42;
      --d1-radius: 24px;
      --d1-label: 210 228 255; /* group labels sit straight on the aurora: an ice blue that keeps 4.5:1 over its glow */
    }

    /* the animated aurora only when motion is welcome and the screen is wide; phones keep the still one */
    @media (prefers-reduced-motion: no-preference) and (min-width: 1024px) {
      #background {
        background-image: url("/images/aurora-live.svg") !important;
      }
    }

    #Watch-tab { --d1-glyph: url("/images/glyph-watch.svg"); }
    #Library-tab { --d1-glyph: url("/images/glyph-library.svg"); }
    #Tools-tab { --d1-glyph: url("/images/glyph-tools.svg"); }

    /* ---------- Header: brand row, date + weather, search ---------- */
    #widgets-wrap,
    #information-widgets-right {
      display: contents;
    }

    #information-widgets {
      display: grid;
      grid-template-columns: 40px auto minmax(0, 1fr) auto; /* the wordmark spans two tracks, so the weather pill never squeezes it */
      grid-template-areas:
        "logo brand brand status"
        "date date date date"
        "weather weather weather weather"; /* phone: no search bar, the glass disc in the corner is the search */
      align-items: center;
      gap: 16px 10px;
      margin: 20px 16px 0;
    }

    .information-widget-logo { grid-area: logo; }
    .information-widget-greeting { grid-area: brand; }
    .information-widget-customapi { grid-area: status; }
    .information-widget-datetime { grid-area: date; }
    .information-widget-openmeteo { grid-area: weather; }

    .information-widget-logo,
    .information-widget-greeting,
    .information-widget-datetime {
      margin: 0;
      padding: 0;
      background: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .information-widget-logo img {
      width: 40px !important; /* Next/Image sets 48 px inline */
      height: 40px !important;
    }

    .information-widget-logo div {
      margin: 0;
    }

    .information-widget-greeting span {
      font-size: 24px;
      line-height: 1.1;
    }

    .information-widget-customapi {
      padding: 7px 14px 7px 10px;
      border-radius: 999px;
    }

    .information-widget-openmeteo {
      height: 48px;
      padding: 0 16px 0 8px;
      border-radius: 999px;
    }

    .information-widget-openmeteo svg {
      width: 32px;
      height: 32px;
    }

    .information-widget-datetime div {
      justify-content: flex-start;
    }

    .information-widget-datetime span {
      color: rgb(var(--d1-ink));
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -0.015em;
      white-space: nowrap;
      text-shadow: 0 2px 18px rgb(0 0 0 / 0.45);
    }

    /* ---------- Cards ---------- */
    .service-card {
      --text-sm: 0.9375rem;
      --text-xs: 0.8125rem;
    }

    /* app-sized icons: 40 px (Next/Image and the mdi mask both size themselves inline) */
    .service-icon > :is(img, div) {
      width: 40px !important;
      height: 40px !important;
    }

    /* Watch hero: the Jellyfin card glows blue */
    #jellyfin > .service-card {
      --d1-fill: 20 32 82;
      --d1-fill-a: 0.5;
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.2),
        0 30px 70px -34px rgb(var(--d1-acc) / 0.85),
        var(--d1-depth);
    }

    /* the heart beside "Support the server" (seen only without the header pill, below): sized to the small-caps
       label, not Homepage's 28 px */
    .bookmark-group-icon {
      width: 18px;
      height: 18px;
    }

    /* Support links: a little of the Jellyfin card's glow, so the two are noticed without shouting */
    #bm-buy-me-a-coffee > a,
    #bm-paybox > a {
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        inset 0 0 0 1px rgb(var(--d1-acc-hi) / 0.3),
        0 18px 40px -26px rgb(var(--d1-acc) / 0.9),
        var(--d1-depth);
    }

    /* ---------- Phone: floating glass tab bar at the thumb, 2-up launcher tiles ---------- */
    @media (max-width: 639px) {
      .information-widget-openmeteo {
        justify-self: start;
      }

      #tabs {
        position: fixed;
        z-index: 30;
        left: 14px;
        right: 86px; /* the 60 px glass search disc sits to the right of the bar */
        bottom: 16px;
        margin: 0;
      }

      /* scroll-edge scrim behind the bar and the disc, so rows never show through the gap between them
         (on #tabs, not #inner_wrapper: the page container is a stacking context and would paint over the bar) */
      #tabs::before {
        content: "";
        position: fixed;
        z-index: -1;
        left: 0;
        right: 0;
        bottom: 0;
        height: 112px;
        pointer-events: none;
        background: linear-gradient(to top, rgb(var(--d1-fill) / 0.92) 45%, rgb(var(--d1-fill) / 0));
      }

      #myTab {
        padding: 4px;
        background: var(--d1-sheen), rgb(var(--d1-fill) / 0.72); /* denser glass: labels stay legible over scrolling cards */
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
      }

      #myTab [role="tab"] {
        flex-direction: column;
        gap: 3px;
        min-height: 52px;
        font-size: 11px;
        letter-spacing: 0.02em;
      }

      #myTab [role="tab"]::before {
        width: 20px;
        height: 20px;
      }

      #layout-groups {
        margin: 22px 12px 0;
      }

      #footer {
        padding-bottom: 104px; /* clear the floating bar */
      }

      /* Tools: launcher tiles two to a row, icon over name */
      #inner_wrapper:has(#Tools-tab[aria-selected="true"]) #layout-groups ul:has(> .service) {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 12px;
      }

      #inner_wrapper:has(#Tools-tab[aria-selected="true"]) #layout-groups .service {
        display: flex;
        flex-direction: column;
      }

      #inner_wrapper:has(#Tools-tab[aria-selected="true"]) #layout-groups .service > .service-card {
        flex: 1 1 auto;
      }

      #inner_wrapper:has(#Tools-tab[aria-selected="true"]) #layout-groups .service-title {
        flex-direction: column;
        align-items: flex-start;
        padding: 8px 2px 2px;
      }

      #inner_wrapper:has(#Tools-tab[aria-selected="true"]) #layout-groups .service-icon {
        min-height: 44px; /* the tile's icon link */
      }

      #calendar > .service-card {
        --spacing: 0.3rem; /* agenda rows (h-5) grow from 20 to 24 px */
      }
    }

    /* ---------- Laptop and up: Watch as two columns ---------- */
    @media (min-width: 1024px) {
      #inner_wrapper:has(#Watch-tab[aria-selected="true"]) #layout-groups {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        align-items: start;
        column-gap: 20px;
      }

      /* what is coming takes the right column, beside Watch and Requests */
      #inner_wrapper:has(#Watch-tab[aria-selected="true"]) #layout-groups > .services-group:has(#calendar) {
        grid-column: 2;
        grid-row: 1 / span 2;
      }
    }

    /* ---------- Wider screens: header on one line, tabs centred on top ---------- */
    @media (min-width: 640px) {
      #information-widgets {
        grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
        grid-template-areas: "logo brand . status weather date";
        gap: 12px;
        margin: 28px 36px 0;
      }

      .information-widget-datetime span {
        font-size: 18px;
      }

      #tabs {
        max-width: 560px;
        margin: 26px auto 0;
        width: calc(100% - 72px);
      }
    }

    /* the search bar's slot, between the wordmark and the Internet chip (the header needs about 960 px with it) */
    @media (min-width: 1024px) {
      @supports (anchor-name: --hp-search) {
        #information-widgets {
          grid-template-columns: auto auto minmax(0, 1fr) minmax(240px, 420px) auto auto auto;
          grid-template-areas: "logo brand . search status weather date";
        }

        #information-widgets::before {
          grid-area: search;
        }
      }
    }

    /* ---------- Support links: a pill in the header, on every tab ---------- */
    /* The pill is an empty slot; the two links of the page-level "Support the server" group are laid over its right
       end. A browser without anchor positioning gets no pill and shows that group under every tab instead. */
    @supports (anchor-name: --hp-support) {
      #information-widgets::after {
        content: "Donate";
        grid-area: support;
        justify-self: end;
        display: flex;
        align-items: center;
        height: 48px;
        padding: 0 100px 0 16px; /* the two 44 px links sit in the right 94 px */
        border-radius: 999px;
        color: rgb(var(--color-300));
        background: var(--d1-sheen), rgb(var(--d1-fill) / 0.5);
        backdrop-filter: blur(20px) saturate(170%);
        -webkit-backdrop-filter: blur(20px) saturate(170%);
        box-shadow:
          inset 0 1px 0 0 rgb(255 255 255 / 0.16),
          inset 0 0 0 1px rgb(255 255 255 / 0.1),
          var(--d1-depth);
        font-size: 15px;
        anchor-name: --hp-support;
      }

      /* no room for the word on a small phone, or in the one-line header below 1280 px */
      @media (max-width: 387px), (min-width: 1024px) and (max-width: 1279px) {
        #information-widgets::after {
          content: "";
          padding: 0 94px 0 2px;
        }
      }

      #bm-buy-me-a-coffee,
      #bm-paybox {
        position: absolute; /* in the page container, like the search bar */
        z-index: 21; /* Homepage stacks the header at 20 */
        position-anchor: --hp-support;
        top: anchor(top);
        bottom: anchor(bottom);
        right: calc(anchor(right) + 2px);
        display: grid;
        place-items: center;
        width: 44px;
      }

      #bm-buy-me-a-coffee {
        right: calc(anchor(right) + 50px);
      }

      #bm-buy-me-a-coffee > a,
      #bm-paybox > a {
        width: 44px;
        height: 44px;
        margin: 0;
        border-radius: 999px;
      }

      #bm-buy-me-a-coffee > a:focus-visible,
      #bm-paybox > a:focus-visible {
        outline: 2px solid rgb(var(--d1-acc-hi));
        outline-offset: 2px;
      }

      #bm-buy-me-a-coffee .bookmark-icon,
      #bm-paybox .bookmark-icon {
        width: 44px;
        min-height: 44px;
        background: none;
      }

      /* the link keeps its name as a tooltip and for screen readers (Homepage sets it as the title) */
      #bm-buy-me-a-coffee .bookmark-text,
      #bm-paybox .bookmark-text {
        display: none;
      }

      /* phone: beside the weather, which gives way if a long forecast would push the pill off the screen */
      @media (max-width: 639px) {
        #information-widgets {
          grid-template-areas:
            "logo brand brand status"
            "date date date date"
            "weather weather support support";
        }

        /* "Ramat Gan, 14.2°C" needs 178 px at this padding and icon size, which fits from 388 px up; below that
           the pill drops its word. A longer line is cut at the edge, never wrapped onto a third line. */
        .information-widget-openmeteo {
          max-width: calc(100vw - 210px); /* page margins 32, gap 10, pill 168 */
          padding: 0 12px 0 6px;
          overflow: hidden;
          white-space: nowrap;
        }

        .information-widget-openmeteo svg {
          width: 28px;
          height: 28px;
        }
      }

      @media (max-width: 387px) {
        .information-widget-openmeteo {
          max-width: calc(100vw - 138px);
        }
      }

      /* 640 to 1023 px: one line has no room for the pill, so it shares a second line with the weather, as on a phone */
      @media (min-width: 640px) and (max-width: 1023px) {
        #information-widgets {
          grid-template-columns: auto auto minmax(0, 1fr) auto auto;
          grid-template-areas:
            "logo brand . status date"
            "weather weather . support support";
        }

        .information-widget-openmeteo {
          justify-self: start;
        }
      }

      /* 1024 to 1279 px: the search bar gives up the width (its label shortens in the no-hook block); max-content
         keeps the grid from taking it out of the logo and the weather instead */
      @media (min-width: 1024px) and (max-width: 1279px) {
        #information-widgets {
          grid-template-columns:
            max-content max-content minmax(0, 1fr) minmax(170px, 420px) max-content max-content max-content max-content;
          grid-template-areas: "logo brand . search status weather date support";
        }
      }

      @media (min-width: 1280px) {
        #information-widgets {
          grid-template-columns: auto auto minmax(0, 1fr) minmax(240px, 420px) auto auto auto auto;
          grid-template-areas: "logo brand . search status weather date support";
        }
      }
    }

    /* no-hook:start */
    @media (max-width: 639px) {
      #inner_wrapper button:has(+ #information-widgets) {
        z-index: 31; /* the search disc sits above the tab bar's scrim */
      }

      /* lists (the two Jellyfin tiles) become a grouped list: 44 px rows split by hairlines, the whole row is the target */
      .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child) {
        min-height: 44px;
        margin: 0 4px;
        padding: 0 2px;
        border-radius: 0;
        background: none;
        box-shadow: inset 0 -1px 0 rgb(255 255 255 / 0.08);
      }

      .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child):last-child {
        box-shadow: none;
      }

      .service-card a:has(> div:first-child + div:last-child > div:only-child):active {
        background: rgb(255 255 255 / 0.07);
      }
    }

    /* with the links in the header, their group leaves no box, heading or margin under the tabs */
    @supports (anchor-name: --hp-support) {
      #layout-groups > div:has(#bm-paybox) {
        display: contents;
      }

      #layout-groups button:has(+ div #bm-paybox) {
        display: none;
      }

      #layout-groups ul:has(> #bm-paybox) {
        margin: 0;
      }

      @media (min-width: 1024px) and (max-width: 1279px) {
        #inner_wrapper button:has(+ #information-widgets)::after {
          content: "Search"; /* the bar is about 180 px wide here */
        }
      }
    }
    /* no-hook:end */
  kubernetes.yaml: |
    mode: disabled
  settings.yaml: |
    title: Starktastic
    description: Watch, listen, read and the household tools
    language: en
    theme: dark
    color: slate
    hideVersion: true
    disableIndexing: true
    favicon: /images/icon-192.png
    background: /images/aurora-still.svg
    cardBlur: xl
    headerStyle: boxedWidgets
    cardStyle: hairline
    blockStyle: refined
    statusStyle: dot
    disableCollapse: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      showSearchSuggestions: false
      provider: custom
      name: Web
      url: https://search.starktastic.net/search?q=
      mobileButtonPosition: bottom-right
    hideErrors: true
    pwa:
      icons:
      - src: /images/icon-192.png
        sizes: 192x192
        type: image/png
        purpose: any maskable
      shortcuts:
      - name: Watch
        url: /#watch
      - name: Library
        url: /#library
      - name: Tools
        url: /#tools
    layout:
      Watch:
        tab: Watch
      Coming Up:
        tab: Watch
      Requests:
        tab: Watch
        style: row
        columns: 2
      Listen:
        tab: Library
        style: row
        columns: 3
      Read:
        tab: Library
        style: row
        columns: 2
      Photos:
        tab: Library
        style: row
        columns: 2
      Create:
        tab: Tools
        style: row
        columns: 2
      Convert:
        tab: Tools
        style: row
        columns: 4
      Find & Keep:
        tab: Tools
        style: row
        columns: 3
      Send:
        tab: Tools
        style: row
        columns: 3
      Links:
        tab: Tools
        style: row
        columns: 2
      Support the server:
        style: row
        columns: 2
        icon: mdi-heart-outline
  widgets.yaml: |
    - logo:
        icon: /icons/favicon.svg
    - greeting:
        text_size: 2xl
        text: Starktastic
    - customapi:
        url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query?query=min(probe_success%7Btier%3D%22external%22%7D)
        icon: mdi-earth
        refreshInterval: 60000
        mappings:
        - field: data.result.0.value.1
          label: Internet
          remap:
          - value: '1'
            to: Online
          - value: '0'
            to: Down ⚠
          - any: true
            to: Unknown
    - openmeteo:
        label: Ramat Gan
        latitude: 32.08
        longitude: 34.83
        timezone: Asia/Jerusalem
        units: metric
    - datetime:
        text_size: xl
        locale: en-GB
        format:
          weekday: short
          day: numeric
          month: short
          hour: 2-digit
          minute: 2-digit
          hourCycle: h23
  services.yaml: |
    - Watch:
      - Jellyfin:
          id: jellyfin
          icon: jellyfin.png
          description: Movies, TV & anime
          href: https://benplus.app
          siteMonitor: http://jellyfin-main.media:8096
          widget:
            type: customapi
            url: http://jellyfin-main.media:8096/Items/Counts
            headers:
              Authorization: MediaBrowser Token="{{ "{{" }}HOMEPAGE_VAR_JELLYFIN_HOUSEHOLD_TOKEN{{ "}}" }}"
            refreshInterval: 3600000
            mappings:
            - field: MovieCount
              label: Movies
              format: number
            - field: SeriesCount
              label: Series
              format: number
            - field: EpisodeCount
              label: Episodes
              format: number
      - New movies:
          id: new-movies
          icon: mdi-movie-open
          description: Latest additions
          widget:
            type: customapi
            url: http://jellyfin-main.media:8096/Items/Latest?IncludeItemTypes=Movie&Limit=6&Fields=DateCreated
            headers:
              Authorization: MediaBrowser Token="{{ "{{" }}HOMEPAGE_VAR_JELLYFIN_HOUSEHOLD_TOKEN{{ "}}" }}"
            refreshInterval: 900000
            display: dynamic-list
            mappings:
              name: Name
              label: DateCreated
              format: relativeDate
              limit: 6
              target: https://benplus.app/web/#/details?id={Id}&serverId={ServerId}
      - New episodes:
          id: new-episodes
          icon: mdi-television-play
          description: Latest additions
          widget:
            type: customapi
            url: http://jellyfin-main.media:8096/Items?IncludeItemTypes=Series&Recursive=true&SortBy=DateLastContentAdded&SortOrder=Descending&Limit=6&Fields=DateLastMediaAdded
            headers:
              Authorization: MediaBrowser Token="{{ "{{" }}HOMEPAGE_VAR_JELLYFIN_HOUSEHOLD_TOKEN{{ "}}" }}"
            refreshInterval: 900000
            display: dynamic-list
            mappings:
              items: Items
              name: Name
              label: DateLastMediaAdded
              format: relativeDate
              limit: 6
              target: https://benplus.app/web/#/details?id={Id}&serverId={ServerId}
    - Coming Up:
      - Calendar:
          id: calendar
          icon: mdi-calendar-star
          description: New episodes and movie releases
          widget:
            type: calendar
            view: agenda
            maxEvents: 12
            previousDays: 0
            showTime: true
            integrations:
            - type: ical
              url: http://sonarr.media:8989/feed/v3/calendar/Sonarr.ics?apikey={{ "{{" }}HOMEPAGE_VAR_SONARR_KEY{{ "}}" }}&pastDays=30&futureDays=14
              name: TV
              color: blue
              params:
                showName: true
            - type: ical
              url: http://radarr.media:7878/feed/v3/calendar/Radarr.ics?apikey={{ "{{" }}HOMEPAGE_VAR_RADARR_KEY{{ "}}" }}&releaseTypes=digitalRelease&pastDays=60&futureDays=90
              name: Movies
              color: fuchsia
              params:
                showName: true
    - Requests:
      - Seerr:
          id: seerr
          icon: overseerr.png
          description: Request movies & TV
          href: https://request.benplus.app
          siteMonitor: http://seerr.media:5055
      - Seerr RU:
          id: seerr-ru
          icon: overseerr.png
          description: Request movies & TV (RU)
          href: https://request-ru.benplus.app
          siteMonitor: http://seerr-ru.media:5055
    - Listen:
      - Navidrome:
          id: navidrome
          icon: navidrome.png
          href: https://music.benplus.app
          description: Music streaming
          siteMonitor: http://navidrome.media:4533
      - Audiobookshelf:
          id: audiobookshelf
          icon: audiobookshelf.png
          description: Audiobooks & podcasts
          href: https://audiobooks.benplus.app
          siteMonitor: http://audiobookshelf.media:80
          widget:
            type: audiobookshelf
            url: http://audiobookshelf.media:80
            key: '{{ "{{" }}HOMEPAGE_VAR_AUDIOBOOKSHELF_HOUSEHOLD_KEY{{ "}}" }}'
      - New albums:
          id: new-albums
          icon: mdi-album
          description: Latest additions
          widget:
            type: customapi
            url: http://navidrome.media:4533/rest/getAlbumList2?type=newest&size=6&f=json&v=1.16.1&c=homepage&u={{ "{{" }}HOMEPAGE_VAR_NAVIDROME_HOUSEHOLD_USER{{ "}}" }}&t={{ "{{" }}HOMEPAGE_VAR_NAVIDROME_HOUSEHOLD_TOKEN{{ "}}" }}&s={{ "{{" }}HOMEPAGE_VAR_NAVIDROME_HOUSEHOLD_SALT{{ "}}" }}
            refreshInterval: 900000
            display: dynamic-list
            mappings:
              items: subsonic-response.albumList2.album
              name: name
              label: artist
              limit: 6
              target: https://music.benplus.app/app/#/album/{id}/show
    - Read:
      - Calibre-Web:
          id: calibre-web
          icon: calibre-web.png
          description: E-book library
          href: https://books.benplus.app
          siteMonitor: http://calibre-web.media:8083/opds
          widget:
            type: calibreweb
            url: http://calibre-web.media:8083
            username: '{{ "{{" }}HOMEPAGE_VAR_CALIBRE_HOUSEHOLD_USER{{ "}}" }}'
            password: '{{ "{{" }}HOMEPAGE_VAR_CALIBRE_HOUSEHOLD_PASS{{ "}}" }}'
      - Shelfmark:
          id: shelfmark
          icon: mdi-bookshelf
          description: Request books
          href: https://request-books.benplus.app
          siteMonitor: http://shelfmark.media:8084
    - Photos:
      - Immich:
          id: immich
          icon: immich.png
          description: Photos & videos
          href: https://photos.benplus.app
          siteMonitor: http://immich-main.media:2283
          widget:
            type: customapi
            url: http://immich-main.media:2283/api/server/storage
            headers:
              x-api-key: '{{ "{{" }}HOMEPAGE_VAR_IMMICH_HOUSEHOLD_KEY{{ "}}" }}'
            refreshInterval: 900000
            mappings:
            - field: diskUse
              label: Used
            - field: diskAvailable
              label: Free
            - field: diskUsagePercentage
              label: Full
              format: percent
    - Create:
      - Excalidash:
          id: excalidash
          icon: excalidraw.png
          description: Whiteboard & diagrams
          href: https://excalidash.starktastic.net
          siteMonitor: http://excalidash.operations:80
      - MicroBin:
          id: microbin
          icon: microbin.png
          href: https://microbin.starktastic.net
          description: Paste & share text
          siteMonitor: http://microbin.operations:8080
    - Convert:
      - ConvertX:
          id: convertx
          icon: convertx.png
          description: File format converter
          href: https://convertx.starktastic.net
          siteMonitor: http://convertx.operations:3000/healthcheck
      - Stirling PDF:
          id: stirling-pdf
          icon: stirling-pdf.png
          description: PDF toolbox
          href: https://pdf.starktastic.net
          siteMonitor: http://stirling-pdf.operations:8080
      - MeTube:
          id: metube
          icon: metube.png
          description: Download video & audio
          href: https://metube.benplus.app
          siteMonitor: http://metube.media:8081
      - CyberChef:
          id: cyberchef
          icon: cyberchef.png
          description: Encode, decode, analyse
          href: https://cyberchef.starktastic.net
          siteMonitor: http://cyberchef.operations:8000
    - Find & Keep:
      - SearXNG:
          id: searxng
          icon: searxng.png
          description: Private metasearch
          href: https://search.starktastic.net
          siteMonitor: http://searxng.operations:8080
      - Karakeep:
          id: karakeep
          icon: karakeep.png
          description: Bookmarks & read-later
          href: https://karakeep.starktastic.net
          siteMonitor: http://karakeep.operations:3000
      - Mealie:
          id: mealie
          icon: mealie.png
          description: Recipes & shopping lists
          href: https://mealie.starktastic.net
          siteMonitor: http://mealie.operations:9000
          widgets:
          - type: customapi
            url: http://mealie.operations:9000/api/recipes?perPage=0
            headers:
              Authorization: Bearer {{ "{{" }}HOMEPAGE_VAR_MEALIE_HOUSEHOLD_KEY{{ "}}" }}
            refreshInterval: 3600000
            mappings:
            - field: total
              label: Recipes
              format: number
          - type: customapi
            url: http://mealie.operations:9000/api/households/statistics
            headers:
              Authorization: Bearer {{ "{{" }}HOMEPAGE_VAR_MEALIE_HOUSEHOLD_KEY{{ "}}" }}
            refreshInterval: 3600000
            mappings:
            - field: totalCategories
              label: Categories
              format: number
            - field: totalTags
              label: Tags
              format: number
    - Send:
      - PairDrop:
          id: pairdrop
          icon: pairdrop.png
          description: Device-to-device transfer
          href: https://pairdrop.starktastic.net
          siteMonitor: http://pairdrop.operations:3000
      - ntfy:
          id: ntfy
          icon: ntfy.png
          description: Push notifications
          href: https://ntfy.starktastic.net
          siteMonitor: http://ntfy.operations:80
      - Listmonk:
          id: listmonk
          icon: listmonk.png
          description: Newsletters & mailing lists
          href: https://listmonk.starktastic.net
          siteMonitor: http://listmonk.operations:9000
