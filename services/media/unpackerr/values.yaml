controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/unpackerr/unpackerr
          tag: v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
        env:
          UN_INTERVAL: "2m"
          UN_START_DELAY: "1m"
          UN_WEBSERVER_METRICS: "true"
          UN_WEBSERVER_LISTEN_ADDR: "0.0.0.0:5656"
          # v1 serves an admin UI and requires an API key for /metrics. The UI password and the
          # metrics key come from unpackerr-webserver; this role can only read metrics.
          UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: "system:metrics:read"
          UN_WEBSERVER_API_KEYS_0_NAME: "prometheus"
          UN_WEBSERVER_API_KEYS_0_ROLES_0: "metrics"

          UN_RADARR_0_URL: "http://radarr.media:7878"
          UN_RADARR_0_PATHS_0: "/data/torrents"
          UN_RADARR_0_PROTOCOLS: "torrent"

          UN_RADARR_1_URL: "http://radarr-ru.media:7878"
          UN_RADARR_1_PATHS_0: "/data/torrents"
          UN_RADARR_1_PROTOCOLS: "torrent"

          UN_SONARR_0_URL: "http://sonarr.media:8989"
          UN_SONARR_0_PATHS_0: "/data/torrents"
          UN_SONARR_0_PROTOCOLS: "torrent"

          UN_SONARR_1_URL: "http://sonarr-ru.media:8989"
          UN_SONARR_1_PATHS_0: "/data/torrents"
          UN_SONARR_1_PROTOCOLS: "torrent"
        envFrom:
          - secretRef:
              name: unpackerr-secret
          # Required on purpose: without it v1 would log a generated admin password.
          - secretRef:
              name: unpackerr-webserver
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 5656
          readiness:
            enabled: true
            type: TCP
            port: 5656
          startup:
            enabled: true
            type: TCP
            port: 5656
            spec:
              failureThreshold: 30
              periodSeconds: 5

service:
  main:
    controller: main
    ports:
      metrics:
        port: 5656

persistence:
  config:
    enabled: false
  media:
    enabled: true
