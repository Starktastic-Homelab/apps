apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-internal-gate
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # The admin-only gate for *.internal (ADR 0014). No ?app=: the outpost picks its provider from the host.
  forwardAuth:
    address: http://ak-outpost-internal-gate.authentik:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    maxResponseBodySize: 4194304
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
