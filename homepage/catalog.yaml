    description: Zigbee device bridge
  # ---- Platform extras (spec §8 step 2) -----------------------------------------------------------------------
  # Metrics the proof rule held back until they were seen live. Each query below names its proof: the read-only
  # probe of 2026-11-14 ("platform-metrics-probe"), which listed the metric names, the scrape jobs and sample
  # label sets. Its label values are samples, so the queries sum and match a label only where the value was seen.
  # No alert rule in Git covers these families, so nothing here is highlighted.
  # A "24h" count takes the Security tile's form: per pod, the counter or 0 while it has no series yet,
  # increased over a subquery. A plain increase() loses the first event of a series that did not exist before.
  # Grafana: everything derives except app (the pod label is grafana).
  grafana:
    name: Grafana
    source: services/operations/kube-prometheus-stack
    monitorPath: /api/health
    icon: grafana.png
    description: Dashboards & alerting
    app: grafana
    widgets:
      # Grafana's own counters from Prometheus. They replace the native widget, which needed a Grafana Server
      # Admin login; firing alerts are on Pulse (Alerts), read from Alertmanager. No alert-rule count:
      # grafana_stat_totals_alert_rules counts rules made in Grafana, and the rules here are Prometheus'.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          # Proof: grafana_stat_* (proven live 2026-11-14, platform-metrics-probe).
          - label: Dashboards
            query: max(grafana_stat_totals_dashboard)
          - label: Data Sources
            query: max(grafana_stat_totals_datasource)
          - label: Active Users
            query: max(grafana_stat_active_users)
  # The link opens Grafana Explore and the monitor hits Prometheus directly, so both stay explicit.
  prometheus:
    name: Prometheus
    source: services/operations/kube-prometheus-stack
    icon: prometheus.png
    href: https://grafana.internal.starktastic.net/explore
    description: Metrics store
    siteMonitor: http://kube-prometheus-stack-prometheus.monitoring:9090/-/healthy
    app: prometheus
    widgets:
      - type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
      # Prometheus about itself, job kube-prometheus-stack-prometheus (proven live 2026-11-14,
      # platform-metrics-probe, third batch). Config OK reads 100% when the last config reload worked. No rule in
      # Git's own rule files reads these, so no highlight.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          - label: Config OK
            query: min(prometheus_config_last_reload_successful{job="kube-prometheus-stack-prometheus"})
            format:
              type: percent
              scale: 100
              options:
                maximumFractionDigits: 0
          - label: Series
            query: max(prometheus_tsdb_head_series{job="kube-prometheus-stack-prometheus"})
            format: &whole
              type: number
              options:
                maximumFractionDigits: 0
          - label: Rule Fails 24h
            query: sum(increase(prometheus_rule_evaluation_failures_total{job="kube-prometheus-stack-prometheus"}[24h]))
            format: *whole
          - label: Dropped Alerts 24h
            query: sum(increase(prometheus_notifications_dropped_total{job="kube-prometheus-stack-prometheus"}[24h]))
            format: *whole
  # Logs and traces by their own metrics; Loki itself is out of Homepage's reach (NetworkPolicy).
  telemetry:
    name: Telemetry
    icon: mdi-chart-timeline-variant
    href: https://grafana.internal.starktastic.net/explore
    description: Loki, Alloy and Tempo · losses over 24 h
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          # Proof: loki_distributor_lines_received_total (proven live 2026-11-14, platform-metrics-probe).
          - label: Log Lines/s
            query: sum(rate(loki_distributor_lines_received_total[5m]))
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: loki_discarded_samples_total, loki_build_info (proven live 2026-11-14, platform-metrics-probe).
          - label: Logs Discarded
            query:
              floor(sum(increase((sum by (pod) (loki_discarded_samples_total) or 0 * sum by (pod)
              (loki_build_info))[24h:5m]))) and count(loki_build_info)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: loki_write_dropped_entries_total, sent by Alloy; alloy_build_info (proven live 2026-11-14, platform-metrics-probe).
          - label: Logs Dropped
            query:
              floor(sum(increase((sum by (pod) (loki_write_dropped_entries_total) or 0 * sum by (pod)
              (alloy_build_info))[24h:5m]))) and count(alloy_build_info)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: alloy_component_controller_running_components by health_type (proven live 2026-11-14, platform-metrics-probe); the two values are the research's.
          - label: Alloy Unhealthy
            query:
              (sum(alloy_component_controller_running_components{health_type=~"unhealthy|exited"}) or vector(0)) and
              count(alloy_build_info)
            format:
              type: number
              options:
                maximumFractionDigits: 0
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          # Proof: tempo_distributor_spans_received_total (proven live 2026-11-14, platform-metrics-probe).
          - label: Spans/s
            query: sum(rate(tempo_distributor_spans_received_total[5m]))
            format:
              type: number
              options:
                maximumFractionDigits: 1
          # Proof: tempo_discarded_spans_total, tempo_build_info (proven live 2026-11-14, platform-metrics-probe).
          - label: Spans Discarded
            query:
              floor(sum(increase((sum by (pod) (tempo_discarded_spans_total) or 0 * sum by (pod)
              (tempo_build_info))[24h:5m]))) and count(tempo_build_info)
            format:
              type: number
              options:
                maximumFractionDigits: 0
  # Authentik's host comes from infrastructure/configs, not a services app.yaml: explicit.
  authentik:
    name: Authentik
    icon: authentik.png
    href: https://auth.starktastic.net
    description: Identity provider & SSO
    siteMonitor: http://authentik-server.authentik:80
    namespace: authentik
    app: authentik
    widgets:
      - type: authentik
        url: http://authentik-server.authentik:80
        key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
        version: 2
  vaultwarden:
    name: Vaultwarden
    source: services/operations/vaultwarden
    icon: vaultwarden.png
    description: Password manager
  # Falco's host comes from a static IngressRoute, not a services app.yaml: explicit.
  falco:
    name: Falco
    icon: mdi-shield-search
    href: https://falco.internal.starktastic.net
    description: Runtime threat detection
    siteMonitor: http://falco-falcosidekick-ui.falco:2802
    namespace: falco
    app: falco
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          # Proof: the Security tile's Falco 24h, word for word.
          - label: Events 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total) or 0 * sum by (pod)
              (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: falcosecurity_falcosidekick_outputs_total by status, seen with status="ok" (proven live 2026-11-14, platform-metrics-probe).
          - label: Output Errors 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_outputs_total{status!="ok"}) or 0 * sum by
              (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
            format:
              type: number
              options:
                maximumFractionDigits: 0
      # The same count split by Falco's priority. Proof: priority_raw carries critical, error, warning, notice and
      # informational (proven live 2026-11-14, platform-metrics-probe, third batch). No alert rule in Git reads
      # these, so no highlight.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          - label: Critical 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="critical"})
              or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and
              count(up{job="falco-falcosidekick"} == 1)
            format: *whole
          - label: Error 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="error"}) or
              0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"}
              == 1)
            format: *whole
          - label: Warning 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="warning"})
              or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and
              count(up{job="falco-falcosidekick"} == 1)
            format: *whole
          - label: Notice 24h
            query:
              floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="notice"})
              or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and
              count(up{job="falco-falcosidekick"} == 1)
            format: *whole
  # No page of its own, so no link. Every query is proven live (2026-11-14, platform-metrics-probe, third batch):
  # job cert-manager, certificates labelled by name and exported_namespace.
  # Not Ready mirrors CertManagerCertNotReady (critical) and Next Expiry mirrors CertManagerCertExpiringSoon
  # (warning, under 10 days), both in infrastructure/system/cert-manager.
  cert-manager:
    name: cert-manager
    icon: mdi-certificate
    description: Certificates and their issuers
    namespace: cert-manager
    app: cert-manager
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          - label: Certificates
            query: count(max by (exported_namespace, name) (certmanager_certificate_ready_status))
            format: *whole
          - label: Not Ready
            query:
              (count(max by (exported_namespace, name) (certmanager_certificate_ready_status{condition="True"}) == 0) or
              vector(0)) and count(certmanager_certificate_ready_status)
            format: *whole
          - label: Next Expiry
            query: min(certmanager_certificate_expiration_timestamp_seconds > 0) - time()
            format:
              type: number
              scale: 1/86400
              suffix: " days"
              options:
                maximumFractionDigits: 0
          - label: Sync Errors 24h
            query:
              (sum(increase(certmanager_controller_sync_error_count[24h])) or vector(0)) and
              count(up{job="cert-manager"} == 1)
            format: *whole
        highlight:
          Not Ready:
            numeric:
              - level: danger
                when: gt
                value: 0
          Next Expiry:
            numeric:
              - level: warn
                when: lt
                value: 10
  # Argo CD's host comes from infrastructure/configs, not a services app.yaml: explicit.
  argo-cd:
    name: Argo CD
    icon: argo-cd.png
    href: https://argocd.internal.starktastic.net
    description: GitOps controller
    siteMonitor: https://argocd-server.argocd.svc.cluster.local:443
    namespace: argocd
    app: argocd-server
    # OutOfSync mirrors ArgoCDAppOutOfSync (a warning); Unhealthy is red (Ben, 2026-11-13).
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 30000
        metrics:
          - label: Apps
            query: count(argocd_app_info)
          - label: Synced
            query: (count(argocd_app_info{sync_status="Synced"}) or vector(0)) and count(argocd_app_info)
          - label: OutOfSync
            query: (count(argocd_app_info{sync_status="OutOfSync"}) or vector(0)) and count(argocd_app_info)
          - label: Unhealthy
            query:
              (count(argocd_app_info{health_status!~"Healthy|Progressing"}) or vector(0)) and count(argocd_app_info)
        highlight:
          OutOfSync:
            numeric:
              - level: warn
                when: gt
                value: 0
          Unhealthy:
            numeric:
              - level: danger
                when: gt
                value: 0
      # What the controllers themselves report. Proven live (2026-11-14, platform-metrics-probe, third batch):
      # argocd_app_sync_total by phase, argocd_app_condition, argocd_notifications_deliveries_total by succeeded,
      # argocd_appset_info by resource_update_status. Comparison Errors mirrors ArgoCDAppComparisonFailing and
      # Notify Fails 1h mirrors ArgoCDNotificationDeliveryFailing, both warnings.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          - label: Sync Fails 24h
            query:
              (sum(increase(argocd_app_sync_total{phase!="Succeeded"}[24h])) or vector(0)) and count(argocd_app_info)
            format: *whole
          - label: Comparison Errors
            query:
              (count(max by (namespace, name, project) (argocd_app_info{sync_status="Unknown"}) or max by (namespace,
              name, project) (argocd_app_condition{condition="ComparisonError"})) or vector(0)) and
              count(argocd_app_info)
            format: *whole
          - label: Notify Fails 1h
            query:
              (sum(increase(argocd_notifications_deliveries_total{succeeded="false"}[1h])) or vector(0)) and
              count(argocd_app_info)
            format: *whole
          - label: AppSet Errors
            query:
              (count(argocd_appset_info{resource_update_status!="ApplicationSetUpToDate"}) or vector(0)) and
              count(argocd_appset_info)
            format: *whole
        highlight:
          Comparison Errors:
            numeric:
              - level: warn
                when: gt
                value: 0
          Notify Fails 1h:
            numeric:
              - level: warn
                when: gt
                value: 0
