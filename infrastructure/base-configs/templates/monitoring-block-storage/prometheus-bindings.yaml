apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-block
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 16Gi
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: proxmox-retained
  claimRef:
    name: prometheus-data-block-prometheus-kube-prometheus-stack-prometheus-0
    namespace: monitoring
  csi:
    driver: csi.proxmox.sinextra.dev
    fsType: ext4
    volumeHandle: homelab//k3s-block/9999/vm-9999-prometheus.raw
    volumeAttributes:
      storage: k3s-block
      cache: none
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/region
              operator: In
              values:
                - homelab
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - pve
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-block-prometheus-kube-prometheus-stack-prometheus-0
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOncePod
  volumeMode: Filesystem
  storageClassName: proxmox-retained
  volumeName: prometheus-data-block
  resources:
    requests:
      storage: 16Gi
