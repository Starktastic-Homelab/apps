controllers:
  main:
    replicas: 1
    strategy: Recreate
    pod:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
    containers:
      main:
        image:
          repository: gtstef/filebrowser
          tag: 2.0.1-stable@sha256:2e3936caf7b12908f7d3ebb68ddfcea075cda5f732e4bd95beae6cfa529cbec7
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
          FILEBROWSER_CONFIG: /config/config.yaml
        envFrom:
          - secretRef:
              name: filebrowser-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 80
            path: /api/health
          readiness:
            enabled: true
            type: HTTP
            port: 80
            path: /api/health
          startup:
            enabled: true
            type: TCP
            port: 80
            spec:
              failureThreshold: 30
              periodSeconds: 5

service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  config:
    enabled: false
  fbconfig:
    type: configMap
    name: filebrowser-config
    globalMounts:
      - path: /config
        readOnly: true
  data:
    existingClaim: filebrowser-data-block
    globalMounts:
      - path: /home/filebrowser/data
  apps:
    existingClaim: filebrowser-apps-pvc
    globalMounts:
      - path: /srv/apps
  media:
    enabled: true
    existingClaim: filebrowser-media-pvc
    globalMounts:
      - path: /srv/media
