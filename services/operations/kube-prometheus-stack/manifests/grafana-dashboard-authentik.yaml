# Grafana dashboard "Authentik", source: custom (built 2026-11-16).
# Provisioned read-only by the Grafana sidecar. To change it, edit in Grafana, export the JSON
# (Share > Export) and replace the block below, keeping uid authentik-overview.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-authentik
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Edge and Security"
data:
  authentik.json: |
    {
      "uid": "authentik-overview",
      "title": "Authentik",
      "description": "Authentik core, flows, policies and outposts (internal gate, LDAP).",
      "tags": [
        "authentik",
        "security"
      ],
      "timezone": "browser",
      "editable": true,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "graphTooltip": 1,
      "schemaVersion": 42,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / s (core)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(authentik_main_request_duration_seconds_count[5m]))",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#8b5cf6",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Avg request time",
          "gridPos": {
            "x": 5,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(authentik_main_request_duration_seconds_sum[5m])) / sum(rate(authentik_main_request_duration_seconds_count[5m]))",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#8b5cf6",
                    "value": null
                  },
                  {
                    "color": "#f59e0b",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
