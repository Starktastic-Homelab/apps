apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: operations
data:
  favicon.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
      <defs>
        <filter id="glow">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
          <feFlood flood-color="#DC2626" flood-opacity="0.5" result="color"/>
          <feComposite in="color" in2="blur" operator="in" result="shadow"/>
          <feMerge>
            <feMergeNode in="shadow"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <rect width="48" height="48" rx="10" fill="#0F0F1A"/>
      <text x="50%" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
            font-size="26" font-weight="800" letter-spacing="1">
        <tspan fill="#F1F5F9">S</tspan><tspan fill="#DC2626" filter="url(#glow)">T</tspan>
      </text>
    </svg>
  docker.yaml: ""
  custom.js: ""
  custom.css: |
    /* The "Calendar" card title just repeats the widget below it, but the
       description carries the colour legend and Homepage nests it inside
       .service-title — so drop the name only, not the whole row. */
    li.service[data-name="Calendar"] .service-name {
      font-size: 0;
      padding-top: 0;
    }

    li.service[data-name="Calendar"] .service-description {
      font-size: 0.75rem;
    }

    /* A failing service must not be signalled by colour alone: give it a
       square outline and a slow pulse so it reads without colour vision. */
    .service-tags div.bg-rose-500 {
      border-radius: 2px;
      animation: status-down 1.6s ease-in-out infinite;
    }

    @keyframes status-down {
      50% {
        opacity: 0.35;
      }
    }

    /* A dot that is neither up nor down is still being checked. Fade it
       gently so first paint reads as "checking", not "broken". */
    .service-tags div.rounded-full:not(.bg-emerald-500):not(.bg-rose-500) {
      animation: status-pending 1.4s ease-in-out infinite;
    }

    @keyframes status-pending {
      50% {
        opacity: 0.4;
      }
    }

    /* Group headers collapse on click, but the chevron only appears on
       hover, which never happens on touch. Keep it permanently visible. */
    button.w-full.select-none.items-center.group svg {
      opacity: 0.45;
    }

    button.w-full.select-none.items-center.group:hover svg {
      opacity: 1;
    }

    /* WCAG 2.5.8: interactive controls need a 44px target. Tabs, group
       headers, the search button and the calendar arrows all ship shorter. */
    li:has(> button.w-full.rounded-md.m-1) {
      height: auto;
    }

    li > button.w-full.rounded-md.m-1,
    button.w-full.select-none.items-center.group,
    button.rounded-r-md.px-4.py-2,
    li.service[data-name="Calendar"] button {
      min-height: 2.75rem;
    }

    /* Homepage 1.13.2 renders the quicklaunch button's label as the raw
       i18n key "search.search"; substitute a real label until it is fixed. */
    button.rounded-r-md.px-4.py-2 {
      font-size: 0;
    }

    button.rounded-r-md.px-4.py-2::after {
      content: "Search";
      font-size: 0.875rem;
    }

    @media (max-width: 640px) {
      /* Below the sm breakpoint the tab list stacks one row per tab, which
         pushes every service below the fold. Scroll them sideways instead. */
      ul:has(> li > button.w-full.rounded-md.m-1) {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
      }

      ul:has(> li > button.w-full.rounded-md.m-1) > li {
        width: auto;
        flex: 1 0 auto;
      }

      li > button.w-full.rounded-md.m-1 {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
    }
  kubernetes.yaml: |
    mode: disabled
  settings.yaml: |
    title: Starktastic
    language: en
    headerStyle: boxedWidgets
    statusStyle: dot
    # Cards size to their content; equal heights inflate widget-less services
    # into tall empty boxes when a group mixes widgets with plain links.
    useEqualHeights: false
    hideVersion: true
    # Surface widget failures instead of silently rendering an empty card.
    hideErrors: false
    disableCollapse: false
    disableIndexing: true
    iconStyle: theme
    favicon: /icons/favicon.svg
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: false
      provider: custom
      url: https://search.starktastic.net/search?q=
    pwa:
      shortcuts:
        - name: Pulse
          url: "/#pulse"
        - name: Play
          url: "/#play"
        - name: Make
          url: "/#make"
    layout:
      # -- Pulse --
      Now Playing:
        tab: Pulse
        style: row
        columns: 2
        icon: mdi-play-circle
      Coming Up:
        tab: Pulse
        style: row
        columns: 2
        icon: mdi-calendar-month
      Links:
        tab: Pulse
        style: row
        columns: 2
        icon: mdi-bookmark-outline
      # -- Play --
      Watch:
        tab: Play
        style: row
        columns: 1
        icon: mdi-television-play
      Listen:
        tab: Play
        style: row
        columns: 2
        icon: mdi-headphones
      Read:
        tab: Play
        style: row
        columns: 1
        icon: mdi-book-open-page-variant
      Look Back:
        tab: Play
        style: row
        columns: 1
        icon: mdi-image-multiple
      Ask For It:
        tab: Play
        style: row
        columns: 3
        icon: mdi-hand-heart
      # -- Make --
      Create:
        tab: Make
        style: row
        columns: 2
        icon: mdi-draw
      Convert:
        tab: Make
        style: row
        columns: 4
        icon: mdi-file-swap
      Find:
        tab: Make
        style: row
        columns: 2
        icon: mdi-magnify
      Organise:
        tab: Make
        style: row
        columns: 2
        icon: mdi-clipboard-check
      Send:
        tab: Make
        style: row
        columns: 3
        icon: mdi-send
  widgets.yaml: |
    - logo:
        icon: /icons/favicon.svg
    - greeting:
        text_size: xl
        text: Welcome home
    - search:
        provider: custom
        url: https://search.starktastic.net/search?q=
        target: _blank
    - openmeteo:
        label: Weather
        latitude: 32.08
        longitude: 34.78
        timezone: Asia/Jerusalem
        units: metric
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
  services.yaml: |
    # ==================== PULSE ====================
    - Now Playing:
        - On TV:
            icon: jellyfin.png
            href: https://benplus.app
            description: Who is watching what
            siteMonitor: http://jellyfin-main.media.svc.cluster.local:8096
            widget:
              type: jellyfin
              url: http://jellyfin-main.media.svc.cluster.local:8096
              key: {{ "{{" }}HOMEPAGE_VAR_JELLYFIN_KEY{{ "}}" }}
              enableBlocks: false
              enableNowPlaying: true
              enableUser: false
              showEpisodeNumber: true
        - Music Playing:
            icon: navidrome.png
            href: https://music.benplus.app
            description: What is on the speakers
            siteMonitor: http://navidrome.media.svc.cluster.local:4533
            widget:
              type: navidrome
              url: http://navidrome.media.svc.cluster.local:4533
              user: {{ "{{" }}HOMEPAGE_VAR_NAVIDROME_USER{{ "}}" }}
              token: {{ "{{" }}HOMEPAGE_VAR_NAVIDROME_TOKEN{{ "}}" }}
              salt: {{ "{{" }}HOMEPAGE_VAR_NAVIDROME_SALT{{ "}}" }}
    - Coming Up:
        - Calendar:
            description: Blue = TV · Red = Movies
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
              showTime: true
              firstDayInWeek: sunday
              integrations:
                - type: ical
                  url: http://sonarr.media.svc.cluster.local:8989/feed/v3/calendar/Sonarr.ics?apikey={{ "{{" }}HOMEPAGE_VAR_SONARR_KEY{{ "}}" }}
                  name: TV
                  color: blue
                - type: ical
                  url: http://radarr.media.svc.cluster.local:7878/feed/v3/calendar/Radarr.ics?apikey={{ "{{" }}HOMEPAGE_VAR_RADARR_KEY{{ "}}" }}
                  name: Movies
                  color: red
        - Tasks Due:
            icon: vikunja.png
            href: https://vikunja.starktastic.net
            description: Shared to-do lists
            siteMonitor: http://vikunja.operations.svc.cluster.local:3456
            widget:
              type: vikunja
              url: http://vikunja.operations.svc.cluster.local:3456
              key: {{ "{{" }}HOMEPAGE_VAR_VIKUNJA_KEY{{ "}}" }}
              enableTaskList: true
              version: 2
    # ==================== PLAY ====================
    - Watch:
        - Jellyfin:
            icon: jellyfin.png
            href: https://benplus.app
            description: Movies, TV & anime
            siteMonitor: http://jellyfin-main.media.svc.cluster.local:8096
    - Listen:
        - Navidrome:
            icon: navidrome.png
            href: https://music.benplus.app
            description: Music streaming
            siteMonitor: http://navidrome.media.svc.cluster.local:4533
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://audiobooks.benplus.app
            description: Audiobooks & podcasts
            siteMonitor: http://audiobookshelf.media.svc.cluster.local:80
    - Read:
        - Calibre-Web:
            icon: calibre-web.png
            href: https://books.benplus.app
            description: E-book library
            siteMonitor: http://calibre-web.media.svc.cluster.local:8083/opds
            widget:
              type: calibreweb
              url: http://calibre-web.media.svc.cluster.local:8083
              username: {{ "{{" }}HOMEPAGE_VAR_CALIBRE_USER{{ "}}" }}
              password: {{ "{{" }}HOMEPAGE_VAR_CALIBRE_PASS{{ "}}" }}
    - Look Back:
        - Immich:
            icon: immich.png
            href: https://photos.benplus.app
            description: Photos & videos
            siteMonitor: http://immich-main.media.svc.cluster.local:2283
            widget:
              type: immich
              url: http://immich-main.media.svc.cluster.local:2283
              key: {{ "{{" }}HOMEPAGE_VAR_IMMICH_KEY{{ "}}" }}
              version: 2
    - Ask For It:
        - Seerr:
            icon: overseerr.png
            href: https://request.benplus.app
            description: Request movies & TV
            siteMonitor: http://seerr.media.svc.cluster.local:5055
            widget:
              type: seerr
              url: http://seerr.media.svc.cluster.local:5055
              key: {{ "{{" }}HOMEPAGE_VAR_SEERR_KEY{{ "}}" }}
        - Seerr RU:
            icon: overseerr.png
            href: https://request-ru.benplus.app
            description: Request movies & TV (RU)
            siteMonitor: http://seerr-ru.media.svc.cluster.local:5055
            widget:
              type: seerr
              url: http://seerr-ru.media.svc.cluster.local:5055
              key: {{ "{{" }}HOMEPAGE_VAR_SEERR_RU_KEY{{ "}}" }}
        - Shelfmark:
            icon: mdi-bookshelf
            href: https://request-books.benplus.app
            description: Request books
            siteMonitor: http://shelfmark.media.svc.cluster.local:8084
    # ==================== MAKE ====================
    - Create:
        - Excalidash:
            icon: excalidraw.png
            href: https://excalidash.starktastic.net
            description: Whiteboard & diagrams
            siteMonitor: http://excalidash.operations.svc.cluster.local:80
        - MicroBin:
            icon: microbin.png
            href: https://microbin.starktastic.net
            description: Paste & share text
            siteMonitor: http://microbin.operations.svc.cluster.local:8080
    - Convert:
        - ConvertX:
            icon: convertx.png
            href: https://convertx.starktastic.net
            description: File format converter
            siteMonitor: http://convertx.operations.svc.cluster.local:3000
        - Stirling PDF:
            icon: stirling-pdf.png
            href: https://pdf.starktastic.net
            description: PDF toolbox
            siteMonitor: http://stirling-pdf.operations.svc.cluster.local:8080
        - MeTube:
            icon: metube.png
            href: https://metube.benplus.app
            description: Download video & audio
            siteMonitor: http://metube.media.svc.cluster.local:8081
        - CyberChef:
            icon: cyberchef.png
            href: https://cyberchef.starktastic.net
            description: Encode, decode, analyse
            siteMonitor: http://cyberchef.operations.svc.cluster.local:8000
    - Find:
        - SearXNG:
            icon: searxng.png
            href: https://search.starktastic.net
            description: Private metasearch
            siteMonitor: http://searxng.operations.svc.cluster.local:8080
        - Karakeep:
            icon: karakeep.png
            href: https://karakeep.starktastic.net
            description: Bookmarks & read-later
            siteMonitor: http://karakeep.operations.svc.cluster.local:3000
            widget:
              type: karakeep
              url: http://karakeep.operations.svc.cluster.local:3000
              key: {{ "{{" }}HOMEPAGE_VAR_KARAKEEP_KEY{{ "}}" }}
    - Organise:
        - Vikunja:
            icon: vikunja.png
            href: https://vikunja.starktastic.net
            description: Tasks & projects
            siteMonitor: http://vikunja.operations.svc.cluster.local:3456
        - Mealie:
            icon: mealie.png
            href: https://mealie.starktastic.net
            description: Recipes & shopping lists
            siteMonitor: http://mealie.operations.svc.cluster.local:9000
    - Send:
        - PairDrop:
            icon: pairdrop.png
            href: https://pairdrop.starktastic.net
            description: Device-to-device transfer
            siteMonitor: http://pairdrop.operations.svc.cluster.local:3000
        - ntfy:
            icon: ntfy.png
            href: https://ntfy.starktastic.net
            description: Push notifications
            siteMonitor: http://ntfy.operations.svc.cluster.local:80
        - Listmonk:
            icon: listmonk.png
            href: https://listmonk.starktastic.net
            description: Newsletters & mailing lists
            siteMonitor: http://listmonk.operations.svc.cluster.local:9000
  bookmarks.yaml: |
    - Links:
        - My Account:
            - abbr: AC
              href: https://auth.starktastic.net
        - GitHub:
            - abbr: GH
              href: https://github.com/Starktastic-Homelab
