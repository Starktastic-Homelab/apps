controllers:
  postgres:
    strategy: Recreate
    pod:
      securityContext: {}
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
    initContainers:
      verify-retained-data:
        image:
          repository: ghcr.io/immich-app/postgres
          tag: 17-vectorchord0.4.3-pgvector0.8.1@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
        command:
          - /bin/bash
          - /retained-startup/guard.sh
        env:
          EXPECTED_SYSTEM_IDENTIFIER: "7614955115223928876"
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
    containers:
      main:
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
persistence:
  pgdata:
    existingClaim: immich-postgres-block
    advancedMounts:
      postgres:
        verify-retained-data:
          - path: /data
            readOnly: true
  retained-startup:
    type: configMap
    name: immich-postgres-retained-startup
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      postgres:
        verify-retained-data:
          - path: /retained-startup
            readOnly: true
  retained-scratch:
    type: emptyDir
    sizeLimit: 16Mi
    globalMounts: []
    advancedMounts:
      postgres:
        verify-retained-data:
          - path: /tmp
