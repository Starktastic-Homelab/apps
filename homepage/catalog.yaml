  home-assistant:
    name: Home Assistant
    source: services/home-automation/home-assistant
    icon: home-assistant.png
    description: Smart home control
    widgets:
      - type: homeassistant
        url: http://home-assistant-main.home-automation:8123
        key: "{{HOMEPAGE_VAR_HASS_KEY}}"
      # The home-automation namespace (Home Assistant, Zigbee2MQTT, Mosquitto) on metrics the Pulse board
      # already reads. No probe covers Home Assistant, so there is no uptime figure.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 60000
        metrics:
          # Proof: kube_pod_status_phase is in the Cluster tile's Unhealthy Pods query.
          - label: Home Pods
            query: sum(kube_pod_status_phase{namespace="home-automation",phase="Running"})
          # Proof: kube_pod_container_status_restarts_total is the Cluster tile's Restarts 1h.
          - label: Restarts 24h
            query: floor(sum(increase(kube_pod_container_status_restarts_total{namespace="home-automation"}[24h])))
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: container_memory_working_set_bytes, by namespace, pod and container, is the Memory tile's
          # Top Container. The container is named main in home-assistant/values.yaml.
          - label: HA Memory
            query: sum(container_memory_working_set_bytes{namespace="home-automation",pod=~"home-assistant-.*",container="main"})
            format:
              type: bytes
