controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/c4illin/convertx
          tag: v0.18.0@sha256:b515b04bfd25298a5cdc775b2fcd48b9399bab658ce13e2598b65df1b16098c8
        env:
          ALLOW_UNAUTHENTICATED: "true"
          UNAUTHENTICATED_USER_SHARING: "false"
          ACCOUNT_REGISTRATION: "false"
          AUTO_DELETE_EVERY_N_HOURS: "24"
          FFMPEG_ARGS: "-hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -hwaccel_output_format vaapi"
        resources:
          limits:
            gpu.intel.com/i915: "1"
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 3000
          readiness:
            enabled: true
            type: TCP
            port: 3000
          startup:
            enabled: true
            type: TCP
            port: 3000
            spec:
              failureThreshold: 30
              periodSeconds: 5

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      securityContext:
        supplementalGroups:
          - 1000
    initContainers:
      retained-convertx-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - convertx
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 3000

persistence:
  config:
    enabled: false
  convertx-data:
    existingClaim: convertx-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /app/data
        retained-convertx-data:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: operations-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-convertx-data:
          - path: /retained-startup
            readOnly: true
