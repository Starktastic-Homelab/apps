controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
        env:
          LOG_LEVEL: info
          NODE_ENV: production
          DB_TYPE: postgres
          DB_HOST: postgres-postgresql.databases
          DB_PORT: "5432"
          DB_USER: seerr
          DB_NAME: seerr
          DB_POOL_SIZE: "3"
          DB_PASS:
            valueFrom:
              secretKeyRef:
                name: seerr-postgres-secret
                key: password
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/v1/status/appdata
            port: 5055
          readiness:
            enabled: true
            type: HTTP
            path: /api/v1/status/appdata
            port: 5055
          startup:
            enabled: true
            type: HTTP
            path: /api/v1/status/appdata
            port: 5055
    replicas: 1
    strategy: Recreate
    serviceAccount:
      name: seerr-postgres-completion
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - /app/config
          - seerr
        env:
          NODE_ENV: production
          DB_TYPE: postgres
          DB_HOST: postgres-postgresql.databases
          DB_PORT: "5432"
          DB_USER: seerr
          DB_NAME: seerr
          DB_POOL_SIZE: "3"
          DB_PASS:
            valueFrom:
              secretKeyRef:
                name: seerr-postgres-secret
                key: password
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      enrollment:
        command:
          - python3
          - -B
          - /gate/completion_gate.py
        args:
          - --id
          - seerr
          - --database
          - seerr
          - --role
          - seerr
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        dependsOn: retained-state
      database:
        command:
          - /bin/sh
          - -ec
          - export PGPASSWORD="$(cat /credentials/password)"; exec psql -XqAt -v ON_ERROR_STOP=1 -f
            /retained-startup/main.sql >/dev/null 2>&1
        env:
          - name: PGHOST
            value: postgres-postgresql.databases
          - name: PGPORT
            value: "5432"
          - name: PGUSER
            value: seerr
          - name: PGDATABASE
            value: seerr
          - name: PGCONNECT_TIMEOUT
            value: "10"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        image:
          repository: postgres:18.6-alpine
          digest: sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        dependsOn: enrollment
service:
  main:
    controller: main
    ports:
      http:
        port: 5055
persistence:
  config:
    size: 1Gi
    globalMounts:
      - path: /app/config
    enabled: false
  pg-completion-script:
    type: configMap
    name: seerr-postgres-completion
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate
            readOnly: true
  pg-completion-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate-api
            readOnly: true
  pg-completion-password:
    type: secret
    name: seerr-postgres-secret
    defaultMode: 292
    items:
      - key: password
        path: password
    globalMounts: []
    advancedMounts:
      main:
        database:
          - path: /credentials
            readOnly: true
  media:
    enabled: false
  seerr-config:
    existingClaim: seerr-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /app/config
        retained-state:
          - path: /app/config
            readOnly: true
  retained-startup:
    type: configMap
    name: seerr-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
        database:
          - path: /retained-startup
            readOnly: true
