deployment:
  kind: DaemonSet
  # ── Init container: pre-fetch the CrowdSec bouncer plugin so Traefik never
  #    depends on GitHub availability at runtime.  The emptyDir volume persists
  #    across container restarts within the same pod.  On full pod recreation
  #    (reboots, cluster rebuild) the init container re-downloads it before
  #    Traefik starts, so the plugin is always present.
  initContainers:
    - name: download-bouncer-plugin
      image: alpine/git:latest
      command:
        - sh
        - -c
        - |
          DEST=/plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          # If already populated (container restart), skip.
          [ -f "$DEST/.traefik.yml" ] && echo "plugin already cached" && exit 0
          for i in 1 2 3 4 5; do
            # renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
            git clone --depth 1 --branch v1.8.1 \
              https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin.git \
              "$DEST" && exit 0
            echo "attempt $i failed, retrying in 5s…"
            sleep 5
          done
          echo "FATAL: could not download bouncer plugin" >&2
          exit 1
      volumeMounts:
        - name: crowdsec-bouncer-plugin
          mountPath: /plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
  additionalVolumes:
    - name: crowdsec-bouncer-plugin
      emptyDir: {}

accessLog:
  enabled: true
  format: json
  fields:
    # Headers carry session cookies, Authorization, the forward-auth JWT and API keys, and this
    # log goes to Loki. Allowlist only: CrowdSec's traefik-logs parser reads request_User-Agent.
    headers:
      defaultMode: drop
      names:
        User-Agent: keep

# Allow running on Master/Control Plane nodes
tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

ports:
  web:
    port: 8000
    expose:
      default: true
  websecure:
    port: 8443
    expose:
      default: true
    protocol: TCP
    http:
      # Runs before each router's own middlewares; see manifests/templates/strip-authentik-headers.yaml.
      middlewares:
        - traefik-system-strip-authentik-headers@kubernetescrd
  web-int:
    port: 8001
    expose:
      default: false
  websec-int:
    port: 8444
    expose:
      default: false
    protocol: TCP
    http:
      middlewares:
        - traefik-system-strip-authentik-headers@kubernetescrd
  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100
# The strip middleware and forward auth replace only canonical names (X-Authentik-Email), while
# WSGI, PHP and nginx backends also read X_authentik_email or X.authentik.email as that header.
# Drop request headers whose names alias another one, on every entrypoint (Traefik v3.7.17+).
global:
  aliasHeadersStrategy: delete
service:
  enabled: false
persistence:
  enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
api:
  dashboard: true
  # `insecure: true` exposes Traefik's API on port 8080 inside the pod — NOT
  # publicly. It's the standard way to back the in-cluster IngressRoute that
  # serves the dashboard at traefik.internal (which itself is gated by
  # Authentik forward-auth + the internal-ip-allowlist middleware).
  insecure: true
ingressRoute:
  dashboard:
    enabled: false
providers:
  kubernetesCRD:
    allowCrossNamespace: true
  kubernetesIngress:
    allowExternalNameServices: true
    publishedService:
      enabled: true

# -----------------------------------------------------------------------------
# CrowdSec bouncer plugin  (local mode — no GitHub download at Traefik start)
# The init container above pre-fetches the source into the emptyDir volume so
# the plugin is available before Traefik boots, surviving restarts and rebuilds.
# -----------------------------------------------------------------------------
experimental:
  localPlugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      type: localPath
      mountPath: /plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      volumeName: crowdsec-bouncer-plugin

volumes:
  - name: crowdsec-bouncer-key
    mountPath: /etc/crowdsec
    type: secret

# -----------------------------------------------------------------------------
# Distributed tracing (OTLP → Alloy → Tempo)
# -----------------------------------------------------------------------------
tracing:
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "alloy.monitoring:4317"
      insecure: true

# -----------------------------------------------------------------------------
# Prometheus metrics
# ServiceMonitor is deployed as a separate manifest to avoid the chart's
# hard dependency on monitoring.coreos.com CRDs at template-render time.
# -----------------------------------------------------------------------------
metrics:
  prometheus:
    entryPoint: metrics
    serviceMonitor:
      enabled: false
    service:
      enabled: true
