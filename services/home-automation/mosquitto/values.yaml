controllers:
  main:
    containers:
      main:
        image:
          repository: eclipse-mosquitto
          tag: 2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 1883
          readiness:
            enabled: true
            type: TCP
            port: 1883
          startup:
            enabled: true
            type: TCP
            port: 1883
            spec:
              failureThreshold: 30
              periodSeconds: 5

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - mosquitto
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1883
          runAsGroup: 1883
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      mqtt:
        port: 1883

persistence:
  config:
    enabled: false
  mosquitto-conf:
    type: configMap
    name: mosquitto-config
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
  media:
    enabled: false
  retained-startup:
    type: configMap
    name: retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  retained-config:
    enabled: true
    existingClaim: mosquitto-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /mosquitto/data
        retained-data:
          - path: /retained
            readOnly: true
