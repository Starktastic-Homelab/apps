apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-custom-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backup-freshness
      rules:
        - alert: CronJobNotSucceededRecently
          expr:
            (time() - kube_cronjob_status_last_successful_time > 26 * 3600) and on(namespace, cronjob)
            kube_cronjob_spec_suspend == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CronJob has not succeeded recently ({{ $labels.cronjob }})"
            description:
              "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not had a successful run in over 26 hours."
    - name: pvc
      rules:
        - alert: PVCSpaceLow
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC space low ({{ $labels.persistentvolumeclaim }})"
            description:
              "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% space remaining."
        - alert: PVCSpaceCritical
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "PVC space critical ({{ $labels.persistentvolumeclaim }})"
            description:
              "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 5% space remaining."
    - name: alert-pipeline
      rules:
        - alert: AlertmanagerDown
          expr: up{job=~".*alertmanager.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager target down"
            description: "An Alertmanager scrape target ({{ $labels.job }}) has been down for 5 minutes."
    # Both appsets use strategy.type RollingSync, which force-disables autosync on
    # every Application it generates and only re-queues one when its target revision
    # or generated spec changes. Cluster drift is neither, so a drifted app sits
    # OutOfSync indefinitely with nothing to heal it -- and because it never attempts
    # a sync, on-sync-failed never fires and nothing notifies. This is the only thing
    # that catches that class of rot. `for` outlasts the OutOfSync window of a normal
    # rollout, so ordinary deploys stay quiet.
    #
    # ArgoCD 3.6 added a phase label to argocd_app_info; it and operation change on every
    # sync attempt. Aggregating them away keeps one alert per app, so a failed manual
    # sync doesn't restart `for` or resolve a firing alert.
    - name: argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: max by (namespace, name, project) (argocd_app_info{sync_status="OutOfSync"}) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD application out of sync ({{ $labels.name }})"
            description:
              "Application {{ $labels.name }} has been OutOfSync for over an hour. Autosync is disabled by RollingSync,
              so this will not heal on its own -- sync it manually or land a commit that changes it."
        # ArgoCD 3.6 diffs every ServerSideApply=true app server-side, through admission
        # webhooks (several failurePolicy: Fail). A failed dry-run is a ComparisonError with
        # sync_status Unknown, which the rule above and the ntfy triggers miss. RollingSync
        # finishes a step only when its apps are Synced and Healthy, so later steps stall.
        # Some ComparisonErrors (health, for example) keep the old sync status, hence
        # argocd_app_condition; it needs controller.metrics.application.conditions in
        # ansible's roles/bootstrap_cluster/tasks/argocd.yml. The Unknown half works without it.
        - alert: ArgoCDAppComparisonFailing
          expr:
            max by (namespace, name, project) (argocd_app_info{sync_status="Unknown"}) or max by (namespace, name,
            project) (argocd_app_condition{condition="ComparisonError"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD cannot compare application ({{ $labels.name }})"
            description:
              "Application {{ $labels.name }} has had sync status Unknown or a ComparisonError for 30 minutes, often a
              failed server-side diff dry-run in an admission webhook. RollingSync cannot finish its step, so later
              steps never sync. Check the app's conditions in ArgoCD."
        # `service` is the notifier (ntfy), which needs honorLabels on the notifications
        # ServiceMonitor (infrastructure/configs/templates/argocd/servicemonitor-chart-metrics.yaml).
        # shortcut: a (trigger, service) series appears at 1 on its first failure since the
        # pod started, and increase() can't see that step, so a lone failure stays silent and
        # a second one fires. Also count series that are new in the window if that matters.
        - alert: ArgoCDNotificationDeliveryFailing
          expr:
            sum by (namespace, service, trigger)
            (increase(argocd_notifications_deliveries_total{succeeded="false"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD notification delivery failing ({{ $labels.service }}, {{ $labels.trigger }})"
            description:
              "The ArgoCD notifications controller failed to deliver {{ $labels.trigger }} through {{ $labels.service }}
              in the last hour, so sync failures and degraded apps may go unreported. Check the
              argocd-notifications-controller logs."
    # Nothing watched container memory before, so Postgres sat at 94-98% of its
    # limit for four days and OOMKilled with no warning, which 503'd Authentik's
    # DB-backed liveness probe and restarted every SSO replica at once.
    #
    # NearLimit deliberately uses working_set, not usage_bytes. usage_bytes
    # counts reclaimable page cache, which a file server legitimately pins at
    # 100% of its limit forever - filebrowser peaks at 1024Mi/1024Mi on 846Mi of
    # cache against just 128Mi RSS, and paging on that trains everyone to ignore
    # the alert. working_set excludes inactive cache and currently fires for
    # nothing cluster-wide.
    #
    # The tradeoff is that working_set under-reads shm-heavy databases: Postgres
    # was only at 68% by working_set when it died, because shared_buffers counts
    # as cache but is not reclaimable. OOMKilled is the backstop for that case,
    # and right-sizing is the actual fix - neither threshold predicts it cleanly.
    - name: container-memory
      rules:
        - alert: ContainerMemoryNearLimit
          expr:
            max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on (namespace, pod,
            container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.90
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Container near its memory limit ({{ $labels.namespace }}/{{ $labels.container }})"
            description:
              "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} has been above 90% of its memory limit
              for 30 minutes and will be OOMKilled by any allocation spike. Raise the limit or reduce usage."
        - alert: ContainerOOMKilled
          expr:
            increase(kube_pod_container_status_restarts_total[15m]) > 0 and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Container was OOMKilled ({{ $labels.namespace }}/{{ $labels.container }})"
            description:
              "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was killed for exceeding its memory
              limit and restarted. Check dependent services -- a database OOM takes its clients down with it."
