                  maximumFractionDigits: 0
            - label: Output Errors 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_outputs_total{status!="ok"}) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: Critical 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="critical"}) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Error 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="error"}) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Warning 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="warning"}) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Notice 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total{priority_raw="notice"}) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
      - cert-manager:
          id: cert-manager
          icon: mdi-certificate
          description: Certificates and their issuers
          namespace: cert-manager
          app: cert-manager
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Certificates
              query: count(max by (exported_namespace, name) (certmanager_certificate_ready_status))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Not Ready
              query: (count(max by (exported_namespace, name) (certmanager_certificate_ready_status{condition="True"}) == 0) or vector(0)) and count(certmanager_certificate_ready_status)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Next Expiry
              query: min(certmanager_certificate_expiration_timestamp_seconds > 0) - time()
              format:
                type: number
                scale: 1/86400
                suffix: ' days'
                options:
                  maximumFractionDigits: 0
            - label: Sync Errors 24h
              query: (sum(increase(certmanager_controller_sync_error_count[24h])) or vector(0)) and count(up{job="cert-manager"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            highlight:
              Not Ready:
                numeric:
                - level: danger
                  when: gt
                  value: 0
              Next Expiry:
                numeric:
                - level: warn
                  when: lt
                  value: 10
