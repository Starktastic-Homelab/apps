            format:
              type: bytes
  cluster-services:
    name: Cluster Services
    icon: mdi-cogs
    description: Reloader, MetalLB and Sealed Secrets
    widgets:
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          # Proof: reloader_reloads_failed_total, reloader_info (proven live 2026-11-14, platform-metrics-probe).
          - label: Failed Reloads 24h
            query:
              floor(sum(increase((sum by (pod) (reloader_reloads_failed_total) or 0 * sum by (pod)
              (reloader_info))[24h:5m]))) and count(reloader_info)
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: metallb_allocator_addresses_in_use_total by pool (proven live 2026-11-14, platform-metrics-probe).
          - label: LB In Use
            query: sum(max by (pool) (metallb_allocator_addresses_in_use_total))
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: metallb_allocator_addresses_total (proven live 2026-11-14, platform-metrics-probe).
          - label: LB Pool
            query: sum(max by (pool) (metallb_allocator_addresses_total))
            format:
              type: number
              options:
                maximumFractionDigits: 0
          # Proof: sealed_secrets_controller_condition_info (proven live 2026-11-14, platform-metrics-probe); 1 is true, 0 unknown, -1 false in pkg/controller/metrics.go at v0.41.2.
          - label: Unsynced Secrets
            query:
              (count(sealed_secrets_controller_condition_info{condition="Synced"} != 1) or vector(0)) and
              count(sealed_secrets_controller_build_info)
            format:
              type: number
              options:
                maximumFractionDigits: 0
      # The Intel GPU as Kubernetes sees it. Proof: kube_node_status_allocatable and
      # kube_pod_container_resource_requests carry resource="gpu_intel_com_i915" (proven live 2026-11-14,
      # platform-metrics-probe, third batch). Requested counts every pod that asks for one, running or not.
      - type: prometheusmetric
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        refreshInterval: 300000
        metrics:
          - label: GPU Nodes
            query: count(max by (node) (kube_node_status_allocatable{resource="gpu_intel_com_i915"}) > 0)
            format: *whole
          - label: GPU Slots
            query: sum(max by (node) (kube_node_status_allocatable{resource="gpu_intel_com_i915"}))
            format: *whole
          - label: GPU Requested
            query:
              sum(max by (namespace, pod, container)
              (kube_pod_container_resource_requests{resource="gpu_intel_com_i915"})) or vector(0)
            format: *whole
