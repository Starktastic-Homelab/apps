server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  # starktastic.net/ is also the signed-in Homepage: tell any shared cache the answer depends on the User-Agent.
  location = /og.jpg {
    add_header Vary "User-Agent" always;
    add_header Cache-Control "public, max-age=86400";
  }
  # Any other path is the card, so a shared deep link previews too.
  location / {
    default_type text/html;
    add_header Vary "User-Agent" always;
    add_header Cache-Control "public, max-age=3600";
    try_files /index.html =404;
  }
}
