# Clients can send X-authentik-* headers themselves, and Traefik passes them on. Forward auth
# replaces only the names in its authResponseHeaders list, so routes without it (Navidrome's
# /rest/ trusts X-authentik-username) and names outside the list reach apps as the client sent
# them. values.yaml runs this first on websecure and websec-int; forward auth then sets the real
# values. If this object is missing, every router on those entrypoints fails (404).
# PruneLast: a one-commit revert must not delete this before every Traefik pod drops the reference.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-authentik-headers
  namespace: traefik-system
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  headers:
    # Every header the Authentik 2026.8 outpost emits (getHeaders). An empty value deletes it.
    customRequestHeaders:
      X-authentik-username: ""
      X-authentik-groups: ""
      X-authentik-entitlements: ""
      X-authentik-email: ""
      X-authentik-name: ""
      X-authentik-uid: ""
      X-authentik-jwt: ""
      X-authentik-meta-jwks: ""
      X-authentik-meta-outpost: ""
      X-authentik-meta-provider: ""
      X-authentik-meta-app: ""
      X-authentik-meta-version: ""
