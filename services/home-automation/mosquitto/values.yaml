controllers:
  main:
    containers:
      main:
        image:
          repository: eclipse-mosquitto
          tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 1883
          readiness:
            enabled: true
            type: TCP
            port: 1883
          startup:
            enabled: true
            type: TCP
            port: 1883
            spec:
              failureThreshold: 30
              periodSeconds: 5

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - mosquitto
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1883
          runAsGroup: 1883
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      mqtt:
        port: 1883

persistence:
  config:
    enabled: false
  mosquitto-data:
    existingClaim: mosquitto-config
    globalMounts:
      - path: /mosquitto/data
    enabled: false
  mosquitto-conf:
    type: configMap
    name: mosquitto-config
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
  media:
    enabled: false
  retained-startup:
    type: configMap
    name: utility-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  retained-config:
    enabled: true
    existingClaim: mosquitto-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /mosquitto/data
        retained-data:
          - path: /retained
            readOnly: true
