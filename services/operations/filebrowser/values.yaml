controllers:
  main:
    replicas: 1
    strategy: Recreate
    pod:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
    containers:
      main:
        image:
          repository: gtstef/filebrowser
          tag: 2.0.2-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
          FILEBROWSER_CONFIG: /config/config.yaml
        envFrom:
          - secretRef:
              name: filebrowser-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 80
            path: /api/health
          readiness:
            enabled: true
            type: HTTP
            port: 80
            path: /api/health
          startup:
            enabled: true
            type: TCP
            port: 80
            spec:
              failureThreshold: 30
              periodSeconds: 5
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - filebrowser
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  config:
    enabled: false
  fbconfig:
    type: configMap
    name: filebrowser-config
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
            readOnly: true
  data:
    existingClaim: filebrowser-data-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /home/filebrowser/data
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
  apps:
    existingClaim: filebrowser-apps-pvc
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /srv/apps
  media:
    enabled: true
    existingClaim: filebrowser-media-pvc
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /srv/media
