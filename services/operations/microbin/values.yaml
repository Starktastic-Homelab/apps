controllers:
  main:
    containers:
      main:
        image:
          repository: danielszabo99/microbin
          tag: 2.1.4@sha256:6660e5ccad0d764fa3c0032464ffb8f4b4f28c92a2eb9e39202b94cdc5b68909
        env:
          MICROBIN_PUBLIC_PATH: "https://microbin.starktastic.net"
          MICROBIN_PORT: "8080"
          MICROBIN_BIND: "0.0.0.0"
          # Access control
          MICROBIN_PRIVATE: "true"
          MICROBIN_EDITABLE: "false"
          MICROBIN_NO_LISTING: "true"
          MICROBIN_ENABLE_READONLY: "true"
          # Encryption
          MICROBIN_ENCRYPTION_CLIENT_SIDE: "true"
          MICROBIN_ENCRYPTION_SERVER_SIDE: "true"
          # Features
          MICROBIN_ENABLE_BURN_AFTER: "true"
          MICROBIN_DEFAULT_EXPIRY: "24hour"
          MICROBIN_DEFAULT_BURN_AFTER: "0"
          MICROBIN_GC_DAYS: "90"
          MICROBIN_QR: "true"
          MICROBIN_HIGHLIGHTSYNTAX: "true"
          MICROBIN_SHOW_READ_STATS: "true"
          MICROBIN_WIDE: "false"
          # Telemetry
          MICROBIN_DISABLE_TELEMETRY: "true"
          MICROBIN_DISABLE_UPDATE_CHECKING: "true"
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8080
          readiness:
            enabled: true
            type: TCP
            port: 8080
          startup:
            enabled: true
            type: TCP
            port: 8080
            spec:
              failureThreshold: 30
              periodSeconds: 5

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - microbin
          - /retained
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 8080

persistence:
  config:
    enabled: false
  data:
    existingClaim: microbin-config
    globalMounts:
      - path: /app/microbin_data
    enabled: false
  retained-startup:
    type: configMap
    name: utility-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  retained-config:
    enabled: true
    existingClaim: microbin-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /app/microbin_data
        retained-data:
          - path: /retained
            readOnly: true
