apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jellyfin-storage-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: held-config-claim
      expression: >-
        object.metadata.namespace == 'media' && has(object.spec.volumes) && object.spec.volumes.exists(v,
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ['jellyfin-config',
        'jellyfin-config-iscsi'])
  validations:
    - expression: "false"
      message: Archived Jellyfin configuration claims cannot be mounted. Use jellyfin-config-block.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jellyfin-storage-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  policyName: jellyfin-storage-hold
  validationActions: [Deny]
