controllers:
  main:
    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
    initContainers:
      retained-data:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - mosquitto
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1883
          runAsGroup: 1883
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
persistence:
  retained-startup:
    type: configMap
    name: utility-home-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-data:
          - path: /retained-startup
            readOnly: true
  mosquitto-data:
    enabled: false
  retained-config:
    enabled: true
    existingClaim: mosquitto-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /mosquitto/data
        retained-data:
          - path: /retained
            readOnly: true
  mosquitto-conf:
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
