---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbit-manage-ru-config
  namespace: media
data:
  config.yml: |
    commands:
      dry_run: false
      recheck: true
      cat_update: true
      tag_update: true
      rem_unregistered: true
      tag_tracker_error: true
      # root_dir is the /data/torrents tree shared with the main client, so every main file looks orphaned here.
      rem_orphaned: false
      tag_nohardlinks: true
      share_limits: true
      skip_qb_version_check: true
      skip_cleanup: false

    qbt:
      host: "http://qbittorrent-ru-main.media:8080"

    settings:
      force_auto_tmm: false
      tracker_error_tag: issue
      nohardlinks_tag: noHL
      share_limits_tag: ~share_limit
      cat_filter_completed: true
      share_limits_filter_completed: true
      tag_nohardlinks_filter_completed: true
      cat_update_all: true
      disable_qbt_default_share_limits: true
      tag_stalled_torrents: true

    directory:
      root_dir: "/data/torrents/"
      recycle_bin: "/data/torrents/.RecycleBin"
      orphaned_dir: "/data/torrents/.orphaned"

    cat:
      movies-ru: "/data/torrents/movies-ru"
      tv-ru: "/data/torrents/tv-ru"

    tracker:
      kinozal:
        tag: Kinozal
      nnmclub|nnm-club:
        tag: NoNaMe Club
      # rutracker announces from bt*.t-ru.org.
      rutracker|t-ru.org:
        tag: RuTracker
      other:
        tag: other

    nohardlinks:
      movies-ru:
      tv-ru:

    share_limits:
      noHL:
        priority: 1
        include_all_tags:
          - noHL
        max_ratio: -1
        # Minutes of seeding; a day lets Sonarr-ru import (hardlink) before an unlinked torrent is removed.
        # min_seeding_time needs max_ratio > 0 (qbm refuses to start otherwise); neither group uses it.
        max_seeding_time: 1440
        cleanup: true
      default:
        priority: 999
        # Same goals qbittorrent-ru stops at (ratio 2, 1 day seeding, 1 day idle), but removed instead of left stopped.
        # max_last_active matters: qbm leaves qBittorrent's global idle stop in place and recheck resumes stopped
        # torrents, so without it an idle torrent is stopped and resumed forever.
        max_ratio: 2
        max_seeding_time: 1440
        max_last_active: 1440
        cleanup: true

    recyclebin:
      enabled: true
      empty_after_x_days: 3
      split_by_category: false

    orphaned:
      empty_after_x_days: 7
      min_file_age_minutes: 60
      exclude_patterns:
        - "**/.DS_Store"
        - "**/*.!qB"
        - "**/incomplete/**"
