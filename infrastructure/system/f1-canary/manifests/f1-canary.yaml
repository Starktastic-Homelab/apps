# The F1 canary (ADR 0017, D18): a 1 Gi regenerable volume with a SQLite writer that numbers rows 1..n and stops if
# a row it acknowledged is missing. Its guard has the same shape as templates/retained-guard.yaml.
# The volume (PV, PVC, guard ConfigMap) comes from base-configs; the namespace from the democratic-csi app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: f1-canary-writer
  namespace: democratic-csi
data:
  writer.py: |
    import os, signal, sqlite3, sys, time
    # python3 is PID 1 here: without a handler the kubelet's SIGTERM is ignored and every drain is a SIGKILL.
    signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
    db = sqlite3.connect('/data/rows.db', isolation_level=None)
    db.execute('PRAGMA journal_mode=WAL')
    db.execute('PRAGMA synchronous=FULL')
    db.execute('CREATE TABLE IF NOT EXISTS rows (n INTEGER PRIMARY KEY, t REAL NOT NULL, host TEXT NOT NULL)')
    ic = db.execute('PRAGMA integrity_check').fetchone()[0]
    cnt, mx = db.execute('SELECT count(*), coalesce(max(n), 0) FROM rows').fetchone()
    # Rows are numbered 1..max with no gaps; a gap or a short count means a lost acknowledged row.
    print(f'start host={os.environ["NODE"]} integrity={ic} count={cnt} max={mx} contiguous={cnt == mx}', flush=True)
    if ic != 'ok' or cnt != mx:
        sys.exit(3)
    n = mx
    while True:
        n += 1
        db.execute('BEGIN IMMEDIATE')
        db.execute('INSERT INTO rows VALUES (?, ?, ?)', (n, time.time(), os.environ['NODE']))
        db.execute('COMMIT')
        print(f'ack {n}', flush=True)
        time.sleep(0.2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-canary-writer
  namespace: democratic-csi
spec:
  replicas: 0
  # The claim is ReadWriteOncePod: a rolling update would wait forever for the old pod's claim.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: f1-canary-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: f1-canary-writer
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      # The master has no storage bridge NIC.
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      initContainers:
        - name: guard
          image: python@sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
          command:
            - python3
            - -I
            - -B
            - /retained-startup/guard.py
            - f1-canary
            - /data
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: retained-guard
              mountPath: /retained-startup
              readOnly: true
      containers:
        - name: writer
          image: python@sha256:8c9a3bf2d6dea60d60a2ae2a07c2b2fb1e7d8daed64b146b6792c74ae0d62ac4
          command:
            - python3
            - -u
            - /app/writer.py
          env:
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Root: the new filesystem's root directory is root-owned.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: f1-canary-iscsi
        - name: retained-guard
          configMap:
            name: retained-startup-guard
            defaultMode: 292
        - name: app
          configMap:
            name: f1-canary-writer
            defaultMode: 292
