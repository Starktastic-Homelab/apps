apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgadmin-ingress
  namespace: databases
  annotations:
    comment: pgAdmin trusts X-authentik-email from any sender, so only its known clients may reach it (ADR 0012)
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pgadmin4
      app.kubernetes.io/instance: pgadmin
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traefik serves pgadmin.internal through authentik-middleware, which sets X-authentik-email.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik-system
        # homepage-admin's siteMonitor polls http://pgadmin-pgadmin4.databases:80.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operations
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage-admin
              app.kubernetes.io/instance: homepage-admin
