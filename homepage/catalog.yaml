info:
  - audience: household
    logo:
      icon: /icons/favicon.svg
  # The wordmark beside the mark.
  - audience: household-only
    greeting:
      text_size: 2xl
      text: Starktastic
  - greeting:
      text_size: 2xl
      text: Starktastic Admin
  # Admin header chips: fixed-URL customapi on Alertmanager and Prometheus, 30 s. They replace the kubernetes
  # info widget, which polled the API server every 1.5 s. node_* metrics are node-exporter's.
  - customapi:
      url: http://kube-prometheus-stack-alertmanager.monitoring:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&receiver=ntfy
      icon: mdi-bell-alert
      refreshInterval: 30000
      mappings:
        - label: Alerts
          format: size
  # "Is it us or the internet?" One fixed query on the server, no credential (ADR 0018 rule 2). Braces are
  # percent-encoded: Homepage strips {...} from URLs. Proof: probe-external.yaml labels 1.1.1.1 tier=external.
  - audience: household
    customapi:
      url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query?query=min(probe_success%7Btier%3D%22external%22%7D)
      icon: mdi-earth
      refreshInterval: 60000
      mappings:
        - field: data.result.0.value.1
          label: Internet
          remap:
            - value: "1"
              to: Online
            - value: "0"
              to: Down ⚠
            - any: true
              to: Unknown
  - customapi:
      url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query?query=1%20-%20avg(rate(node_cpu_seconds_total%7Bmode%3D%22idle%22%7D[5m]))
      icon: mdi-cpu-64-bit
      refreshInterval: 30000
      mappings:
        - field: data.result.0.value.1
          label: CPU
          scale: 100
          format: percent
  - customapi:
      url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query?query=1%20-%20sum(node_memory_MemAvailable_bytes)%20%2F%20sum(node_memory_MemTotal_bytes)
      icon: mdi-memory
      refreshInterval: 30000
      mappings:
        - field: data.result.0.value.1
          label: Memory
          scale: 100
          format: percent
  - audience: household
    openmeteo:
      label: Home
      latitude: 32.08
      longitude: 34.78
      timezone: Asia/Jerusalem
      units: metric
  - audience: household
    datetime:
      text_size: xl
      locale: en-GB
      format:
        weekday: short
        day: numeric
        month: short
        hour: 2-digit
        minute: 2-digit
        hourCycle: h23
