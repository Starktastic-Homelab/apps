version: 1
metadata:
  labels:
    blueprints.goauthentik.io/instantiate: "true"
  name: Starktastic Brand

entries:
  # =============================================================
  # OVERRIDE DEFAULT FLOW TITLES
  # =============================================================

  - identifiers:
      slug: default-authentication-flow
    model: authentik_flows.flow
    state: present
    attrs:
      title: "Sign In"

  - identifiers:
      slug: default-invalidation-flow
    model: authentik_flows.flow
    state: present
    attrs:
      title: "Signed Out"

  - identifiers:
      slug: default-recovery-flow
    model: authentik_flows.flow
    state: present
    attrs:
      title: "Account Recovery"

  - identifiers:
      slug: default-user-settings-flow
    model: authentik_flows.flow
    state: present
    attrs:
      title: "Settings"

  # =============================================================
  # BRAND
  # =============================================================

  - identifiers:
      domain: starktastic.net # source: globals.yaml → global.domains.public (Kustomize-managed, cannot use Helm template)
    model: authentik_brands.brand
    state: present
    attrs:
      default: true
      branding_title: "Starktastic Services"
      branding_logo: "branding/logo.svg"
      branding_favicon: "branding/favicon.svg"
      branding_default_flow_background: "branding/background.svg"
      branding_custom_css: |
        /* Starktastic login pages: the household dashboard's glass on its aurora (ADR 0021).
           Brand CSS reaches every Authentik interface, so nothing here is set on :root. Rules on
           ak-flow-executor touch login pages only: its parts, and variables that pass down into
           the components inside it. Red is for errors. */

        ak-flow-executor {
          --st-flow: 1; /* switches on the no-hook block below */
          --st-ink: 244 246 255;
          --st-text: 226 233 250;
          --st-dim: 192 208 242;
          --st-acc: 59 130 246; /* brand blue #3B82F6 */
          --st-acc-hi: 147 197 253;
          --st-fill: 13 18 42;

          --ak-c-login--MaxWidth: 27.5rem;
          /* Authentik derives the column from the width on :root, so it is derived again here */
          --ak-c-login__main-ColumnWidth: minmax(min(100%, var(--ak-c-login--MaxWidth)), var(--ak-c-login--MaxWidth));
          --ak-c-login__main--BackgroundColor: rgb(var(--st-fill) / 0.58);
          --ak-c-login__main--Color: rgb(var(--st-text));
          --ak-c-login__main--BoxShadow:
            inset 0 1px 0 0 rgb(255 255 255 / 0.18), inset 0 0 0 1px rgb(255 255 255 / 0.08),
            0 1px 1px rgb(0 0 0 / 0.25), 0 22px 44px -22px rgb(0 0 0 / 0.75);

          /* a solid button keeps white text at 6.7:1 if the no-hook block stops matching */
          --pf-global--primary-color--100: #1D4ED8;
          --pf-global--primary-color--200: #1E40AF;
          --pf-global--link--Color: rgb(var(--st-acc-hi));
          --pf-global--link--Color--hover: #BFDBFE;
          --pf-global--Color--100: rgb(var(--st-text));
          --pf-global--Color--200: rgb(var(--st-dim));
          --pf-global--danger-color--100: #F87171;
        }

        /* brand navy under the aurora, and the aurora on phones too (Authentik shows no picture below 35rem) */
        body:has(ak-flow-executor) {
          --ak-global--background-color: #0F0F1A;
        }

        body:has(ak-flow-executor)::before {
          background-image: var(--ak-global--background-image);
        }

        ak-flow-executor::part(main) {
          border-radius: 24px;
          color: rgb(var(--st-text));
          background-image: linear-gradient(180deg, rgb(255 255 255 / 0.1) 0%, rgb(255 255 255 / 0.035) 38%, rgb(255 255 255 / 0.02) 100%);
          backdrop-filter: blur(22px) saturate(165%);
          -webkit-backdrop-filter: blur(22px) saturate(165%);
        }

        /* phones: Authentik spreads the card colour over the whole page, so the page is the glass */
        @media (max-width: 35rem) {
          ak-flow-executor::part(main) {
            border-radius: 0;
            background: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
          }
        }

        /* no-hook:start
           Authentik 2026.8.5 has no part or variable for what these rules style. They match classes inside its
           components, a route its source marks as deprecated, and only where --st-flow is set. If an upgrade or
           a browser without style queries drops them, fields and buttons keep Authentik's own shapes. */
        @container style(--st-flow: 1) {
          .pf-c-title {
            --pf-c-title--m-3xl--FontWeight: 800;
            color: rgb(var(--st-ink));
            letter-spacing: -0.02em;
            text-align: center;
          }

          /* the "required" asterisk is not an error */
          .pf-c-form__label {
            --pf-c-form__label-required--Color: rgb(var(--st-acc-hi));
          }

          .pf-c-form-control {
            min-height: 3rem;
            padding-inline: 0.875rem;
            border: 0;
            border-radius: 14px;
            color: rgb(var(--st-ink));
            background-color: rgb(255 255 255 / 0.06); /* not the shorthand: Authentik draws its error icon as a background image */
            box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12);
          }

          .pf-c-form-control[aria-invalid="true"] {
            box-shadow: inset 0 0 0 1.5px var(--pf-global--danger-color--100);
          }

          .pf-c-form-control:focus-visible,
          .pf-c-button:focus-visible {
            outline: 2px solid rgb(var(--st-acc-hi));
            outline-offset: 2px;
          }

          /* a disabled button keeps Authentik's own disabled look */
          .pf-c-button.pf-m-primary:not(:disabled, .pf-m-disabled, .pf-m-aria-disabled) {
            min-height: 3rem;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(180deg, rgb(255 255 255 / 0.22), rgb(255 255 255 / 0.05)), rgb(var(--st-acc) / 0.5);
            box-shadow: inset 0 1px 0 0 rgb(255 255 255 / 0.4), inset 0 0 0 1px rgb(255 255 255 / 0.5);
            text-shadow: 0 1px 2px rgb(0 0 0 / 0.35);
          }

          .pf-c-button.pf-m-primary:not(:disabled, .pf-m-disabled, .pf-m-aria-disabled):hover {
            filter: brightness(1.12);
          }

          .pf-c-button.pf-m-primary::after {
            border-radius: inherit;
          }
        }
        /* no-hook:end */

        /* Admin navbar logo sizing - increase from default 2.25rem */
        .pf-c-brand {
          height: 3rem !important;
          min-height: 3rem !important;
        }
      attributes:
        settings:
          theme:
            base: dark
          locale: ""
