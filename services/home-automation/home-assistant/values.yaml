controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: 2026.6.4@sha256:adb3341e31e03e0048e60d8c1cf952e118a381ae258bb921d3da12a3b27bf0c2
        resources:
          requests:
            memory: 512Mi
        env:
          PUID: null
          PGID: null
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 8123
          readiness:
            enabled: true
            type: TCP
            port: 8123
          startup:
            enabled: true
            type: TCP
            port: 8123
            spec:
              initialDelaySeconds: 10
              failureThreshold: 60
              periodSeconds: 10
      matter-server:
        image:
          repository: ghcr.io/matter-js/matterjs-server
          tag: 1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
        env:
          PRIMARY_INTERFACE: eth1
          LISTEN_ADDRESS: "127.0.0.1"
          STORAGE_PATH: /data
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                host: 127.0.0.1
                port: 5580
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 2
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                host: 127.0.0.1
                port: 5580
              failureThreshold: 30
              periodSeconds: 2
              timeoutSeconds: 2

defaultPodOptions:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    fsGroup: 0

service:
  main:
    controller: main
    ports:
      http:
        port: 8123
  lan:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/loadBalancerIPs: "{{ .Values.global.network.loadBalancers.homeAssistant }}"
    ports:
      http:
        port: 8123
      mdns:
        port: 5353
        protocol: UDP

persistence:
  config:
    enabled: false
  home-assistant-config:
    existingClaim: home-assistant-config
    advancedMounts:
      main:
        main:
          - path: /config
  matter-server-data:
    existingClaim: matter-server-data
    advancedMounts:
      main:
        matter-server:
          - path: /data
  media:
    enabled: false
