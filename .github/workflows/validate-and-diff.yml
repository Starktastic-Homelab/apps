name: Validate manifests and generate ArgoCD diff preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'foundation/**'
      - 'infrastructure/**'
      - 'services/**'
      - 'templates/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/yamllint.yaml'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: YAML Lint
        id: yamllint
        run: |
          set +e
          yamllint . > yamllint.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ]; then echo "❌ YAML Lint Failed"; else echo "✅ YAML Lint Passed"; fi
        env:
          YAMLLINT_CONFIG_FILE: .github/yamllint.yaml

      - name: Setup Kubeconform
        env:
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION: 'v0.8.0'
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Validate static manifests
        id: kubeconform
        run: |
          set +e
          find . -type f -name '*.yaml' -path '*/manifests/*' \
            -not -path '*/blueprints/*' \
            -not -path '*/manifests/templates/*' \
            -not -name 'Chart.yaml' \
            -print0 | xargs -0 kubeconform \
            -verbose -summary -ignore-missing-schemas -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' > kubeconform.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ]; then echo "❌ Kubeconform Failed"; else echo "✅ Kubeconform Passed"; fi

      - name: Check Homepage dashboard coverage
        id: homepage
        run: |
          pip install pyyaml
          set +e
          python3 scripts/check-homepage-coverage.py > homepage.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat homepage.txt
          if [ $EXIT_CODE -ne 0 ]; then echo "❌ Homepage Coverage Failed"; else echo "✅ Homepage Coverage Passed"; fi

      - name: Create validation report
        if: always()
        run: |
          echo "## Static Validation" > validation-report.md
          echo "" >> validation-report.md

          if [ "${{ steps.yamllint.outputs.exit_code }}" = "0" ]; then
            echo "✅ **YAML Lint:** Passed" >> validation-report.md
          else
            echo "❌ **YAML Lint:** FAILED" >> validation-report.md
            echo "" >> validation-report.md
            echo "<details>" >> validation-report.md
            echo "<summary>Log</summary>" >> validation-report.md
            echo "" >> validation-report.md
            echo '```' >> validation-report.md
            { cat yamllint.txt 2>/dev/null || echo "(log unavailable — step was skipped)"; } >> validation-report.md
            echo '```' >> validation-report.md
            echo "" >> validation-report.md
            echo "</details>" >> validation-report.md
          fi

          if [ "${{ steps.kubeconform.outputs.exit_code }}" = "0" ]; then
             echo "✅ **Kubeconform:** Passed" >> validation-report.md
             echo "" >> validation-report.md
             echo "<details>" >> validation-report.md
             echo "<summary>Summary</summary>" >> validation-report.md
             echo "" >> validation-report.md
             echo '```' >> validation-report.md
             { tail -n 5 kubeconform.txt 2>/dev/null || echo "(log unavailable — step was skipped)"; } >> validation-report.md
             echo '```' >> validation-report.md
             echo "" >> validation-report.md
             echo "</details>" >> validation-report.md
          else
             echo "❌ **Kubeconform:** FAILED" >> validation-report.md
             echo "" >> validation-report.md
             echo "<details>" >> validation-report.md
             echo "<summary>Log</summary>" >> validation-report.md
             echo "" >> validation-report.md
             echo '```' >> validation-report.md
             { cat kubeconform.txt 2>/dev/null || echo "(log unavailable — step was skipped)"; } >> validation-report.md
             echo '```' >> validation-report.md
             echo "" >> validation-report.md
             echo "</details>" >> validation-report.md
          fi

          if [ "${{ steps.homepage.outputs.exit_code }}" = "0" ]; then
            echo "✅ **Homepage Coverage:** Passed" >> validation-report.md
          else
            echo "❌ **Homepage Coverage:** FAILED" >> validation-report.md
            echo "" >> validation-report.md
            echo "<details>" >> validation-report.md
            echo "<summary>Log</summary>" >> validation-report.md
            echo "" >> validation-report.md
            echo '```' >> validation-report.md
            { cat homepage.txt 2>/dev/null || echo "(log unavailable — step was skipped)"; } >> validation-report.md
            echo '```' >> validation-report.md
            echo "" >> validation-report.md
            echo "</details>" >> validation-report.md
          fi

          echo "" >> validation-report.md

      - name: Upload validation report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.md
          retention-days: 1

      - name: Check status
        if: >-
          steps.yamllint.outputs.exit_code != 0 ||
          steps.yamllint.outputs.exit_code == '' ||
          steps.kubeconform.outputs.exit_code != 0 ||
          steps.kubeconform.outputs.exit_code == '' ||
          steps.homepage.outputs.exit_code != 0 ||
          steps.homepage.outputs.exit_code == ''
        run: exit 1

  diff:
    name: ArgoCD diff preview
    needs: validate
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          path: pull-request

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Generate diff
        # argocd-diff-preview spins up an ephemeral k3d cluster in Docker to
        # render real ArgoCD Application manifests, so it needs Docker access.
        # Mounting /var/run/docker.sock here is safe because this workflow uses
        # `pull_request` (not `pull_request_target`) — PR code cannot read
        # repository secrets.
        env:
          # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
          DIFF_PREVIEW_VERSION: 'v0.2.11'
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output:/output \
            -e TARGET_BRANCH=${{ github.head_ref }} \
            -e REPO=${{ github.repository }} \
            -e AUTO_DETECT_FILES_CHANGED=true \
            -e WATCH_IF_NO_WATCH_PATTERN_FOUND=false \
            -e MAX_DIFF_LENGTH=65536 \
            dagandersen/argocd-diff-preview:$DIFF_PREVIEW_VERSION

      - name: Upload diff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diff-report
          path: output/diff.md
          retention-days: 1

  report:
    name: Report status
    needs: [validate, diff]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble comment
        run: |
          touch comment.md

          if [ -f artifacts/validation-report.md ]; then
            cat artifacts/validation-report.md >> comment.md
            echo "" >> comment.md
            echo "---" >> comment.md
            echo "" >> comment.md
          fi

          if [ -f artifacts/diff.md ]; then
            cat artifacts/diff.md >> comment.md
          fi

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: ci-report
          path: comment.md
