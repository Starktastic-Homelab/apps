controllers:
  main:
    containers:
      main:
        image:
          repository: zimengxiong/excalidash-frontend
          tag: 0.6.5@sha256:333a3f24bd599f69ebb3494e0393b6882f2f031fc0f05d02b0ede53ce7a743e0
        env:
          BACKEND_URL: "localhost:8000"
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 80
            path: /
          readiness:
            enabled: true
            type: HTTP
            port: 80
            path: /
          startup:
            enabled: true
            type: TCP
            port: 80
            spec:
              failureThreshold: 30
              periodSeconds: 5
      backend:
        image:
          repository: zimengxiong/excalidash-backend
          tag: 0.6.5@sha256:29937c62fbed5f4d417398c21c7ab261965231427bd5ae3c64f8d365fe2c02a3
        env:
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: excalidash-database
                key: database-url
          PORT: "8000"
          NODE_ENV: "production"
          AUTH_MODE: "oidc_enforced"
          TRUST_PROXY: "1"
          FRONTEND_URL: "https://excalidash.starktastic.net"
          UPDATE_CHECK_OUTBOUND: "false"
          # Authentik OIDC
          OIDC_PROVIDER_NAME: "authentik"
          OIDC_ISSUER_URL: "https://auth.starktastic.net/application/o/excalidash/"
          OIDC_REDIRECT_URI: "https://excalidash.starktastic.net/api/auth/oidc/callback"
          OIDC_SCOPES: "openid profile email"
          OIDC_REQUIRE_EMAIL_VERIFIED: "false"
          DATABASE_PROVIDER: postgresql
          JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: excalidash-retained-identity
                key: jwt-secret
          CSRF_SECRET:
            valueFrom:
              secretKeyRef:
                name: excalidash-retained-identity
                key: csrf-secret
        envFrom:
          - secretRef:
              name: excalidash-secret
        probes:
          # Match the HTTPS context normally supplied by the trusted ingress.
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8000
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8000
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
          startup:
            enabled: true
            type: TCP
            port: 8000
            spec:
              failureThreshold: 30
              periodSeconds: 5

    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
    serviceAccount:
      name: pg-enrollment-79675ba459da9b1e17ec
    initContainers:
      postgres-enrollment-acceptance:
        command:
          - python3
          - -B
          - /gate/completion_gate.py
        args:
          - --id
          - excalidash
          - --database
          - excalidash
          - --role
          - excalidash
        securityContext: &id001
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
      retained-database:
        command:
          - /bin/sh
          - -ec
          - |
            export PGPASSWORD="$(cat /credentials/password)"
            exec psql -XqAt -v ON_ERROR_STOP=1 -f /retained-database/main.sql >/dev/null 2>&1
        env:
          - name: PGHOST
            value: postgres-postgresql.databases
          - name: PGPORT
            value: "5432"
          - name: PGUSER
            value: excalidash
          - name: PGDATABASE
            value: excalidash
          - name: PGCONNECT_TIMEOUT
            value: "10"
        securityContext: *id001
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        image:
          repository: postgres:18.6-alpine
          digest: sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        dependsOn: postgres-enrollment-acceptance
service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  config:
    enabled: false
  data:
    existingClaim: excalidash-data
    advancedMounts:
      main:
        backend:
          - path: /app/prisma
    enabled: false
  prisma-runtime:
    type: emptyDir
    globalMounts: []
    advancedMounts:
      main:
        backend:
          - path: /app/prisma
  pg-completion-script:
    type: configMap
    name: pg-enrollment-79675ba459da9b1e17ec
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        postgres-enrollment-acceptance:
          - path: /gate
            readOnly: true
  pg-completion-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    globalMounts: []
    advancedMounts:
      main:
        postgres-enrollment-acceptance:
          - path: /gate-api
            readOnly: true
  pg-completion-password:
    type: secret
    name: excalidash-database
    defaultMode: 292
    items:
      - key: password
        path: password
    globalMounts: []
    advancedMounts:
      main:
        retained-database:
          - path: /credentials
            readOnly: true
  retained-database:
    type: configMap
    name: excalidash-retained-database-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-database:
          - path: /retained-database
            readOnly: true
