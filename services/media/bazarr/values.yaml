controllers:
  main:
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.6.1-ls364@sha256:d24bd0048c759a468970989e9df11a6b96a7628d556d00f923e60a35ba59237b
        envFrom:
          - secretRef:
              name: bazarr-secret
        probes:
          liveness:
            spec:
              httpGet:
                port: 6767
          readiness:
            spec:
              httpGet:
                port: 6767
          startup:
            spec:
              httpGet:
                port: 6767
        env:
          POSTGRES_ENABLED: "true"
          POSTGRES_HOST: postgres-postgresql.databases
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: bazarr
          POSTGRES_USERNAME: bazarr
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: bazarr-postgres-secret
                key: password
    replicas: 1
    strategy: Recreate
    serviceAccount:
      name: bazarr-postgres-completion
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.6.1-ls364@sha256:d24bd0048c759a468970989e9df11a6b96a7628d556d00f923e60a35ba59237b
        command:
          - /lsiopy/bin/python3
          - -I
          - -B
          - /retained-startup/guard.py
          - /config
        env:
          POSTGRES_ENABLED: "true"
          POSTGRES_HOST: postgres-postgresql.databases
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: bazarr
          POSTGRES_USERNAME: bazarr
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: bazarr-postgres-secret
                key: password
        envFrom:
          - secretRef:
              name: bazarr-secret
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      enrollment:
        command:
          - python3
          - -B
          - /gate/completion_gate.py
        args:
          - --id
          - bazarr
          - --database
          - bazarr
          - --role
          - bazarr
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        dependsOn: retained-state
      database:
        command:
          - /bin/sh
          - -ec
          - export PGPASSWORD="$(cat /credentials/password)"; exec psql -XqAt -v ON_ERROR_STOP=1 -f
            /retained-startup/main.sql >/dev/null 2>&1
        env:
          - name: PGHOST
            value: postgres-postgresql.databases
          - name: PGPORT
            value: "5432"
          - name: PGUSER
            value: bazarr
          - name: PGDATABASE
            value: bazarr
          - name: PGCONNECT_TIMEOUT
            value: "10"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        image:
          repository: postgres:18.6-alpine
          digest: sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        dependsOn: enrollment
service:
  main:
    ports:
      http:
        port: 6767
persistence:
  scripts:
    type: configMap
    name: bazarr-scripts
    defaultMode: 493
    globalMounts:
      - path: /scripts
  pg-completion-script:
    type: configMap
    name: bazarr-postgres-completion
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate
            readOnly: true
  pg-completion-api:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 292
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    globalMounts: []
    advancedMounts:
      main:
        enrollment:
          - path: /gate-api
            readOnly: true
  pg-completion-password:
    type: secret
    name: bazarr-postgres-secret
    defaultMode: 292
    items:
      - key: password
        path: password
    globalMounts: []
    advancedMounts:
      main:
        database:
          - path: /credentials
            readOnly: true
  config:
    enabled: false
  bazarr-config:
    existingClaim: bazarr-files
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /config
            readOnly: true
  retained-startup:
    type: configMap
    name: bazarr-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
        database:
          - path: /retained-startup
            readOnly: true
