        description: Blue = TV · Red = Movies
    widgets:
      - audience: household-only
        type: calendar
        view: monthly
        maxEvents: 10
        showTime: true
        firstDayInWeek: sunday
        integrations:
          - type: ical
            url: "http://sonarr.media:8989/feed/v3/calendar/Sonarr.ics?apikey={{HOMEPAGE_VAR_SONARR_KEY}}"
            name: TV
            color: blue
          - type: ical
            url: "http://radarr.media:7878/feed/v3/calendar/Radarr.ics?apikey={{HOMEPAGE_VAR_RADARR_KEY}}"
            name: Movies
            color: red
      - type: calendar
        view: monthly
        maxEvents: 15
        showTime: true
        firstDayInWeek: sunday
        integrations:
          - ref: sonarr
            color: blue
          - ref: sonarr-ru
            color: sky
          - ref: radarr
            color: red
          - ref: radarr-ru
            color: rose
          - ref: lidarr
