---
apiVersion: v1
kind: Service
metadata:
  name: ak-outpost-internal-gate
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-outpost-proxy
    app.kubernetes.io/instance: ak-outpost-internal-gate
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik-outpost-proxy
    app.kubernetes.io/instance: ak-outpost-internal-gate
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: http-metrics
      port: 9300
      targetPort: 9300
      protocol: TCP
