  custom.css: |
    /* ==========================================================================
       "Liquid glass": the part both pages share. The generator prepends this file to each page's custom.css,
       which sets the --d1-* identity tokens used below.
       Hook rule (ADR 0020): Homepage's ids, its named classes, its data and ARIA attributes, tile ids, and
       elements under those. Selectors that need page structure live in the no-hook block at the end.
       ========================================================================== */

    /* ---------- Tokens: first paint (:root) and after hydration (html:root beats .theme-* and .dark) ---------- */
    :root,
    html:root {
      --bg-color: 15 15 26; /* brand navy #0F0F1A */
      --d1-ink: 244 246 255;
      --d1-good: 52 211 153;
      --d1-warn: 251 191 36;
      --d1-danger: 248 113 113;
      --d1-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      --d1-sheen: linear-gradient(180deg, rgb(255 255 255 / 0.1) 0%, rgb(255 255 255 / 0.035) 38%, rgb(255 255 255 / 0.02) 100%);
      --d1-depth: 0 1px 1px rgb(0 0 0 / 0.25), 0 22px 44px -22px rgb(0 0 0 / 0.75);
      /* Manrope weights inside widgets: font-thin/light text is unreadable on glass */
      --font-weight-thin: 500;
      --font-weight-light: 500;
    }

    html,
    body {
      background-color: rgb(15 15 26);
    }

    /* ---------- Backdrop: grain over the aurora (kills gradient banding) ---------- */
    #background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("/images/grain.svg");
      opacity: 0.07;
      mix-blend-mode: overlay;
    }

    /* ---------- Glass card ---------- */
    .service-card {
      --radius-sm: 11px; /* list rows, calendar events */
      --color-900: 96 110 168; /* in-card strips (bg-theme-900/20) turn into faint glass instead of black */
      color: rgb(var(--color-200));
      font-weight: 600;
      overflow-wrap: break-word; /* long tokens break only when they would overflow; never shrinks short words */
      padding: 7px;
      margin-bottom: var(--d1-gap, 14px);
      border-radius: var(--d1-radius);
      background: var(--d1-sheen), rgb(var(--d1-fill) / var(--d1-fill-a, 0.42));
      backdrop-filter: blur(var(--d1-blur, 22px)) saturate(var(--d1-sat, 165%));
      -webkit-backdrop-filter: blur(var(--d1-blur, 22px)) saturate(var(--d1-sat, 165%));
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        var(--d1-depth);
      transition:
        background-color 0.25s var(--d1-ease),
        box-shadow 0.25s var(--d1-ease);
    }

    /* breathing room between groups */
    #layout-groups > * {
      min-width: 0; /* a 50-character release name wraps inside its group instead of widening it past the screen */
      padding-bottom: var(--d1-group-gap, 16px);
    }

    /* 1 px light-catching rim: bright top edge fading down, a tint at the foot (the page accent unless --d1-rim is set) */
    .service-card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(
        168deg,
        rgb(255 255 255 / 0.5) 0%,
        rgb(255 255 255 / 0.12) 22%,
        rgb(255 255 255 / 0.05) 55%,
        rgb(var(--d1-rim, var(--d1-acc-hi)) / 0.28) 100%
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask:
        linear-gradient(#000 0 0) content-box exclude,
        linear-gradient(#000 0 0);
      pointer-events: none;
    }

    .service-card:hover {
      background: var(--d1-sheen), var(--d1-sheen), rgb(var(--d1-fill) / var(--d1-fill-a, 0.42));
    }

    .service-icon img {
      filter: drop-shadow(0 3px 8px rgb(0 0 0 / 0.45));
    }

    .service-description {
      color: rgb(var(--color-300));
      line-height: 1.4;
      margin-top: 1px;
    }

    .service-card a:focus-visible,
    #myTab [role="tab"]:focus-visible {
      outline: 2px solid rgb(var(--d1-acc-hi));
      outline-offset: 2px;
      border-radius: 12px;
    }

    /* ---------- Blocks: value / label chips ---------- */
    /* a block row wraps only when its values cannot fit (an IP address on a phone), instead of widening the card */
    .service-container {
      flex-wrap: wrap;
    }

    .service-block {
      margin: 3px;
      padding: 10px 4px 9px;
      border-radius: calc(var(--d1-radius) - 10px);
      background: rgb(255 255 255 / 0.05);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06);
    }

    .service-block-value {
      color: rgb(var(--d1-ink));
      font-size: var(--d1-value-size, 16px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .service-block-label {
      margin-top: 3px;
      font-family: Manrope, "Manrope-Fallback", Arial, sans-serif; /* plexData keeps numbers mono, labels stay sans */
      font-size-adjust: none;
      color: rgb(var(--color-300));
      opacity: 1;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* ---------- Group headers: small caps label with a light rule ---------- */
    .service-group-name,
    .bookmark-group-name {
      display: flex; /* bookmark group headings are not flex upstream */
      flex: 1 1 auto;
      align-items: center;
      text-align: left;
      gap: 12px;
      color: rgb(var(--d1-label, var(--d1-acc-hi)));
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgb(var(--d1-acc) / 0.55);
    }

    .service-group-name::after,
    .bookmark-group-name::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: linear-gradient(90deg, rgb(var(--d1-acc-hi) / 0.45), rgb(var(--d1-acc-hi) / 0));
    }

    /* ---------- Tabs: a glass segmented control ---------- */
    #myTab {
      display: flex;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.5);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        var(--d1-depth);
    }

    #myTab [role="presentation"] {
      flex: 1 1 0;
      height: auto;
    }

    #myTab [role="tab"] {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      margin: 0;
      border-radius: 999px;
      color: rgb(var(--color-300));
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition:
        color 0.2s var(--d1-ease),
        background-color 0.2s var(--d1-ease),
        box-shadow 0.2s var(--d1-ease);
    }

    #myTab [role="tab"]:hover {
      color: rgb(var(--d1-ink));
      background: rgb(255 255 255 / 0.06);
    }

    #myTab [role="tab"][aria-selected="true"] {
      color: #fff;
      background:
        linear-gradient(180deg, rgb(255 255 255 / 0.22), rgb(255 255 255 / 0.05)),
        rgb(var(--d1-acc) / 0.5);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.4),
        inset 0 0 0 1px rgb(255 255 255 / 0.5), /* a light rim marks the selected tab at 3:1 or more */
        0 8px 22px -8px rgb(var(--d1-acc) / 0.9);
      text-shadow: 0 1px 2px rgb(0 0 0 / 0.35);
    }

    /* tab glyphs: a drawn mask per tab id (each page sets --d1-glyph), painted in the tab's text colour */
    #myTab [role="tab"]::before {
      content: "";
      width: 18px;
      height: 18px;
      flex: none;
      background: currentColor;
      -webkit-mask: var(--d1-glyph) center / contain no-repeat;
      mask: var(--d1-glyph) center / contain no-repeat;
    }

    /* ---------- Header widgets: glass chips ---------- */
    #information-widgets :is(.information-widget-logo, .information-widget-greeting, .information-widget-customapi, .information-widget-openmeteo, .information-widget-datetime) {
      color: rgb(var(--color-200));
    }

    .information-widget-customapi,
    .information-widget-openmeteo,
    .information-widget-datetime {
      margin: 0;
      border-radius: 18px;
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.45);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        var(--d1-depth);
    }

    .information-widget-customapi span {
      color: rgb(var(--color-300));
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .information-widget-greeting span {
      margin: 0;
      background: linear-gradient(100deg, #fff 0%, rgb(var(--d1-acc-hi)) 55%, rgb(var(--d1-acc-2)) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .information-widget-logo img {
      filter: drop-shadow(0 6px 16px rgb(var(--d1-acc) / 0.55));
    }

    /* ---------- Bookmarks: glass rows, 48 px tall ---------- */
    .bookmark > a {
      --radius-md: 14px;
      --color-900: 96 110 168; /* the abbreviation tile (bg-theme-900/50) becomes tinted glass */
      --text-xs: 0.8125rem;
      overflow: hidden;
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.42);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.14),
        inset 0 0 0 1px rgb(255 255 255 / 0.07),
        var(--d1-depth);
    }

    .bookmark-icon,
    .bookmark-text {
      min-height: 48px;
    }

    .bookmark > a:hover {
      background: var(--d1-sheen), var(--d1-sheen), rgb(var(--d1-fill) / 0.42);
    }

    /* ---------- Footer: the refresh control as a 44 px glass button ---------- */
    #footer svg {
      box-sizing: content-box;
      padding: 10px;
      border-radius: 999px;
      color: rgb(var(--color-300));
      background: rgb(var(--d1-fill) / 0.45);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
    }

    /* ---------- Motion: nothing moves when motion is unwelcome ---------- */
    @media (prefers-reduced-motion: reduce) {
      #layout-groups *,
      #information-widgets *,
      #myTab * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* no-hook:start */
    /* Homepage v2.7.0 has no class, id or attribute for what these rules style. If an upgrade changes the markup
       they stop matching, the damage is cosmetic, and the render check fails on them. */

    /* group panels stop clipping card shadows and glows (safe: both pages set disableCollapse, so no height animation) */
    .services-group div:has(> ul > li) {
      overflow: visible;
    }

    /* header chip: the value under its label */
    .information-widget-customapi span + span {
      color: rgb(var(--d1-ink));
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    /* calendar agenda: a title fills its row up to the done mark and ends in an ellipsis (upstream clips it at 70 %) */
    #calendar .service-card span + div {
      flex: 1 1 0;
      min-width: 0;
      width: 0 !important; /* overrides the inline width: 70%; zero basis + grow, so long titles never widen the card */
      padding-right: 6px;
    }

    #calendar .service-card span + div > div {
      position: static;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* the one search, at every width: the quicklaunch button (the element right before #information-widgets,
       which Homepage shows on phones only) as a glass disc in the corner. It finds apps first, then the web. */
    #inner_wrapper button:has(+ #information-widgets) {
      right: 14px;
      bottom: 16px;
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      cursor: pointer;
      color: rgb(var(--d1-ink));
      background: var(--d1-sheen), rgb(var(--d1-fill) / 0.72);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.2),
        inset 0 0 0 1px rgb(255 255 255 / 0.1),
        var(--d1-depth);
    }

    #inner_wrapper button:has(+ #information-widgets):focus-visible {
      outline: 2px solid rgb(var(--d1-acc-hi));
      outline-offset: 2px;
    }

    #inner_wrapper button:has(+ #information-widgets) svg {
      width: 22px;
      height: 22px;
    }
    /* no-hook:end */
    /* ==========================================================================
       Admin layer: violet on navy, desktop-first ("calm, glassy control room").
       Violet is identity only: the mark, the wordmark and the selected tab. On the board red means trouble and
       nothing else (ADR 0020), so icons are silver, group dashes and card rims steel, and no calendar dot is red.
       ========================================================================== */
    :root,
    html:root {
      --color-50: 250 250 252;
      --color-100: 238 239 245;
      --color-200: 230 232 241;
      --color-300: 178 183 203;
      --color-400: 160 166 190; /* secondary text (list ages, theme-400) clears 4.5:1 on glass */
      --color-500: 90 95 120;
      --color-600: 60 64 86;
      --color-700: 38 40 58;
      --color-800: 15 15 26;
      --color-900: 9 9 16;
      --color-logo-start: 241 241 247; /* mdi and si glyphs: silver to steel, so no icon reads as an alarm */
      --color-logo-stop: 150 156 182;
      --d1-acc: 124 58 237; /* violet, Tailwind violet-600 */
      --d1-acc-hi: 196 181 253;
      --d1-acc-2: 167 139 250;
      --d1-rim: 178 183 203; /* card rims end in steel, not the accent */
      --d1-label: 178 183 203; /* group labels: calm silver */
      --d1-fill: 17 17 30;
      --d1-radius: 18px;
      --d1-gap: 12px;
      --d1-value-size: 15px;
    }

    /* the animated aurora only when motion is welcome and the screen is wide */
    @media (prefers-reduced-motion: no-preference) and (min-width: 1024px) {
      #background {
        background-image: url("/images/aurora-live.svg") !important;
      }
    }

    #Pulse-tab { --d1-glyph: url("/images/glyph-pulse.svg"); }
    #Media-tab { --d1-glyph: url("/images/glyph-media.svg"); }
    #Pipeline-tab { --d1-glyph: url("/images/glyph-pipeline.svg"); }
    #Apps-tab { --d1-glyph: url("/images/glyph-tools.svg"); }
    #Platform-tab { --d1-glyph: url("/images/glyph-platform.svg"); }
    #Iron-tab { --d1-glyph: url("/images/glyph-iron.svg"); }

    /* group labels: a short steel dash before them (a round dot would read as a status light) */
    .service-group-name,
    .bookmark-group-name {
      text-shadow: none;
    }

    .service-group-name::before,
    .bookmark-group-name::before {
      content: "";
      width: 12px;
      height: 2px;
      flex: none;
      border-radius: 1px;
      background: rgb(var(--color-400));
    }

    .service-group-name::after,
    .bookmark-group-name::after {
      background: linear-gradient(90deg, rgb(var(--color-300) / 0.35), rgb(var(--color-300) / 0));
    }

    /* equal-height tiles (the board's rows end level): a tile stretches to its grid row and the card fills it */
    #layout-groups .service {
      display: flex;
      flex-direction: column;
    }

    #layout-groups .service > .service-card {
      flex: 1 1 auto;
    }

    /* ---------- Header: one command line of glass instruments ---------- */
    #widgets-wrap,
    #information-widgets-right {
      display: contents;
    }

    #information-widgets {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 22px 28px 0;
    }

    .information-widget-logo,
    .information-widget-greeting {
      margin: 0;
      padding: 0;
      background: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .information-widget-logo div {
      margin: 0;
    }

    .information-widget-logo img {
      width: 44px !important; /* Next/Image sets 48 px inline */
      height: 44px !important;
    }

    .information-widget-greeting {
      margin-right: 8px;
    }

    .information-widget-greeting span {
      font-size: 20px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .information-widget-customapi,
    .information-widget-openmeteo,
    .information-widget-datetime {
      height: 50px;
      padding: 0 16px 0 12px;
      border-radius: 16px;
    }

    .information-widget-datetime {
      padding: 0 18px;
    }

    .information-widget-openmeteo {
      margin-left: auto; /* weather and date keep the right edge */
    }

    .information-widget-openmeteo svg {
      width: 30px;
      height: 30px;
    }

    .information-widget-datetime span {
      color: rgb(var(--d1-ink));
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    #tabs {
      position: relative; /* anchors the alarm annunciator */
      margin: 18px 28px 0;
    }

    #layout-groups {
      margin: 24px 24px 0;
    }

    /* ---------- Highlights: good, warn and danger blocks ---------- */
    .service-block[data-highlight-level="good"] {
      background: rgb(var(--d1-good) / 0.12);
      box-shadow: inset 0 0 0 1px rgb(var(--d1-good) / 0.75);
    }

    .service-block[data-highlight-level="warn"] {
      background: rgb(var(--d1-warn) / 0.13);
      box-shadow: inset 0 0 0 1px rgb(var(--d1-warn) / 0.75);
    }

    .service-block[data-highlight-level="danger"] {
      background: linear-gradient(180deg, rgb(239 68 68 / 0.3), rgb(220 38 38 / 0.16));
      box-shadow:
        inset 0 0 0 1px rgb(var(--d1-danger) / 0.9),
        0 0 22px -6px rgb(239 68 68 / 0.7);
    }

    .service-block[data-highlight-level="good"] .service-block-value { color: rgb(110 231 183); }
    .service-block[data-highlight-level="warn"] .service-block-value { color: rgb(253 224 71); }
    .service-block[data-highlight-level="danger"] .service-block-value { color: rgb(254 202 202); }
    .service-block[data-highlight-level] .service-block-label { color: rgb(var(--d1-ink) / 0.85); }

    /* ---------- Alarm mode: only while a danger block is on screen ---------- */
    /* the card in danger: a red rim and glow, and first in its group */
    .service-card:has(.service-block[data-highlight-level="danger"]) {
      box-shadow:
        inset 0 1px 0 0 rgb(255 255 255 / 0.16),
        0 0 0 1px rgb(var(--d1-danger) / 0.45),
        0 0 36px -10px rgb(239 68 68 / 0.65),
        var(--d1-depth);
    }

    #layout-groups .service:has(.service-block[data-highlight-level="danger"]) {
      order: -1;
    }

    /* the page edge: a red tint that pulses for about ten seconds, then holds (a standing alarm must not become wallpaper) */
    #inner_wrapper:has(.service-block[data-highlight-level="danger"])::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px rgb(var(--d1-danger) / 0.55),
        inset 0 0 70px rgb(239 68 68 / 0.2),
        inset 0 0 220px rgb(239 68 68 / 0.09);
      animation: d1-alarm 2.6s ease-in-out 4;
    }

    #inner_wrapper:has(.service-block[data-highlight-level="danger"])::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 61;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgb(var(--d1-danger)) 20%, rgb(var(--d1-danger)) 80%, transparent);
    }

    /* the annunciator says it in words, for the tab in view only (Homepage unmounts the other tabs) */
    #inner_wrapper:has(.service-block[data-highlight-level="danger"]) #tabs::after {
      content: "\25B2  Alarm on this tab";
      position: absolute;
      right: 22px;
      top: -11px;
      padding: 3px 11px;
      border-radius: 999px;
      color: rgb(255 228 230);
      background: rgb(127 29 29 / 0.94);
      box-shadow:
        0 0 0 1px rgb(var(--d1-danger) / 0.9),
        0 0 18px rgb(239 68 68 / 0.55);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes d1-alarm {
      50% {
        opacity: 0.35;
      }
    }

    /* widget errors stay legible on glass (upstream paints theme-900 text on rose-900): crimson glass summary, dark log */
    .service-card details > summary {
      color: rgb(var(--d1-ink));
      background: rgb(239 68 68 / 0.24);
      box-shadow: inset 0 0 0 1px rgb(var(--d1-danger) / 0.5);
      border-radius: calc(var(--d1-radius) - 10px);
    }

    .service-card details > div {
      color: rgb(254 202 202);
      background: rgb(0 0 0 / 0.45);
      border-radius: calc(var(--d1-radius) - 10px);
    }

    .service-card details span {
      color: rgb(var(--d1-ink));
    }

    /* ---------- Content fixes ---------- */
    /* Markets: one notch more spacing fits "-2.00%" in Plex Mono. The stock widget draws falls in rose and the
       closed-market badge in red; here red means trouble, so both turn neutral and the minus sign carries the fall. */
    #markets > .service-card {
      --spacing: 0.3rem;
      --color-red-400: #fff;
      --color-rose-300: rgb(178 183 203);
    }

    /* ---------- Phone (not the target, kept tidy): a 4-column header grid and a 3 x 2 tab control ---------- */
    @media (max-width: 639px) {
      #information-widgets {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 18px 14px 0;
      }

      .information-widget-logo { grid-column: 1; }
      .information-widget-greeting { grid-column: 2 / -1; justify-self: start; margin: 0; }
      .information-widget-customapi { grid-column: span 2; }
      .information-widget-openmeteo { grid-column: 1 / span 2; margin: 0; }
      .information-widget-datetime { grid-column: 3 / -1; padding: 0 12px; }

      .information-widget-datetime span {
        font-size: 13px;
        white-space: normal; /* date over time when the chip is narrow */
      }

      #tabs {
        margin: 16px 14px 0;
      }

      #myTab {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-radius: 26px;
      }

      #layout-groups {
        margin: 20px 10px 0;
      }
    }

    /* ---------- Boards (desktop): every tab is a grid; a group is placed by a tile it holds ---------- */
    @media (min-width: 1280px) {
      #layout-groups {
        display: grid;
        grid-template-columns: repeat(var(--d1-cols, 4), minmax(0, 1fr));
        grid-template-rows: auto 1fr;
        grid-auto-flow: row dense;
        align-items: start;
        column-gap: 20px;
      }

      /* Pulse: alerts beside health, what is playing and the outside world below, the calendar as a rail beside them */
      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups {
        --d1-cols: 12;
        grid-template-rows: auto auto 1fr;
      }

      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups > .services-group:has(#alerts) { grid-column: 1 / span 6; grid-row: 1; }
      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups > .services-group:has(#cluster) { grid-column: 7 / span 6; grid-row: 1; }
      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups > .services-group:has(#streaming-now) { grid-column: 1 / span 8; grid-row: 2; }
      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups > .services-group:has(#calendar) { grid-column: 9 / span 4; grid-row: 2 / span 2; }
      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups > .services-group:has(#markets) { grid-column: 1 / span 8; grid-row: 3; }

      /* Needs Attention and Now Playing stack their tiles, so every alert name and every "title (viewer)" line fits */
      #inner_wrapper:has(#Pulse-tab[aria-selected="true"]) #layout-groups > .services-group:is(:has(#alerts), :has(#streaming-now)) ul:has(> .service) {
        grid-template-columns: minmax(0, 1fr);
      }

      /* Media: Watch is a two-column panel with Jellyfin across its top; Listen over Requests, Photos over Read */
      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups > .services-group:has(#jellyfin) { grid-column: 1 / span 2; grid-row: 1 / span 2; }
      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups > .services-group:has(#navidrome) { grid-column: 3; grid-row: 1; }
      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups > .services-group:has(#seerr) { grid-column: 3; grid-row: 2; }
      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups > .services-group:has(#immich) { grid-column: 4; grid-row: 1; }
      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups > .services-group:has(#calibre-web) { grid-column: 4; grid-row: 2; }

      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups > .services-group:has(#jellyfin) ul:has(> .service) {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 12px;
        align-items: start;
      }

      #inner_wrapper:has(#Media-tab[aria-selected="true"]) #layout-groups #jellyfin { grid-column: 1 / -1; }

      /* Pipeline: Acquire and Download are two-column panels on top, Index and Subtitles below */
      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups { grid-template-rows: auto auto; }
      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups > .services-group:has(#sonarr) { grid-column: 1 / span 2; grid-row: 1; }
      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups > .services-group:has(#qbittorrent) { grid-column: 3 / span 2; grid-row: 1; }
      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups > .services-group:has(#prowlarr) { grid-column: 1 / span 2; grid-row: 2; }
      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups > .services-group:has(#bazarr) { grid-column: 3 / span 2; grid-row: 2; }

      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups ul:has(> .service) {
        display: block;
        columns: 2;
        column-gap: 12px;
      }

      #inner_wrapper:has(#Pipeline-tab[aria-selected="true"]) #layout-groups .service { break-inside: avoid; }

      /* Platform: Ship runs both rows; Core sits under Edge, the Code bookmarks under Guard and Observe */
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups { grid-template-rows: auto auto; }
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups > .services-group:has(#argo-cd) { grid-column: 1; grid-row: 1 / span 2; }
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups > .services-group:has(#traefik) { grid-column: 2; grid-row: 1; }
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups > .services-group:has(#authentik) { grid-column: 3; grid-row: 1; }
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups > .services-group:has(#grafana) { grid-column: 4; grid-row: 1; }
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups > .services-group:has(#pgadmin) { grid-column: 2; grid-row: 2; }
      #inner_wrapper:has(#Platform-tab[aria-selected="true"]) #layout-groups > :not(.services-group) { grid-column: 3 / span 2; grid-row: 2; }

      /* Apps: Find & Keep takes the last column for both rows; Home spans two columns under Convert and Documents */
      #inner_wrapper:has(#Apps-tab[aria-selected="true"]) #layout-groups > .services-group:has(#excalidash) { grid-column: 1; grid-row: 1; }
      #inner_wrapper:has(#Apps-tab[aria-selected="true"]) #layout-groups > .services-group:has(#convertx) { grid-column: 2; grid-row: 1; }
      #inner_wrapper:has(#Apps-tab[aria-selected="true"]) #layout-groups > .services-group:has(#paperless-ngx) { grid-column: 3; grid-row: 1; }
      #inner_wrapper:has(#Apps-tab[aria-selected="true"]) #layout-groups > .services-group:has(#searxng) { grid-column: 4; grid-row: 1 / span 2; }
      #inner_wrapper:has(#Apps-tab[aria-selected="true"]) #layout-groups > .services-group:has(#pairdrop) { grid-column: 1; grid-row: 2; }
      #inner_wrapper:has(#Apps-tab[aria-selected="true"]) #layout-groups > .services-group:has(#home-assistant) { grid-column: 2 / span 2; grid-row: 2; }

      /* Iron: Compute is a two-column panel; Network and Storage run full height */
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > .services-group:has(#proxmox-ve) { grid-column: 1 / span 2; grid-row: 1; }
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > .services-group:has(#opnsense) { grid-column: 3; grid-row: 1 / span 2; }
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > .services-group:has(#truenas) { grid-column: 4; grid-row: 1 / span 2; }

      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > .services-group:has(#proxmox-ve) ul:has(> .service) {
        display: block;
        columns: 2;
        column-gap: 12px;
      }

      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > .services-group:has(#proxmox-ve) .service { break-inside: avoid; }
    }

    @media (min-width: 1280px) and (max-width: 1799px) {
      /* Iron: the two bookmark groups sit side by side under Compute */
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > :not(.services-group) { grid-row: 2; }
    }

    @media (min-width: 1800px) {
      /* Iron: a fifth column takes the bookmarks, so Compute runs both rows */
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups { --d1-cols: 5; }
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > .services-group:has(#proxmox-ve) { grid-row: 1 / span 2; }
      #inner_wrapper:has(#Iron-tab[aria-selected="true"]) #layout-groups > :not(.services-group) { grid-column: 5; }
    }

    /* no-hook:start */
    /* List rows (a name and one value) have no class of their own. A gutter between the name and its value; the
       value stays on one line and the name wraps. :not() skips the wrappers that hold rows. */
    .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child) {
      column-gap: 12px;
    }

    .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child):not(:has(div div div)) > div:first-child {
      min-width: 0;
    }

    .service-card :is(a, div):has(> div:first-child + div:last-child > div:only-child):not(:has(div div div)) > div:last-child {
      flex: none;
      white-space: nowrap;
    }
    /* no-hook:end */
