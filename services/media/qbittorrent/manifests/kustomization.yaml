apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: qbittorrent-retained-startup-guard
    namespace: media
    files:
      - guard.py=retained-startup/guard.py
