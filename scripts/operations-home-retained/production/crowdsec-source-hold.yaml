apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: crowdsec-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: held-source
      expression:
        has(object.spec.volumes) && object.spec.volumes.exists(v, (object.metadata.namespace == "crowdsec" &&
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ["crowdsec-db-pvc"]) || (has(v.nfs) &&
        (v.nfs.path == "/mnt/apps/pv/crowdsec/crowdsec-db-pvc" ||
        v.nfs.path.startsWith("/mnt/apps/pv/crowdsec/crowdsec-db-pvc/"))))
  validations:
    - expression: "false"
      message: Preserved crowdsec NFS state is retired; recovery acceptance is required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: crowdsec-source-hold
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: crowdsec-source-hold
  validationActions:
    - Deny
