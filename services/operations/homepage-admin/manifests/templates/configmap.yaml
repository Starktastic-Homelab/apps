  services.yaml: |
    - Needs Attention:
      - Alerts:
          id: alerts
          icon: mdi-bell-alert
          href: https://grafana.internal.starktastic.net/alerting/list
          description: Firing and unsilenced, routed to ntfy
          app: prometheus
          namespace: monitoring
          widgets:
          - type: customapi
            url: http://kube-prometheus-stack-alertmanager.monitoring:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&receiver=ntfy
            refreshInterval: 30000
            display: dynamic-list
            mappings:
              name: labels.alertname
              label: startsAt
              format: relativeDate
              limit: 6
              target: https://grafana.internal.starktastic.net/alerting/groups?alertmanager=alertmanager
          - type: customapi
            url: http://kube-prometheus-stack-alertmanager.monitoring:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&receiver=ntfy&filter=severity%3D%22critical%22
            refreshInterval: 30000
            mappings:
            - label: Critical
              format: size
            highlight:
              Critical:
                numeric:
                - level: danger
                  when: gt
                  value: 0
          - type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Firing
              query: count(ALERTS{alertstate="firing",alertname!~"Watchdog|InfoInhibitor|KubePodNotReady|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeContainerWaiting|CPUThrottlingHigh|KubeHpaReplicasMismatch"}) or vector(0)
            - label: Rules Alive
              query: count(ALERTS{alertname="Watchdog",alertstate="firing"}) or vector(0)
            - label: Notify Fails 24h
              query: sum(increase(alertmanager_notifications_failed_total{integration="webhook"}[24h])) or vector(0)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Silences
              query: sum(alertmanager_silences{state="active"}) or vector(0)
            highlight:
              Firing:
                numeric:
                - level: warn
                  when: gt
                  value: 0
              Rules Alive:
                numeric:
                - level: danger
                  when: eq
                  value: 0
              Notify Fails 24h:
                numeric:
                - level: warn
                  when: gt
                  value: 0
      - Notifications:
          id: notifications
          icon: ntfy.png
          description: Latest push on the alerts topic
          href: https://ntfy.starktastic.net
          siteMonitor: http://ntfy.operations:80
          namespace: operations
          app: ntfy
          widget:
            type: ntfy
            url: http://ntfy.operations:80
            topic: alerts
            key: '{{ "{{" }}HOMEPAGE_VAR_NTFY_TOKEN{{ "}}" }}'
    - Health:
      - Cluster:
          id: cluster
          icon: kubernetes.png
          description: Nodes, pods and restarts
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Nodes Ready
              query: sum(kube_node_status_condition{condition="Ready",status="true"})
            - label: Unhealthy Pods
              query: sum(max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} or {__name__=~"kube_pod_(init_)?container_status_waiting_reason",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}))
            - label: Restarts 1h
              query: floor(sum(increase(kube_pod_container_status_restarts_total[1h])))
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            highlight:
              Nodes Ready:
                numeric:
                - level: danger
                  when: lt
                  value: 3
              Unhealthy Pods:
                numeric:
                - level: warn
                  when: gt
                  value: 0
              Restarts 1h:
                numeric:
                - level: warn
                  when: gte
                  value: 3
      - Edge & WAN:
          id: edge-wan
          icon: mdi-earth
          href: https://traefik.internal.starktastic.net
          description: Internet, the admin gate and probes
          namespace: monitoring
          app: prometheus
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Internet
              query: min(probe_success{tier="external"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Admin Gate
              query: min(probe_success{tier=~"gate|gate-negative"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Alert Path
              query: min(probe_success{tier="alert-pipeline"})
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Failed Probes
              query: (count(probe_success == 0) or vector(0)) and count(probe_success)
            highlight:
              Internet:
                numeric:
                - level: danger
                  when: lt
                  value: 100
              Admin Gate:
                numeric:
                - level: danger
                  when: lt
                  value: 100
              Alert Path:
                numeric:
                - level: warn
                  when: lt
                  value: 100
              Failed Probes:
                numeric:
                - level: warn
                  when: gt
                  value: 0
      - Security:
          id: security
          icon: crowdsec.png
          description: Bans, detections, bad requests
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Active Bans
              query: (sum(cs_active_decisions) or vector(0)) and count(up{job="crowdsec-service"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Falco 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: 4xx/5xx 1h
              query: (sum(increase(traefik_entrypoint_requests_total{code=~"4..|5.."}[1h])) or vector(0)) and count(traefik_entrypoint_requests_total)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
      - Memory:
          id: memory
          icon: mdi-memory
          description: Limits, OOM kills, node headroom
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Near Limit
              query: count(ALERTS{alertname="ContainerMemoryNearLimit",alertstate="firing"}) or vector(0)
            - label: OOM Killed
              query: count(ALERTS{alertname="ContainerOOMKilled",alertstate="firing"}) or vector(0)
            - label: Top Container
              query: max(max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}))
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: Node Free
              query: min(node_memory_MemAvailable_bytes)
              format:
                type: bytes
            highlight:
              Near Limit:
                numeric:
                - level: warn
                  when: gt
                  value: 0
              OOM Killed:
                numeric:
                - level: danger
                  when: gt
                  value: 0
              Top Container:
                numeric:
                - level: warn
                  when: gte
                  value: 90
      - Capacity:
          id: capacity
          icon: mdi-harddisk
          description: CSI slots, fullest volume, TSDB
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: CSI Slots Free
              query: sum(clamp_min(homelab:proxmox_csi_slots_free:count, 0)) or vector(0)
            - label: Tightest Worker
              query: min(homelab:proxmox_csi_slots_free:count)
            - label: Fullest Volume
              query: max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            - label: TSDB Use
              query: (sum(prometheus_tsdb_storage_blocks_bytes) + sum(prometheus_tsdb_wal_storage_size_bytes) + sum(prometheus_tsdb_head_chunks_storage_size_bytes)) / sum(prometheus_tsdb_retention_limit_bytes)
              format:
                type: percent
                scale: 100
                options:
                  maximumFractionDigits: 0
            highlight:
              CSI Slots Free:
                numeric:
                - level: danger
                  when: eq
                  value: 0
                - level: warn
                  when: lt
                  value: 10
              Tightest Worker:
                numeric:
                - level: warn
                  when: lte
                  value: 3
              Fullest Volume:
                numeric:
                - level: danger
                  when: gte
                  value: 95
                - level: warn
                  when: gte
                  value: 90
      - Backups:
          id: backups
          icon: mdi-backup-restore
          description: Database and certificate dumps
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 300000
            metrics:
            - label: Postgres Dump
              query: (time() - max(kube_cronjob_status_last_successful_time{namespace="databases",cronjob="pg-backup"})) / 3600
              format:
                type: number
                suffix: ' h'
                options:
                  maximumFractionDigits: 1
            - label: Cert Backup
              query: (time() - max(kube_cronjob_status_last_successful_time{namespace="cert-backup",cronjob="cert-backup"})) / 3600
              format:
                type: number
                suffix: ' h'
                options:
                  maximumFractionDigits: 1
            - label: Stale Jobs
              query: count(ALERTS{alertname="CronJobNotSucceededRecently",alertstate="firing"}) or vector(0)
            highlight:
              Postgres Dump:
                numeric:
                - level: warn
                  when: gt
                  value: 26
              Cert Backup:
                numeric:
                - level: warn
                  when: gt
                  value: 26
              Stale Jobs:
                numeric:
                - level: warn
                  when: gt
                  value: 0
