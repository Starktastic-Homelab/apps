apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - network-policy.yaml
  - pgadmin-postgres-secret.yaml
  - pgadmin-secret.yaml
  - postgres-completion-gate.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pgadmin-retained-startup-guard
    namespace: databases
    files:
      - guard.py=retained-startup/guard.py
      - main.sql=retained-startup/main.sql
