  widgets.yaml: |
    - logo:
        icon: /icons/favicon.svg
    - customapi:
        url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/query?query=min(probe_success%7Btier%3D%22external%22%7D)
        icon: mdi-earth
        refreshInterval: 60000
        mappings:
        - field: data.result.0.value.1
          label: Internet
          remap:
          - value: '1'
            to: Online
          - value: '0'
            to: Down ⚠
          - any: true
            to: Unknown
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: false
    - search:
        provider: custom
        url: https://search.starktastic.net/search?q=
        target: _blank
    - openmeteo:
        label: Home
        latitude: 32.08
        longitude: 34.78
        timezone: Asia/Jerusalem
        units: metric
    - stocks:
        provider: finnhub
        color: true
        cache: 5
        watchlist:
        - NVDA
        - AMD
        - INTC
        - MSFT
        - GOOGL
        - AAPL
        - TSM
    - datetime:
        text_size: xl
        locale: en-GB
        format:
          weekday: short
          day: numeric
          month: short
          hour: 2-digit
          minute: 2-digit
          hourCycle: h23
  services.yaml: |
    - At a Glance:
      - Cluster Health:
          id: cluster-health
          icon: kubernetes.png
          description: Nodes, pods, alerts, volumes
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Nodes Ready
              query: sum(kube_node_status_condition{condition="Ready",status="true"})
            - label: Unhealthy Pods
              query: sum(max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} or {__name__=~"kube_pod_(init_)?container_status_waiting_reason",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}))
            - label: Firing Alerts
              query: (sum(ALERTS{alertstate="firing",alertname!~"Watchdog|InfoInhibitor"}) or vector(0)) and count(ALERTS{alertname="Watchdog",alertstate="firing"})
            - label: Fullest Volume
              query: max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
              format:
                type: percent
                scale: 100
      - Edge & Certs:
          id: edge-certs
          icon: traefik.png
          href: https://traefik.internal.starktastic.net
          description: Probes, certificates, traffic
          namespace: monitoring
          app: prometheus
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 30000
            metrics:
            - label: Failed Probes
              query: (count(probe_success == 0) or vector(0)) and count(probe_success)
            - label: Cert Expiry
              query: min(certmanager_certificate_expiration_timestamp_seconds{issuer_name="letsencrypt-prod"} > 0) - time()
              format:
                type: number
                scale: 1/86400
                suffix: ' days'
                options:
                  maximumFractionDigits: 0
            - label: Requests
              query: sum(rate(traefik_entrypoint_requests_total[5m]))
              format:
                type: number
                suffix: ' req/s'
                options:
                  maximumFractionDigits: 1
            - label: p95 Latency
              query: histogram_quantile(0.95, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket[5m])))
              format:
                type: number
                scale: 1000
                suffix: ' ms'
                options:
                  maximumFractionDigits: 0
      - Security:
          id: security
          icon: crowdsec.png
          description: Bans, detections, bad requests
          app: prometheus
          href: https://grafana.internal.starktastic.net
          namespace: monitoring
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            refreshInterval: 60000
            metrics:
            - label: Active Bans
              query: (sum(cs_active_decisions) or vector(0)) and count(up{job="crowdsec-service"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Falco 24h
              query: floor(sum(increase((sum by (pod) (falcosecurity_falcosidekick_falco_events_total) or 0 * sum by (pod) (up{job="falco-falcosidekick"} == 1))[24h:1m]))) and count(up{job="falco-falcosidekick"} == 1)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: 4xx/5xx 1h
              query: (sum(increase(traefik_entrypoint_requests_total{code=~"4..|5.."}[1h])) or vector(0)) and count(traefik_entrypoint_requests_total)
              format:
                type: number
                options:
                  maximumFractionDigits: 0
