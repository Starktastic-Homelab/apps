controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/calibrain/shelfmark
          tag: v1.6.1@sha256:b849621fcfdb6ec222d3aa1aa1050ebb67facfe2580190c044fd2c1c57df712a
        env:
          FLASK_PORT: "8084"
          INGEST_DIR: /books
          HIDE_LOCAL_AUTH: "true"
          DISABLE_LOCAL_AUTH: "true"
          OIDC_AUTO_REDIRECT: "true"
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8084
          readiness:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8084
          startup:
            enabled: true
            type: HTTP
            path: /api/health
            port: 8084
    replicas: 1
    strategy: Recreate
    pod:
      securityContext: {}
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
    initContainers:
      retained-state:
        image:
          repository: python
          digest: sha256:a11116e648ddd8a05e1120014c8e6ac259f718040b67e2dcd6a7c0b7bab3ff2c
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - shelfmark
          - /retained
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 8084
persistence:
  ingest:
    existingClaim: cwa-book-ingest
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /books
  media:
    enabled: true
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /data
  config:
    enabled: false
  retained-config:
    existingClaim: shelfmark-config-block
    globalMounts: []
    advancedMounts:
      main:
        main:
          - path: /config
        retained-state:
          - path: /retained
            readOnly: true
  retained-startup:
    type: configMap
    name: media-retained-startup-guard
    defaultMode: 292
    globalMounts: []
    advancedMounts:
      main:
        retained-state:
          - path: /retained-startup
            readOnly: true
