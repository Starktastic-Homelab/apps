apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - enrollment-completion-roles.yaml
  - enrollment-configmap.yaml
  - enrollment-job.yaml
  - enrollment-secret.yaml
  - postgres-secret.yaml

# The workload mounts this ConfigMap by name from another Argo source, so the name stays fixed.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-retained-startup-guard
    namespace: databases
    files:
      - guard.sh=retained-startup/guard.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
