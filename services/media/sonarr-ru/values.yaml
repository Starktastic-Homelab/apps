controllers:
  main:
    containers:
      main:
        env:
          SONARR__SERVER__ALLOWEDHOSTS: sonarr-ru,sonarr-ru.media,sonarr-ru.internal.starktastic.net
          # Trust Traefik's X-Forwarded-For from the pod network, or every ingress request needs the app's own login.
          SONARR__SERVER__TRUSTEDNETWORKS: 10.42.0.0/16
    initContainers:
      retained-state:
        command:
          - python3
          - -I
          - -B
          - /retained-startup/guard.py
          - sonarr-ru
          - /retained
persistence:
  retained-config:
    existingClaim: sonarr-ru-config-block
