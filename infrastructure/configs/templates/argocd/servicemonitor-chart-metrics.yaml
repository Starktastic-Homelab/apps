# Scrapes the chart's applicationset and notifications metrics Services, which ansible
# turns on (roles/bootstrap_cluster/tasks/argocd.yml). The ServiceMonitors live here
# because the chart skips its own when the Prometheus CRDs are missing, as on a fresh
# cluster. The application controller keeps its own pair (metrics-service.yaml,
# servicemonitor.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-applicationset-controller-metrics
  namespace: argocd
spec:
  endpoints:
    - port: http-metrics
      path: /metrics
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/component: applicationset-controller
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-notifications-controller-metrics
  namespace: argocd
spec:
  endpoints:
    - port: http-metrics
      path: /metrics
      # argocd_notifications_deliveries_total names the notifier in its own `service`
      # label. Without this it is renamed exported_service and `service` is the
      # Kubernetes Service, which ArgoCDNotificationDeliveryFailing groups by.
      honorLabels: true
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/component: notifications-controller
