apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: calibre-retired-config-source-hold
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
        scope: Namespaced
  matchConditions:
    - name: retired-calibre-config
      expression: >-
        object.metadata.namespace == 'media' && has(object.spec.volumes) && object.spec.volumes.exists(v,
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'calibre-web')
  validations:
    - expression: "false"
      message: Retired Calibre NFS configuration is held; accepted CSI state must be used.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: calibre-retired-config-source-hold
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  policyName: calibre-retired-config-source-hold
  validationActions: [Deny]
