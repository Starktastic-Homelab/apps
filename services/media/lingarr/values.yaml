controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/lingarr-translate/lingarr
          tag: 1.3.0@sha256:12473f6f40beac1bb91ffadc7d8c7f1c2a0cd99ba336e4bf2c1dfa617c27a763
        env:
          # Translation backend
          SERVICE_TYPE: "libretranslate"
          LIBRE_TRANSLATE_URL: "http://libretranslate.media:5000"

          # Database
          DB_CONNECTION: "postgres"
          DB_HOST: "postgres-postgresql.databases"
          DB_PORT: "5432"
          DB_DATABASE: "lingarr"
          DB_USERNAME: "lingarr"

          # Sonarr / Radarr (EN instances only)
          SONARR_URL: "http://sonarr.media:8989"
          RADARR_URL: "http://radarr.media:7878"

          # Languages
          SOURCE_LANGUAGES: '[{"name":"English","code":"en"}]'
          TARGET_LANGUAGES: '[{"name":"Hebrew","code":"he"},{"name":"Russian","code":"ru"}]'
        envFrom:
          - secretRef:
              name: lingarr-secret
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              failureThreshold: 30
              periodSeconds: 5

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

persistence:
  config:
    enabled: false
  lingarr-config:
    type: persistentVolumeClaim
    storageClass: nfs-pv
    size: 1Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /app/config
  media:
    enabled: true
